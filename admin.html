<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herix 运营后台</title>
<style>
:root{--primary:#D43B27;--sidebar:#0f172a;--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--sidebar-w:220px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--sidebar);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .25s}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.content{padding:24px 28px;flex:1}
.sb-brand{padding:20px 16px 12px;font-size:15px;font-weight:800;color:#fff;letter-spacing:.5px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.sb-brand span{color:var(--primary)}
.sb-section{padding:10px 16px 4px;font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,.25);text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 14px;margin:1px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.55);transition:all .15s}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-item.active{background:var(--primary);color:#fff}
.sb-icon{font-size:15px;width:20px;text-align:center}
.sb-badge{background:#ef4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:auto}
.sb-bottom{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.35)}
.sb-logout{cursor:pointer;margin-top:4px}
.sb-logout:hover{color:#fff}
.page-title{font-size:17px;font-weight:700}
.btn{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{border-color:#94a3b8}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:#fff;border-radius:12px;padding:18px;border:1px solid var(--border)}
.stat-val{font-size:26px;font-weight:700;margin-bottom:3px}
.stat-lbl{font-size:12px;color:var(--muted)}
.stat-sub{font-size:11px;margin-top:2px}
/* Chart */
.chart-card{background:#fff;border-radius:12px;padding:20px;border:1px solid var(--border);margin-bottom:20px}
.chart-title{font-size:14px;font-weight:600;margin-bottom:16px}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:80px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bar{background:var(--primary);border-radius:4px 4px 0 0;width:100%;min-height:2px;transition:height .3s}
.bar-lbl{font-size:10px;color:var(--muted);white-space:nowrap}
.bar-val{font-size:10px;color:var(--text);font-weight:600}
/* Table */
.tcard{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.thead{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.ttitle{font-size:14px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{padding:9px 20px;text-align:left;font-size:11px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);background:#f8fafc;text-transform:uppercase;letter-spacing:.3px}
td{padding:11px 20px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc;cursor:pointer}
.tag{display:inline-flex;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.tag-open,.tag-active{background:#dcfce7;color:#166534}
.tag-draft,.tag-pending{background:#fef3c7;color:#92400e}
.tag-completed,.tag-approved{background:#e0e7ff;color:#3730a3}
.tag-cancelled,.tag-rejected,.tag-suspended{background:#fee2e2;color:#991b1b}
.tag-paid{background:#dcfce7;color:#166534}
/* Detail panel */
.detail-grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.panel{background:#fff;border-radius:12px;border:1px solid var(--border);padding:18px;margin-bottom:14px}
.panel-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.irow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.irow:last-child{border-bottom:none}
.ikey{color:var(--muted)}
/* Tabs */
.tabs{display:flex;gap:4px;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:18px}
.tab{flex:1;text-align:center;padding:7px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* Action card */
.acard{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.acard-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.acard-title{font-size:13px;font-weight:600}
.acard-sub{font-size:11px;color:var(--muted);margin-bottom:10px}
.acard-btns{display:flex;gap:8px}
/* Alert */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
.alert-error{background:#fee2e2;color:#991b1b}
.alert-success{background:#dcfce7;color:#166534}
/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc}
.login-card{background:#fff;border-radius:16px;padding:40px;width:380px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-logo{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px}
.login-logo span{color:var(--primary)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);outline:none}
.field input:focus,.field select:focus{border-color:var(--primary)}
/* Payout */
.prow{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.prow-info{flex:1}
.prow-name{font-weight:600;font-size:13px}
.prow-meta{font-size:11px;color:var(--muted);margin-top:2px}
.prow-amount{font-size:18px;font-weight:700;color:var(--primary);margin:0 16px}
/* Empty */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px}
/* Search */
.search-bar{display:flex;gap:10px;margin-bottom:16px}
.search-bar input,.search-bar select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:#fff}
.search-bar input:focus,.search-bar select:focus{border-color:var(--primary)}
/* Responsive */
@media(max-width:900px){.stats-grid{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}}
@media(max-width:640px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.stats-grid{grid-template-columns:1fr 1fr}}
.hamburger{display:none;background:none;border:none;cursor:pointer;font-size:20px;padding:4px}
@media(max-width:640px){.hamburger{display:block}}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90}
.overlay.show{display:block}
</style>
<script src="/shared/auth.js"></script>
<script src="/shared/sidebar.js"></script>
</head>
<body>
<div id="root"></div>
<script>
var API='/api';
/* 全站替代原生 showToast() 的悬浮提示（2026-07-18）：深色胶囊，2.2s 自动消失，不阻塞操作 */
function showToast(msg) {
  var el = document.createElement('div');
  el.textContent = String(msg);
  el.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;z-index:99999;pointer-events:none;max-width:80vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25)';
  document.body.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2200);
}

var st={page:'dashboard',user:null,token:null,data:{},msg:null,msgType:'success',subPage:null,filter:{}};

function go(page,sub){st.page=page;st.subPage=sub||null;st.msg=null;st.filter={};load(page);render()}
function render(){
  var r=document.getElementById('root');
  if(!st.user){r.innerHTML=loginPage();bindLogin();return}
  r.innerHTML=shell(pageCont());
  bindShell();
}

function shell(inner){
  var nav=[
    {id:'dashboard',icon:'📊',label:'数据看板'},
    {id:'reviews',icon:'✅',label:'审核中心',badge:(st.data.stats?.pendingDeclarations||0)},
    {id:'topups',icon:'🏦',label:'充值确认',badge:Array.isArray(st.data.topups)?st.data.topups.filter(function(r){return r.status==='pending'}).length:0},
    {id:'withdrawals',icon:'💸',label:'提现打款',badge:Array.isArray(st.data.withdrawals)?st.data.withdrawals.filter(function(r){return r.status==='pending'}).length:0},
    {id:'users',icon:'👥',label:'用户管理'},
    {id:'tasks',icon:'📋',label:'任务管理'},
    {id:'ambassadors',icon:'🌟',label:'赫使列表'},
    {id:'categories',icon:'🏷️',label:'任务分类'},
    {id:'i18n',icon:'🌐',label:'本地化'},
    {id:'pricing',icon:'💰',label:'定价'},
  ];
  var sb='<div class="sidebar" id="sb"><div class="sb-brand"><div style="display:flex;align-items:center;gap:9px"><img src="Logo/herix-orig-icon.png" style="width:30px;height:30px;border-radius:7px;flex-shrink:0"><div>Herix<div style="font-size:9px;color:rgba(255,255,255,.3);font-weight:400;margin-top:1px">ADMIN</div></div></div></div>';
  sb += Sidebar.navItems(nav, { activeId: st.page, onclick: "go('%s')" });
  sb+='<div class="sb-bottom"><div>'+esc(st.user.nickname)+'</div><div class="sb-logout" onclick="logout()">退出登录</div></div></div>';

  var topbar='<div class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="hamburger" onclick="toggleSB()">☰</button><div class="page-title">'+pageTitle()+'</div></div>'
    +'<div>'+topActions()+'</div></div>';
  var msg=st.msg?'<div style="padding:0 28px;margin-top:14px"><div class="alert alert-'+st.msgType+'">'+esc(st.msg)+'</div></div>':'';
  return '<div class="layout">'+sb+'<div class="main">'+topbar+'<div class="content">'+msg+inner+'</div></div></div><div class="overlay" id="ov" onclick="toggleSB()"></div>';
}

function pageTitle(){return{dashboard:'数据看板',reviews:'审核中心',topups:'充值确认',withdrawals:'提现打款',users:'用户管理','brand-edit':'品牌资料编辑',tasks:'任务管理',ambassadors:'赫使列表',categories:'任务分类',i18n:'本地化',pricing:'定价'}[st.page]||''}
function topActions(){
  return '';
}

function pageCont(){
  switch(st.page){
    case 'dashboard': return dashPage();
    case 'reviews': return reviewsPage();
    case 'topups': return topupsPage();
    case 'withdrawals': return withdrawalsPage();
    case 'users': return usersPage();
    case 'brand-edit': return brandEditPage();
    case 'tasks': return tasksPage();
    case 'ambassadors': return ambassadorsPage();
    case 'categories': return categoriesPage();
    case 'i18n': return i18nPage();
    case 'pricing': return pricingPage();
    default: return dashPage();
  }
}

/* ── Login ── */
function loginPage(){
  return '<div class="login-wrap"><div class="login-card">'
    +'<div class="login-logo"><img src="Logo/herix-orig-icon.png" style="width:52px;height:52px;border-radius:13px;display:block;margin:0 auto 8px">Herix</div>'
    +'<div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:24px">平台运营管理后台</div>'
    +Auth.loginForm({
      title: '',
      subtitle: '',
      emailId: 'email',
      passwordId: 'password',
      emailPlaceholder: 'admin@herix.com',
      passwordPlaceholder: '密码',
      fieldClass: 'field',
      titleClass: '',
      subtitleClass: '',
      submitStyle: 'width:100%;padding:11px;margin-top:4px',
      submitBtnClass: '',
    })
    +'</div></div>';
}
function bindLogin(){
  Auth.init({
    api: API + '/auth',
    emailId: 'email',
    passwordId: 'password',
    errorId: 'lerr',
    onLogin: function(d){
      var uRoles=d.user.roles||[d.user.role];
      if(!uRoles.includes('ADMIN')){document.getElementById('lerr').innerHTML='<div class="alert alert-error">此页面仅限平台运营人员</div>';return}
      st.token=d.token;st.user=d.user;go('dashboard');
    },
    onError: function(msg){
      document.getElementById('auth-form-err').innerHTML='<div class="alert alert-error">'+esc(msg)+'</div>';
    }
  });
}

/* ── Dashboard ── */
function dashPage(){
  var s=st.data.stats||{};
  var maxBar=Math.max(1,...(s.daily||[]).map(function(d){return d.count}));
  var bars=(s.daily||[]).map(function(d){
    var h=Math.round((d.count/maxBar)*70)||2;
    return '<div class="bar-col"><div class="bar-val">'+d.count+'</div><div class="bar" style="height:'+h+'px"></div><div class="bar-lbl">'+d.date.slice(5)+'</div></div>';
  }).join('');

  return '<div class="stats-grid">'
    +statCard('本月完成',s.monthCompletions||0,'var(--primary)','📦','单')
    +statCard('在线任务',s.openTasks||0,'#0891b2','📋','个')
    +statCard('赫使总数',s.heralds||0,'#7c3aed','🌟','人')
    +statCard('待审声明 (KYC)',(s.pendingDeclarations||0),'var(--danger)','⚠️','条')
    +'</div>'
    +'<div class="stats-grid" style="grid-template-columns:1fr 1fr 1fr 1fr">'
    +statCard('品牌商家',s.brands||0,'#059669','🏢','家')
    +statCard('本月完成',s.monthCompletions||0,'#7c3aed','✅','条')
    +statCard('本月已结算','¥'+(Number(s.monthPayout||0).toLocaleString()),'#059669','💰','')
    +'</div>'
    +'<div class="chart-card"><div class="chart-title">近7日 — 内容审核通过数</div><div class="bar-chart">'+bars+'</div></div>'
    +(s.pendingDeclarations?'<div class="acard" style="background:#fffbeb;border-color:#fbbf24"><div style="font-size:13px;font-weight:600;color:#92400e;margin-bottom:6px">⚠️ 待处理事项</div><div style="font-size:12px;color:#78350f">'
    +'• '+s.pendingDeclarations+'条 在留声明待审核<br>'
    +'</div><button class="btn btn-sm btn-primary" style="margin-top:10px" onclick="go(\'reviews\')">前往审核</button></div>':'');
}

function statCard(label,val,color,icon,unit){
  return '<div class="stat"><div style="display:flex;justify-content:space-between"><div><div class="stat-val" style="color:'+color+'">'+val+'<span style="font-size:13px;font-weight:400;color:var(--muted)"> '+unit+'</span></div><div class="stat-lbl">'+label+'</div></div><div style="font-size:28px;opacity:.2">'+icon+'</div></div></div>';
}

/* ── Reviews ── */
function reviewsPage(){
  var decls=st.data.decls||[];
  var taskRv=st.data.taskReviews||[];
  var kybRv=st.data.kybReviews||[];
  var tab=st.subPage||'decls';
  var h='<div class="tabs">'
    +'<div class="tab'+(tab==='decls'?' active':'')+'" onclick="switchTab(\'decls\')">在留声明 ('+decls.length+')</div>'
    +'<div class="tab'+(tab==='taskrv'?' active':'')+'" onclick="switchTab(\'taskrv\')">任务审核 ('+taskRv.length+')</div>'
    +'<div class="tab'+(tab==='kyb'?' active':'')+'" onclick="switchTab(\'kyb\')">商家认证 ('+kybRv.length+')</div>'
    +'</div>';

  if(tab==='taskrv'){
    if(!taskRv.length) return h+'<div class="empty"><div class="empty-icon">✅</div>暂无待审任务</div>';
    return h+taskRv.map(function(r){
      return '<div class="acard"><div class="acard-hdr"><span class="acard-title">'+esc(r.title)+'</span>'
        +'<span style="font-size:11px;color:var(--muted)">'+(r.published_at?fmtLocal(r.published_at):'')+'</span></div>'
        +'<div class="acard-sub">'+esc(r.company_name||r.creator_name||'')+(r.is_agency?' <span style="color:#c2410c">[广告代理]</span>':'')+' · '+esc(r.creator_email||'')
        +' · '+(r.mode==='PERFORMANCE'?'类A·推广码':'类B·内容')+' · ¥'+Number(r.payout_per_herald||0).toLocaleString()+'/人 × '+(r.max_heralds||0)+'</div>'
        +'<div style="font-size:12px;color:#555;margin:8px 0;line-height:1.6;max-height:120px;overflow-y:auto;background:#f9fafb;border-radius:8px;padding:8px 10px">'+esc(r.description||'')+'</div>'
        +'<div class="acard-btns"><button class="btn btn-success btn-sm" onclick="doTaskReview(\''+r.id+'\',true)">✓ 通过上线</button>'
        +'<button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="doTaskReview(\''+r.id+'\',false)">✗ 拒绝</button></div></div>';
    }).join('');
  }
  if(tab==='kyb'){
    var tc=st.data.trialCredit;
    h+='<div class="card" style="padding:14px 18px;margin-bottom:16px">'
      +'<div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px">首单体验额度 · 站点级默认值（当前：日本站 JPY）</div>'
      +'<div style="display:flex;gap:8px;align-items:center"><input id="kyb-trial-credit" type="number" value="'+(tc!=null?tc:'')+'" style="width:140px">'
      +'<button class="btn btn-primary btn-sm" onclick="saveTrialCredit()">保存</button></div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:4px">首个任务发布时按 min(此值, 任务总成本) 自动发放，绑定该任务、任务关闭后随之失效；已发放的不受改动影响。站点为单位配置，无商家维度；多站点上线后按站点分别设置。商户端不展示此概念，只感知首单可发布</div></div>';
    if(!kybRv.length) return h+'<div class="empty"><div class="empty-icon">✅</div>暂无待审认证</div>';
    return h+kybRv.map(function(r){
      return '<div class="acard"><div class="acard-hdr"><span class="acard-title">'+esc(r.company_name||r.nickname||'')+(r.is_agency?' <span style="font-size:11px;color:#c2410c">[广告代理]</span>':'')+'</span>'
        +'<span style="font-size:11px;color:var(--muted)">'+(r.kyb_submitted_at?fmtLocal(r.kyb_submitted_at):'')+'</span></div>'
        +'<div class="acard-sub">'+esc(r.email||'')+' · 注册地：'+esc(r.country||'')+(r.website?' · '+esc(r.website):'')+'</div>'
        +(r.kyb_doc_url?'<a href="'+esc(r.kyb_doc_url)+'" target="_blank"><img src="'+esc(r.kyb_doc_url)+'" style="max-width:260px;max-height:180px;border:1px solid var(--border);border-radius:8px;margin:8px 0;object-fit:contain"></a>':'<div style="font-size:12px;color:var(--danger);margin:8px 0">⚠️ 无证件图</div>')
        +'<div class="acard-btns"><button class="btn btn-success btn-sm" onclick="doKyb(\''+r.user_id+'\',true)">✓ 通过认证</button>'
        +'<button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="doKyb(\''+r.user_id+'\',false)">✗ 拒绝</button></div></div>';
    }).join('');
  }
  if(!decls.length) return h+'<div class="empty"><div class="empty-icon">✅</div>暂无待审声明</div>';
  return h+decls.map(function(d){
      return '<div class="acard"><div class="acard-hdr"><span class="acard-title">'+esc(d.nickname)+'</span><span style="font-size:11px;color:var(--muted)">'+fmtLocal(d.submitted_at).slice(0,10)+'</span></div>'
        +'<div class="acard-sub">在留资格：'+esc(({permanent:'永住者',work:'就労',student:'留学',other:'其他'})[d.visa_type]||d.visa_type)+' · '+esc(d.email||'')+'</div>'
        +'<div class="acard-btns"><button class="btn btn-success btn-sm" onclick="doDecl(\''+d.id+'\',true)">✓ 通过</button>'
        +'<button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="doDecl(\''+d.id+'\',false)">✗ 拒绝</button></div></div>';

function saveCreditLimit(userId){
  var val=document.getElementById('be_credit_limit')?.value?.trim();
  var limit=val===''||val===undefined?null:Number(val);
  if(limit!==null&&(isNaN(limit)||limit<0)){
    document.getElementById('creditLimitMsg').textContent='请输入有效金额';return;
  }
  apiPatch('/admin/brands/'+userId+'/credit-limit',{creditLimit:limit},function(d){
    var msg=document.getElementById('creditLimitMsg');
    if(d.error){if(msg)msg.textContent=d.error;return}
    if(msg)msg.textContent=limit===null?'已恢复全局默认':'已保存，信用额度 ¥'+Number(limit).toLocaleString();
    st.data.brandEdit.credit_limit_override=limit;
    render();
  });
}
function clearCreditLimit(userId){

function uploadAdminBrandAsset(type,userId,input){
  var file=input.files&&input.files[0];
  if(!file) return;
  var msgEl=document.getElementById('beAssetMsg');
  if(msgEl) msgEl.textContent='上传中...';
  var fd=new FormData();
  fd.append('file',file);
  var x=new XMLHttpRequest();
  x.open('POST',API+'/admin/brands/'+userId+'/'+type,true);
  if(st.token) x.setRequestHeader('Authorization','Bearer '+st.token);
  x.onload=function(){
    var d;try{d=JSON.parse(x.responseText)}catch(e){d={}}
    if(d.error){if(msgEl)msgEl.textContent=d.error;return}
    if(type==='logo') st.data.brandEdit.logo_url=d.url;
    else st.data.brandEdit.promo_image_url=d.url;
    if(msgEl)msgEl.textContent='上传成功';
    render();
  };
  x.onerror=function(){if(msgEl)msgEl.textContent='上传失败'};
  x.send(fd);
}

function rejectTopup(id){

}

}

function showAddCat(){
  var w=document.getElementById('cat-form-wrap');
  if(!w) return;
  document.getElementById('cat-form-title').textContent='新建分类';
  document.getElementById('cf-id').value=''; document.getElementById('cf-id').disabled=false;
  document.getElementById('cf-label').value='';
  document.getElementById('cf-icon').value='';
  document.getElementById('cf-sort').value='99';
  w._editId=null; w.style.display='block';
  document.getElementById('cf-id').focus();
}

function editCat(id){
  var cats=st.data.categories||[];
  var c=cats.find(function(x){return x.id===id}); if(!c) return;
  var w=document.getElementById('cat-form-wrap'); if(!w) return;
  document.getElementById('cat-form-title').textContent='编辑分类';
  document.getElementById('cf-id').value=c.id; document.getElementById('cf-id').disabled=true;
  document.getElementById('cf-label').value=c.label;
  document.getElementById('cf-icon').value=c.icon||'';
  document.getElementById('cf-sort').value=c.sort_order;
  w._editId=id; w.style.display='block';
}

function saveCat(){
  var w=document.getElementById('cat-form-wrap');
  var editId=w?w._editId:null;
  var id=(document.getElementById('cf-id').value||'').trim();
  var label=(document.getElementById('cf-label').value||'').trim();
  var icon=(document.getElementById('cf-icon').value||'').trim();
  var sort=parseInt(document.getElementById('cf-sort').value)||99;
  if(!label) return showCatMsg('请填写名称','error');
  if(!editId && !id) return showCatMsg('请填写 ID','error');
  if(!editId){
    post('/categories',{id:id,label:label,icon:icon,sort_order:sort},function(d){
      if(d.error) return showCatMsg(d.error,'error');
      w.style.display='none';
      apiGet('/categories/all',function(cats){st.data.categories=cats;render()});
    });
  } else {
    apiPatch('/categories/'+editId,{label:label,icon:icon,sort_order:sort},function(d){
      if(d.error) return showCatMsg(d.error,'error');
      w.style.display='none';
      apiGet('/categories/all',function(cats){st.data.categories=cats;render()});
    });
  }
}

function toggleCat(id,active){
  apiPatch('/categories/'+id,{active:active},function(d){
    if(d.error) return showToast(d.error);
    apiGet('/categories/all',function(cats){st.data.categories=cats;render()});
  });
}

function showCatMsg(msg,type){
  var el=document.getElementById('cat-msg'); if(!el) return;
  el.innerHTML='<div style="padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;background:'+(type==='error'?'#fee2e2':'#dcfce7')+';color:'+(type==='error'?'#dc2626':'#16a34a')+'">'+esc(msg)+'</div>';
  setTimeout(function(){el.innerHTML=''},3000);
}

function doDecl(id,approve){
  var reason=approve?null:prompt('拒绝原因（可选）');
  if(reason===null&&!approve) return;
  post('/admin/declarations/'+id+'/'+(approve?'approve':'reject'),{reason:reason},function(d){

    st.data.decls=(st.data.decls||[]).filter(function(x){return x.id!==id});

function pct(r){return r===null||r===undefined?'':String(Math.round(Number(r)*10000)/100)}

    h+='</tbody></table>';
  }
  h+='<div style="display:flex;gap:8px;margin-top:10px;align-items:center"><span style="font-size:12px;color:var(--muted)">新增线路:</span>'
    +'<input id="po-new-from" placeholder="JP" maxlength="2" style="width:60px;padding:6px;border:1px solid var(--border);border-radius:6px">'
    +'<span>→</span><input id="po-new-to" placeholder="US" maxlength="2" style="width:60px;padding:6px;border:1px solid var(--border);border-radius:6px">'
    +'<button class="btn btn-outline btn-sm" onclick="addPayoutRule()">添加</button></div>';
  // 汇率中间价
  h+='<div style="font-weight:600;margin:14px 0 6px;font-size:13px">汇率中间价(锁价基准;每6小时自动同步 ECB 市场价,手动修改会被下次同步覆盖;偏离超15%的异常值会被拒写)</div>';
  h+=(po.fxRates||[]).map(function(f){var pair=f.key.replace('fx_mid_','');
    return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span style="width:90px;font-family:monospace">'+esc(pair)+'</span>'
      +'<input id="po-fx-'+pair+'" type="number" step="0.0001" value="'+esc(f.value)+'" style="width:120px;padding:6px;border:1px solid var(--border);border-radius:6px">'
      +'<button class="btn btn-primary btn-sm" onclick="saveFxRate(\''+pair+'\')">保存</button>'
      +'<span style="font-size:11px;color:var(--muted)">更新于 '+esc(fmtLocal(f.updated_at))+'</span></div>';
  }).join('');
  // 汇率历史
  var fxh=st.data.fxHistory||[];
  h+='<div style="margin-top:14px"><div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px">最近同步记录</div>';
  if(!fxh.length){h+='<div style="font-size:12px;color:var(--muted)">暂无记录</div>';}
  else{
    h+='<table style="font-size:12px;width:100%"><thead><tr><th>币对</th><th>汇率</th><th>来源</th><th>时间</th></tr></thead><tbody>';
    h+=fxh.map(function(r){
      return '<tr><td style="font-family:monospace">'+esc(r.pair)+'</td>'
        +'<td style="font-family:monospace">'+r.rate+'</td>'
        +'<td style="color:var(--muted)">'+(r.source==='manual'?'<span style="color:#d97706">手动</span>':esc(r.source))+'</td>'
        +'<td style="color:var(--muted)">'+fmtLocal(r.synced_at)+'</td></tr>';
    }).join('');
    h+='</tbody></table>';
  }
  h+='</div></div>';

  return h;
}
function _prReload(msg){st.msg=msg;st.msgType='success';apiGet('/admin/pricing',function(d){st.data.pricing=d;render()});apiGet('/admin/pricing/payout-rules',function(d){st.data.payout=d;render()});apiGet('/admin/pricing/fx-history',function(d){st.data.fxHistory=Array.isArray(d)?d:[];render()})}
function loadPayoutRules(){apiGet('/admin/pricing/payout-rules',function(d){st.data.payout=d;render()})}
function savePayoutRule(from,to,cur){
  var tiersRaw=(document.getElementById('po-t-'+from+to)||{}).value||'';
  var bps=Number((document.getElementById('po-m-'+from+to)||{}).value)||0;
  var tiers;try{tiers=JSON.parse(tiersRaw)}catch(e){showToast('阶梯 JSON 格式错误');return}
  apiPut('/admin/pricing/payout-rules',{fromCountry:from,toCountry:to,currency:cur,tiers:tiers,fxMarkupBps:bps},function(d){if(d.error){showToast(d.error);return}st.msg='打款费率已保存';st.msgType='success';loadPayoutRules()});
}
function addPayoutRule(){
  var from=(document.getElementById('po-new-from')||{}).value||'',to=(document.getElementById('po-new-to')||{}).value||'';
  if(!from||!to){showToast('填转出/转入国二位代码');return}
  apiPut('/admin/pricing/payout-rules',{fromCountry:from,toCountry:to,currency:'JPY',tiers:[{upTo:null,fee:500}],fxMarkupBps:from===to?0:150},function(d){if(d.error){showToast(d.error);return}loadPayoutRules()});
}
function saveFxRate(pair){
  var v=Number((document.getElementById('po-fx-'+pair)||{}).value);
  if(!(v>0)){showToast('汇率须为正数');return}
  apiPatch('/admin/pricing/payout-fx',{pair:pair,rate:v},function(d){if(d.error){showToast(d.error);return}st.msg='汇率已更新';st.msgType='success';loadPayoutRules();apiGet('/admin/pricing/fx-history',function(h){st.data.fxHistory=Array.isArray(h)?h:[];render()});});
}
function _prErr(d){st.msg=d.error||'操作失败';st.msgType='danger';render()}
function saveOperatorEntity(){
  var v=((document.getElementById('pr-operator')||{}).value||'').trim();
  if(!v){showToast('运营主体名称不能为空');return}
  apiPatch('/admin/pricing/operator-entity',{name:v},function(d){if(d.error){_prErr(d);return}st.data.platformInfo={operatorEntity:d.operatorEntity};st.msg='运营主体已更新';st.msgType='success';render()});
}
function savePricingGlobal(){
  var v=parseFloat(document.getElementById('pr-global').value);
  if(isNaN(v)||v<0||v>=100){_prErr({error:'费率须为 0~99.9 的百分数'});return}
  apiPatch('/admin/pricing',{commissionRate:v/100},function(d){if(d.error){_prErr(d);return}_prReload('全局费率已更新为 '+v+'%')});
}
function savePricingBrand(id){
  var v=document.getElementById('pr-b-'+id).value, note=document.getElementById('pr-bn-'+id).value;
  if(v===''){_prErr({error:'要清除协议价请用「清除」按钮'});return}
  var r=parseFloat(v);
  if(isNaN(r)||r<0||r>=100){_prErr({error:'费率须为 0~99.9 的百分数'});return}
  apiPatch('/admin/pricing/brand/'+id,{rate:r/100,note:note},function(d){if(d.error){_prErr(d);return}_prReload('协议费率已保存: '+r+'%')});
}
function clearPricingBrand(id){
  apiPatch('/admin/pricing/brand/'+id,{rate:null,note:null},function(d){if(d.error){_prErr(d);return}_prReload('已清除协议价, 该商家回到全局默认')});
}
function createPromo(){
  var scope=document.getElementById('pm-scope').value;
  var body={scope:scope,rate:parseFloat(document.getElementById('pm-rate').value)/100,
    startsAt:document.getElementById('pm-start').value,endsAt:document.getElementById('pm-end').value,
    note:document.getElementById('pm-note').value};
  if(scope==='brand')body.brandId=document.getElementById('pm-brand').value;
  if(isNaN(body.rate)||body.rate<0||body.rate>=1){_prErr({error:'促销费率须为 0~99.9 的百分数'});return}
  if(!body.startsAt||!body.endsAt){_prErr({error:'请选择起止时间'});return}
  post('/admin/pricing/promotions',body,function(d){if(d.error){_prErr(d);return}_prReload('促销已创建')});
}
function cancelPromo(id){
  if(!confirm('确认终止该促销? 终止后立即失效(已发布任务不受影响)'))return;
  apiPatch('/admin/pricing/promotions/'+id+'/cancel',{},function(d){if(d.error){_prErr(d);return}_prReload('促销已终止')});
}

/* ── 本地化词条矩阵 ──
   key 由代码 seed（herix-server/scripts/seed-i18n.ts）创建，此处只改译文不建 key。
   缺译输入框标红；保存按行提交。空值=清空该语言译文（前端回退打包词典/中文）。*/
function i18nPage(){
  var rows=st.data.i18n||[];
  var q=(st.filter.q||'');var ql=q.toLowerCase();
  var shown=q?rows.filter(function(r){return r.key.toLowerCase().indexOf(ql)>=0||(r.zh||'').indexOf(q)>=0||(r.ja||'').indexOf(q)>=0||(r.en||'').toLowerCase().indexOf(ql)>=0||(r.context||'').indexOf(q)>=0}):rows;
  var h='<div class="search-bar"><input id="i18nq" placeholder="搜索 key / 译文" value="'+esc(q)+'" onkeydown="if(event.key===\'Enter\')searchI18n()">'
    +'<button class="btn btn-outline btn-sm" onclick="searchI18n()">搜索</button>'
    +'<span style="font-size:12px;color:var(--muted);margin-left:8px">共 '+rows.length+' 词条 · 缺译标红 · key/语境由代码管理，此处只改译文；语境=该词条的使用位置与参数说明</span></div>';
  if(!shown.length) return h+'<div class="empty"><div class="empty-icon">🌐</div>'+(rows.length?'无匹配词条':'暂无词条，先在服务器执行 scripts/seed-i18n.ts')+'</div>';
  h+='<div class="tcard"><table><thead><tr><th style="width:16%">key</th><th style="width:17%">语境</th><th>中文</th><th>日本語</th><th>English</th><th style="width:64px"></th></tr></thead><tbody>';
  h+=shown.map(function(r){
    var kid=r.key.replace(/[^a-zA-Z0-9]/g,'_');
    function cell(loc){var v=r[loc]||'';return '<td><input id="i18n-'+loc+'-'+kid+'" value="'+esc(v)+'" style="width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid '+(v?'var(--border)':'var(--danger)')+';border-radius:6px;font-size:12px"></td>'}
    return '<tr><td style="font-family:monospace;font-size:11px;color:var(--muted);word-break:break-all">'+esc(r.key)+'</td>'
      +'<td style="font-size:11px;color:var(--muted);line-height:1.5">'+esc(r.context||'')+'</td>'+cell('zh')+cell('ja')+cell('en')
      +'<td><button class="btn btn-primary btn-sm" onclick="saveI18n(\''+esc(r.key)+'\',\''+kid+'\')">保存</button></td></tr>';
  }).join('');
  return h+'</tbody></table></div>';
}
function searchI18n(){st.filter.q=document.getElementById('i18nq').value;render()}
function saveI18n(key,kid){
  var body={zh:document.getElementById('i18n-zh-'+kid).value,ja:document.getElementById('i18n-ja-'+kid).value,en:document.getElementById('i18n-en-'+kid).value};
  apiPatch('/admin/i18n/'+encodeURIComponent(key),body,function(d){
    if(d.error){st.msg=d.error;st.msgType='danger';render();return}
    st.msg='已保存：'+key;st.msgType='success';
    apiGet('/admin/i18n',function(dd){st.data.i18n=dd.rows||[];render()});
  });
}


/* 时间统一本地化显示：库里有两种存法——Node 写的 ISO UTC(带T/Z)、
   PG 列默认值写的无时区裸串(服务器时区，生产 ECS 固定+08)。
   都转成浏览器本地时间；纯日期(长度<=10)不做时区换算。 */
function fmtLocal(s) {
  if (!s) return '';
  s = String(s);
  if (s.length <= 10) return s;
  var d = s.indexOf('T') >= 0 ? new Date(s) : new Date(s.replace(' ', 'T') + '+08:00');
  if (isNaN(d.getTime())) return s.slice(0, 16).replace('T', ' ');
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function load(page){
  if(page==='pricing'){
    apiGet('/admin/pricing',function(d){st.data.pricing=d;render()});
    apiGet('/platform-info',function(d){st.data.platformInfo=d||{};render()});
    loadPayoutRules();
    apiGet('/admin/pricing/fx-history',function(d){st.data.fxHistory=Array.isArray(d)?d:[];render()});
  } else if(page==='i18n'){
    apiGet('/admin/i18n',function(d){st.data.i18n=d.rows||[];render()});
  } else if(page==='dashboard'){
    apiGet('/admin/stats',function(d){st.data.stats=d;render()});
  } else if(page==='reviews'){
    st.subPage=st.subPage||'decls';
    apiGet('/admin/declarations',function(d){st.data.decls=d;render()});
    apiGet('/admin/task-reviews',function(d){st.data.taskReviews=Array.isArray(d)?d:[];render()});
    apiGet('/admin/kyb-reviews',function(d){st.data.kybReviews=Array.isArray(d)?d:[];render()});
    apiGet('/admin/kyb/trial-credit',function(d){if(d&&d.amount!=null){st.data.trialCredit=d.amount;render()}});
  } else if(page==='topups'){
    apiGet('/admin/topup-requests',function(d){st.data.topups=Array.isArray(d)?d:[];render()});
  } else if(page==='withdrawals'){
    apiGet('/admin/withdrawal-requests',function(d){st.data.withdrawals=Array.isArray(d)?d:[];render()});
  } else if(page==='users'){
    apiGet('/admin/users',function(d){st.data.users=d;render()});
  } else if(page==='tasks'){
    apiGet('/admin/tasks',function(d){st.data.tasks=d;render()});
  } else if(page==='ambassadors'){
    apiGet('/admin/ambassadors',function(d){st.data.ambassadors=d;render()});
  } else if(page==='categories'){
    apiGet('/categories/all',function(d){st.data.categories=Array.isArray(d)?d:[];render()});
  }
}

/* ── API helpers ── */
function apiGet(path,cb){var x=new XMLHttpRequest();x.open('GET',API+path,true);if(st.token)x.setRequestHeader('Authorization','Bearer '+st.token);x.onload=function(){try{cb(JSON.parse(x.responseText))}catch(e){cb({})}};x.send()}
function post(path,body,cb){var x=new XMLHttpRequest();x.open('POST',API+path,true);x.setRequestHeader('Content-Type','application/json');if(st.token)x.setRequestHeader('Authorization','Bearer '+st.token);x.onload=function(){try{cb(JSON.parse(x.responseText))}catch(e){cb({})}};x.send(JSON.stringify(body))}
function apiPut(path,body,cb){var x=new XMLHttpRequest();x.open('PUT',API+path,true);x.setRequestHeader('Content-Type','application/json');if(st.token)x.setRequestHeader('Authorization','Bearer '+st.token);x.onload=function(){try{cb(JSON.parse(x.responseText))}catch(e){cb({})}};x.send(JSON.stringify(body))}
function apiPatch(path,body,cb){var x=new XMLHttpRequest();x.open('PATCH',API+path,true);x.setRequestHeader('Content-Type','application/json');if(st.token)x.setRequestHeader('Authorization','Bearer '+st.token);x.onload=function(){try{cb(JSON.parse(x.responseText))}catch(e){cb({})}};x.send(JSON.stringify(body))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function logout(){st.token=null;st.user=null;render()}
function toggleSB(){document.getElementById('sb').classList.toggle('open');document.getElementById('ov').classList.toggle('show')}
function bindShell(){}

render(); // 初始化渲染
