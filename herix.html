<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Herix 赫使</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#8a8a8e;--primary:#D43B27;--success:#34c759;--gold:#f5a623;--border:#e5e5ea}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;max-width:500px;margin:0 auto;padding-bottom:70px}
.header{display:flex;align-items:center;justify-content:space-between;padding:52px 20px 8px;background:var(--bg)}
.logo{font-size:22px;font-weight:800;letter-spacing:1px}.logo span{color:var(--primary)}
.sub{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.hdr-actions{display:flex;gap:6px}.icon-btn{width:36px;height:36px;border-radius:50%;background:#fff;border:none;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.user-bar{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:6px 20px 10px;background:var(--bg)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.login-btn{font-size:13px;color:var(--primary);cursor:pointer;font-weight:500}
.filters{display:flex;gap:6px;padding:2px 20px 12px;overflow-x:auto;background:var(--bg);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex-shrink:0;padding:5px 14px;border-radius:16px;font-size:12px;background:#e5e5ea;color:#555;cursor:pointer;white-space:nowrap}
.filter.active{background:#111;color:#fff}
.grid{padding:2px 16px 16px}

/* Card */
.task-card{background:#fff;border-radius:16px;margin-bottom:12px;overflow:hidden;display:block;text-decoration:none;color:inherit;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04)}
.task-card:active{transform:scale(.99)}
.card-top{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;background:#f0f0f0;border-radius:12px;padding:4px 10px;font-size:11px;color:#555;font-weight:500}
.mode-tag{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600}
.mode-std{background:rgba(212,59,39,.08);color:var(--primary)}
.mode-perf{background:rgba(245,166,35,.1);color:#b8860b}
.diff-tag{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);margin-left:auto}
.diff-dot{width:5px;height:5px;border-radius:50%}.d-easy{background:var(--success)}.d-medium{background:var(--gold)}.d-hard{background:var(--primary)}
.card-body{display:flex;gap:14px}.card-c{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:6px}
.brand-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.brand-icon{width:18px;height:18px;border-radius:4px;background:#f0ede8;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#9b8b7a;flex-shrink:0;overflow:hidden}
.brand-icon img{width:100%;height:100%;object-fit:contain}
.brand-name{font-size:11px;color:#888}
.commission{font-size:22px;font-weight:700;margin-bottom:4px}
.rating-row{display:flex;align-items:center;gap:2px;margin-bottom:4px}
.star{font-size:11px}.star.on{color:var(--gold)}.star.off{color:#ddd}
.rating-num{font-size:10px;color:var(--gold);font-weight:600;margin-left:2px}
.thumb{width:90px;height:90px;border-radius:10px;flex-shrink:0;background:#f0f0f0;background-size:cover;background-position:center}

/* Tab bar */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:rgba(255,255,255,.95);border-top:1px solid var(--border);backdrop-filter:blur(10px);display:flex;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:50}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0}
.tab-icon{font-size:20px}.tab-label{font-size:10px;color:var(--muted)}
.tab-item.active .tab-label{color:var(--text);font-weight:600}

/* Debug panel */
.db-panel{position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(0,0,0,.85);color:#0f0;font-family:monospace;font-size:11px;padding:6px 10px;max-height:40vh;overflow-y:auto;display:none}
.db-panel.open{display:block}
.db-panel .db-line{margin:1px 0;white-space:pre-wrap;word-break:break-all}
.db-panel .db-err{color:#f44}
.db-btn{position:fixed;top:4px;right:4px;z-index:99999;padding:4px 8px;border:1px solid #0f0;background:#000;color:#0f0;font-family:monospace;font-size:10px;cursor:pointer;border-radius:4px;opacity:.6}
.db-btn:hover{opacity:1}

/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);z-index:9999;background:#323232;color:#fff;font-size:13px;padding:10px 20px;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:all .3s ease;pointer-events:none;max-width:80%;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .check{color:#34c759;margin-right:6px;font-weight:700}

/* Login Modal — hidden with display:none so password managers ignore form fields */
.login-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;overflow-y:auto}
.login-modal.show{display:block}
.login-modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4)}
.login-modal .modal-card{max-width:380px;margin:60px auto;background:#fff;border-radius:20px;padding:32px 28px;box-shadow:0 8px 40px rgba(0,0,0,.12);position:relative;z-index:101}
.login-modal .modal-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px}
.login-modal .modal-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px}
.login-modal .ig{margin-bottom:12px}
.login-modal .ig label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:#555}
.login-modal .ig input{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:14px;outline:none}
.login-modal .ig input:focus{border-color:var(--primary)}
.login-modal .link{text-align:center;margin-top:16px;font-size:13px;color:var(--primary);cursor:pointer}
.login-modal .link:hover{text-decoration:underline}
.login-modal .role-toggle{display:flex;gap:8px;margin-bottom:16px}
.login-modal .role-btn{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;text-align:center;font-size:12px;cursor:pointer;background:#fff}
.login-modal .role-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Detail */
.dtl-hdr{display:flex;align-items:center;gap:16px;padding:52px 16px 12px;background:#fff}
.dtl-back{font-size:22px;cursor:pointer}.dtl-title-h{font-size:16px;font-weight:600}
.dtl-cover{width:100%;height:260px;background-size:cover;background-position:center;background:#e8e8ed}
.dtl-body{padding:20px 16px;background:#fff}
.dtl-cat{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:4px}
.dtl-name{font-size:22px;font-weight:700;margin-bottom:8px}
.dtl-price{font-size:28px;font-weight:700;margin-bottom:12px}
.dtl-desc{font-size:13px;color:#555;line-height:1.7;margin-bottom:16px}
.dtl-meta{display:flex;gap:20px;margin-bottom:16px}
.dtl-mi{text-align:center}.dtl-mv{font-size:16px;font-weight:700}.dtl-ml{font-size:10px;color:var(--muted);margin-top:2px}

/* Action bar */
.act-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--border);box-shadow:0 -2px 8px rgba(0,0,0,.04);z-index:40}

/* Bottom Sheet */
.bsheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.bsheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:500px;max-height:85vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.bsheet-handle{width:36px;height:4px;background:#e5e5ea;border-radius:2px;margin:0 auto 16px}
.bsheet-title{font-size:17px;font-weight:700;margin-bottom:4px}
.bsheet-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.btn{width:100%;padding:14px;border-radius:24px;font-size:14px;font-weight:600;border:none;cursor:pointer;text-align:center;display:block}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-outline{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn-danger{background:#ef4444;color:#fff}
.btn-sm{padding:10px 18px;border-radius:20px;font-size:12px;display:inline-block;width:auto}

/* Dashboard sections */
.dash{padding:12px 16px 100px}
.sec{margin-bottom:20px}
.sec-title{font-size:14px;font-weight:600;margin-bottom:12px}
.item-card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.item-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.item-title{font-size:14px;font-weight:600}
.item-status{font-size:10px;padding:2px 8px;border-radius:10px}
.st-pending{background:#fff3e0;color:#e65100}.st-approved{background:#e8f5e9;color:#2e7d32}.st-rejected{background:#fbe9e7;color:#c62828}.st-active{background:#e3f2fd;color:#1565c0}.st-paid{background:#e8f5e9;color:#2e7d32}
.item-meta{font-size:11px;color:var(--muted);margin-bottom:6px}
.item-actions{display:flex;gap:8px;margin-top:8px}
.code-display{font-size:13px;font-weight:700;font-family:monospace;color:var(--primary);background:#f0f5ff;padding:8px 12px;border-radius:8px;text-align:center;margin:8px 0;letter-spacing:1px}

/* Applicant list */
.applicant{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.applicant:last-child{border-bottom:none}
.app-name{font-weight:500}.app-actions{display:flex;gap:6px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-card{background:#fff;border-radius:20px;padding:32px 24px;width:340px;max-width:90%;box-shadow:0 4px 24px rgba(0,0,0,.12)}
.modal-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:24px}
.ig{margin-bottom:14px}.ig label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.ig input,.ig select,.ig textarea{width:100%;background:#f2f3f7;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:14px;color:var(--text);outline:none;box-sizing:border-box}
.ig textarea{height:100px;resize:none}
.ig input:focus,.ig select:focus{border-color:var(--primary)}
.role-toggle{display:flex;gap:8px;margin-bottom:16px}
.role-btn{flex:1;text-align:center;padding:10px;border-radius:10px;font-size:12px;border:1px solid var(--border);cursor:pointer;color:var(--muted)}
.role-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.link{text-align:center;font-size:12px;color:var(--primary);margin-top:14px;cursor:pointer}
.mt-8{margin-top:8px}

/* ── 入驻向导 ── */
.ob-choice{background:#fff;border-radius:14px;padding:16px;cursor:pointer;border:2px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:all .15s}
.ob-choice:active{transform:scale(.98)}
.ob-selected{border-color:#111;background:#fff}
.ob-input{display:block;width:100%;margin-top:6px;background:#f2f3f7;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:14px;color:var(--text);outline:none;box-sizing:border-box}
.ob-input:focus{border-color:#111}
.ob-chip{padding:6px 14px;border-radius:20px;font-size:12px;background:#e5e5ea;color:#555;cursor:pointer;white-space:nowrap}
.ob-chip-sel{background:#111;color:#fff}
</style>

<script>
/* ── Debug Logger ── */
var _db=[],_dbOpen=false;
function log(){
  for(var i=0;i<arguments.length;i++){
    var a=arguments[i];_db.push({t:Date.now(),m:typeof a==='object'?JSON.stringify(a):String(a)});
  }
  if(_db.length>500)_db=_db.slice(-200);
  _renderDb();
}
function _renderDb(){
  if(_dbFreeze)return;
  var el=document.getElementById('db-panel');
  if(!el)return;
  var h='<div style="font-size:10px;color:#888;padding:2px 0;border-bottom:1px solid #333;margin-bottom:4px">共 '+_db.length+' 条日志 · 最新在上</div>';
  for(var i=_db.length-1;i>=0;i--){
    var d=_db[i];
    h+='<div class="db-line'+(d.m.indexOf('ERR')>=0||d.m.indexOf('Error')>=0?' db-err':'')+'">['+d.t.toString().slice(-5)+'] '+d.m+'</div>';
  }
  el.innerHTML=h;
  el.scrollTop = 0;
  if(!_dbOpen)el.style.display='none';
}
var _dbFreeze=false;
function freezeDb(){_dbFreeze=!_dbFreeze;document.getElementById('db-panel').style.border=_dbFreeze?'2px solid #f44':'none'}
var _toastTimer=null;
function toast(msg,icon){
  var el=document.getElementById('toast-el');
  if(!el){
    el=document.createElement('div');el.id='toast-el';el.className='toast';
    document.body.appendChild(el);
  }
  if(_toastTimer)clearTimeout(_toastTimer);
  el.innerHTML=(icon||'✓')+' '+msg;
  el.className='toast show';
  _toastTimer=setTimeout(function(){el.className='toast'},1800);
}

function toggleDb(){
  _dbOpen=!_dbOpen;
  var el=document.getElementById('db-panel');
  if(el)el.style.display=_dbOpen?'block':'none';
}


var API = '/api';
var DIFF = {easy:{label:'轻松'},medium:{label:'刚好'},hard:{label:'挑战'}};
var TABS = [{id:'explore',icon:'🔍',label:'探索'},{id:'tasks',icon:'📋',label:'任务'},{id:'messages',icon:'💬',label:'消息'},{id:'profile',icon:'👤',label:'我的'}];
/* ── 档案缓存（TTL 30s + 请求去重）── */
var _profileFetchedAt = 0;
var _profilePendingCbs = null; // null=空闲, []=加载中

function loadProfile(cb) {
  if (!state.user || !state.token) { if (cb) cb(); return; }
  // 缓存新鲜，直接用
  if (state.ambassadorProfile && Date.now() - _profileFetchedAt < 30000) { if (cb) cb(); return; }
  // 已有请求在飞，排队
  if (_profilePendingCbs !== null) { if (cb) _profilePendingCbs.push(cb); return; }
  _profilePendingCbs = cb ? [cb] : [];
  var xhr = new XMLHttpRequest();
  xhr.open('GET', API + '/auth/me', true);
  xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
  var _flush = function(d) {
    if (d && !d.error) {
      state.ambassadorProfile = d;
      state.brandProfile = d;
      _profileFetchedAt = Date.now();
    }
    var cbs = _profilePendingCbs || [];
    _profilePendingCbs = null;
    for (var i = 0; i < cbs.length; i++) cbs[i]();
  };
  xhr.onload = function() { try { _flush(JSON.parse(xhr.responseText)); } catch(e) { _flush(null); } };
  xhr.onerror = function() { _flush(null); };
  xhr.send();
}

function invalidateProfileCache() { _profileFetchedAt = 0; }

// 档案 PATCH 成功后同步本地缓存（避免 Object.assign 与服务器数据不一致）
function applyProfilePatch(serverRow) {
  if (!serverRow || serverRow.error) return;
  if (state.ambassadorProfile) {
    state.ambassadorProfile.social_platforms = serverRow.social_platforms;
    state.ambassadorProfile.tier_snapshot = serverRow.tier_snapshot;
    state.ambassadorProfile.social_platforms_updated_at = serverRow.social_platforms_updated_at;
  }
  _profileFetchedAt = Date.now(); // 刚从服务器来的，视为新鲜
}

var state = {view:'list',tasks:[],filter:'',user:null,token:null,showLogin:false,loginTab:'login',loading:true,tab:'explore',detailTask:null,myTasks:[],myApps:[],mySubs:[],myCodes:[],showOnboard:false,onboardStep:1,onboardData:{},ambassadorProfile:null,brandProfile:null,activeRole:null,walletBalance:null,walletMethods:[],walletTxns:[],heraldFilter:'all',txnFilter:'all',methodType:'BANK',displayCurrency:null,exchangeRate:null,addStep:'region',addRegion:'',addType:'',wMethodId:null,landingTask:null,landingAuthTab:'login',notifications:[],unread:0,_notifsLoaded:false,categories:[
  {id:'experience',label:'体验',icon:'🎪'},
  {id:'beauty',    label:'美妆',icon:'💄'},
  {id:'travel',    label:'旅行',icon:'✈️'},
  {id:'fashion',   label:'穿搭',icon:'👗'},
  {id:'food',      label:'美食',icon:'🍱'},
  {id:'lifestyle', label:'生活',icon:'🌿'},
  {id:'referral',  label:'推荐',icon:'🔗'},
  {id:'baby',      label:'母婴',icon:'🍼'},
]};

function catLabel(id){ var c=(state.categories||[]).find(function(x){return x.id===id}); return c?c.label:(id||''); }
function catIcon(id){ var c=(state.categories||[]).find(function(x){return x.id===id}); return c?(c.icon||''):''; }

function qs(s){return document.querySelector(s)}
function qsa(s){return document.querySelectorAll(s)}

function render(){
  log('render: view='+state.view+' tab='+state.tab+' user='+(state.user?state.user.id:'none')+' loading='+state.loading);
  try{
    var app = document.getElementById("app");
    if(!app){log('ERR: #app not found');return}
    // 登录弹窗由 HTML 静态渲染，JS 只负责显示/隐藏
  // 见 <div id="login-modal"> 在 body 中
    if(state.view==='landing'){
      log('landing: building HTML, task='+(state.landingTask?state.landingTask.id:'null'));
      var _lhtml;try{_lhtml=landingHTML();}catch(e){log('ERR landingHTML: '+e.message);return;}
      log('landing: HTML built ('+_lhtml.length+' chars), setting innerHTML...');
      try{app.innerHTML=_lhtml;}catch(e){log('ERR innerHTML: '+e.message);return;}
      log('landing: innerHTML set, binding...');
      try{bindLanding();}catch(e){log('ERR bindLanding: '+e.message);}
      log('landing: done');
      return;
    }
    if(state.showOnboard&&state.user&&state.user.role==='HERALD'){app.innerHTML = onboardHTML();bindOnboard();return}
    if(state.showOnboard&&state.user&&state.user.role==='BRAND'){app.innerHTML = onboardBrandHTML();return}
    if(state.view === 'detail' && state.detailTask){app.innerHTML = detailHTML()+tabBarHTML();bindDetail();return}
    if(state.view === 'brand-dashboard'){app.innerHTML = brandDashHTML()+tabBarHTML();bindBrandDash();return}
    if(state.view === 'brand-task' && state.detailTask){app.innerHTML = brandTaskHTML()+tabBarHTML();bindBrandTask();return}
    if(state.view === 'herald-dashboard'){app.innerHTML = heraldDashHTML()+tabBarHTML();bindHeraldDash();return}
    if(state.view === 'create-task'){app.innerHTML = createTaskHTML()+tabBarHTML();bindCreateTask();return}
    if(state.view === 'submit' && state.detailTask){app.innerHTML = submitHTML()+tabBarHTML();bindSubmit();return}
    if(state.view === 'messages'){app.innerHTML = messagesHTML()+tabBarHTML();return}
    if(state.view === 'profile'){app.innerHTML = profileHTML()+tabBarHTML();bindProfile();return}
    if(state.view === 'wallet'){app.innerHTML = walletHTML()+tabBarHTML();return}
    if(state.view === 'add-method'){app.innerHTML = addMethodHTML();return}
    if(state.view === 'withdraw'){app.innerHTML = withdrawHTML();return}
    if(state.view === 'admin'){app.innerHTML = adminHTML();bindAdmin();return}
    if(state.view === 'admin-decl'){app.innerHTML = adminDeclHTML()+adminBackBar();bindAdminActions();return}
    if(state.view === 'admin-subs'){app.innerHTML = adminSubsHTML()+adminBackBar();bindAdminActions();return}
    if(state.view === 'admin-users'){app.innerHTML = adminUsersHTML()+adminBackBar();return}
    if(state.view === 'csv-import' && state.detailTask){app.innerHTML = csvImportHTML()+tabBarHTML();bindCsvImport();return}
    app.innerHTML = listHTML()+tabBarHTML();bindList();
  }catch(e){
    log('ERR render: '+e.message+' at '+e.stack);
  }
}

function tabBarHTML(){
  var h='<div class="tab-bar">';
  for(var i=0;i<TABS.length;i++){
    var t=TABS[i];
    h+='<div class="tab-item'+(state.tab===t.id?' active':'')+'" onclick="switchTab(\''+t.id+'\')">';
    // 消息 tab 加未读红点
    if(t.id==='messages'&&state.unread>0){
      h+='<div style="position:relative;display:inline-block">';
      h+='<div class="tab-icon">'+t.icon+'</div>';

/* 预检任务平台要求，返回 {status:'ok'|'missing'|'insufficient', failures:[]} */
function checkRequirements(t){
  if(!t||!t.platform_requirements) return {status:'ok',failures:[]};
  var reqs=[];
  try{reqs=JSON.parse(t.platform_requirements);}catch(e){return {status:'ok',failures:[]};}
  var required=reqs.filter(function(r){return r.required});
  if(!required.length) return {status:'ok',failures:[]};
  var platforms=[];
  try{var ap=state.ambassadorProfile||{};platforms=ap.social_platforms?JSON.parse(ap.social_platforms):[];}catch(e){}
  var failures=[];
  for(var i=0;i<required.length;i++){
    var req=required[i];
    var match=platforms.find(function(p){return p.platformId===req.platformId});
    if(!match) failures.push({platformId:req.platformId,type:'MISSING'});
    else if(req.minFollowers&&(match.followers||0)<req.minFollowers)
      failures.push({platformId:req.platformId,type:'INSUFFICIENT',required:req.minFollowers,current:match.followers||0});
  }
  if(!failures.length) return {status:'ok',failures:[]};
  if(failures.some(function(f){return f.type==='INSUFFICIENT'})) return {status:'insufficient',failures:failures};
  return {status:'missing',failures:failures};
}

function asWxInput(el,pid){
  var val=el.value.trim(),prefix=document.getElementById('as-prefix-'+pid),hint=document.getElementById('as-hint-'+pid);
  if(!hint)return;
  if(/^\d+$/.test(val)&&val.length>0){
    if(prefix)prefix.style.display='block';
    var ok=/^1[3-9]\d{9}$/.test(val);
    hint.style.color=val.length<11?'var(--muted)':ok?'var(--success)':'#ef4444';
    hint.textContent=val.length<11?'继续输入（11位）':ok?'✓ +86 '+val:'手机号格式有误';
  } else {
    if(prefix)prefix.style.display='none';
    hint.style.color=val.length>=6?'var(--success)':'var(--muted)';
    hint.textContent=val.length>=6?'✓ 微信 ID':val.length>0?'微信号至少6位':'纯数字自动识别手机号';
  }
}

function submitAddAccountSheet(missingIds){
  var existing=[];
  try{var ap=state.ambassadorProfile||{};existing=ap.social_platforms?JSON.parse(ap.social_platforms):[];}catch(e){}
  var toAdd=[];
  for(var i=0;i<missingIds.length;i++){
    var pid=missingIds[i],pm=platformById(pid);
    var inp=document.getElementById('as-val-'+pid);
    var val=inp?inp.value.trim():'';
    if(!val){alert('请填写 '+pm.name+' 账号');return;}
    if(pid==='wechat'){
      var check=obValidateWechat(val);
      if(!check.ok){alert(check.msg);return;}
      toAdd.push({platformId:pid,accountId:check.saved,url:null,followers:null});
    } else if(pm.inputType==='id'){
      toAdd.push({platformId:pid,accountId:val,url:null,followers:null});
    } else {
      var folEl=document.getElementById('as-fol-'+pid);
      toAdd.push({platformId:pid,url:val,accountId:null,followers:folEl&&folEl.value?parseInt(folEl.value,10):null});
    }
  }
  var merged=existing.filter(function(s){return missingIds.indexOf(s.platformId)<0}).concat(toAdd);
  var xhr=new XMLHttpRequest();
  xhr.open('PATCH',API+'/ambassador/profile',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('Authorization','Bearer '+state.token);
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText);
      if(d.error){alert(d.error);return;}
      applyProfilePatch(d);
      document.getElementById('add-acct-sheet').remove();
      applyTask();
    }catch(e){alert('保存失败');}
  };
  xhr.send(JSON.stringify({socialPlatforms:merged}));
}

  h+='<div class="sec"><div class="sec-title">我的任务</div>';

function openBrandTask(id){
  var xhr=new XMLHttpRequest();
  xhr.open('GET',API+'/tasks/'+id,true);
  xhr.onload=function(){
    try{state.detailTask=JSON.parse(xhr.responseText)}catch(e){}
    state.taskSubs=[];state._loadingBrandTask=false;
    state.view='brand-task';render();
  };
  xhr.send();
}

function bindBrandTask(){
  if(state._loadingBrandTask) return;
  state._loadingBrandTask=true;
  var xhr=new XMLHttpRequest();
  xhr.open('GET',API+'/submissions/task/'+state.detailTask.id,true);
  xhr.setRequestHeader('Authorization','Bearer '+(state.token||''));
  xhr.onload=function(){
    state._loadingBrandTask=false;
    var subs=[];
    try{subs=JSON.parse(xhr.responseText);state.taskSubs=subs;}catch(e){}
    var el=document.getElementById('brand-task-subs');
    if(!el) return;
    var h='<div class="sec-title">提交内容 ('+subs.length+')</div>';
    if(subs.length>0){
      for(var i=0;i<subs.length;i++){
        var s=subs[i];
        h+='<div class="item-card">';
        h+='<div class="item-hdr"><span class="app-name">'+(s.nickname||'赫使')+'</span>';
        if(s.status==='PENDING_REVIEW') h+='<span class="item-status st-pending">待审核</span>';
        else if(s.status==='APPROVED') h+='<span class="item-status st-approved">已通过</span>';
        else h+='<span class="item-status st-rejected">已拒绝</span>';
        h+='</div>';
        h+='<div style="font-size:12px;color:var(--muted);margin:4px 0"><a href="'+(s.content_url||'')+'" target="_blank" style="color:var(--primary)">'+(s.content_url||'无链接')+'</a></div>';
        if(s.description) h+='<div style="font-size:12px;color:#555">'+s.description+'</div>';
        if(s.status==='PENDING_REVIEW') h+='<div class="app-actions" style="margin-top:8px"><button class="btn btn-sm btn-success" data-action="approve-sub" data-sid="'+s.id+'">通过并结算</button><button class="btn btn-sm btn-danger" data-action="reject-sub" data-sid="'+s.id+'">拒绝</button></div>';
        if(s.status==='APPROVED') h+='<div style="font-size:11px;color:var(--success);margin-top:4px">✅ 已结算</div>';
        if(s.status==='REJECTED'&&s.review_note) h+='<div style="font-size:11px;color:var(--muted);margin-top:4px">原因: '+s.review_note+'</div>';
        h+='</div>';
      }
    }else{ h+='<div style="color:var(--muted);font-size:12px">暂无提交</div>'; }
    el.innerHTML=h;
  };
  xhr.onerror=function(){
    state._loadingBrandTask=false;
    var el=document.getElementById('brand-task-subs');
    if(el) el.innerHTML='<div class="sec-title">提交内容</div><div style="color:var(--muted);font-size:12px">加载失败</div>';
  };
  xhr.send();
}

/* ── 待办任务卡片统一渲染 ──
 * opts = {
 *   title     : string   任务名（自动截断）
 *   accent    : string   左边框颜色
 *   meta      : string   副标题文字
 *   metaColor : string?  副标题颜色（默认同 accent）
 *   note      : string?  次要备注（灰色，截断）
 *   right     : {        右侧操作区 — badge 与 button 使用完全相同的 pill 尺寸
 *     type    : 'badge'|'button'
 *     text    : string
 *     color   : string   文字色
 *     bg      : string   背景色
 *     onclick : string?  仅 button
 *   }
 *   body      : string?  标题行下方扩展 HTML（推广码块等）
 * }
 */
function taskCardHTML(opts){
  // badge 与 button 共用同一套 pill 样式，保证视觉对齐
  // badge 与 button 同用 <span>，消除 <button> UA stylesheet 的盒模型差异
  var PILL='flex-shrink:0;display:inline-block;box-sizing:border-box;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1;text-align:center;min-width:68px';
  var h='<div style="background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:8px;border-left:3px solid '+opts.accent+'">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">';
  h+='<div style="min-width:0;flex:1">';
  h+='<div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escHtml(opts.title)+'</div>';
  if(opts.meta) h+='<div style="font-size:11px;color:'+(opts.metaColor||opts.accent)+';margin-top:3px">'+opts.meta+'</div>';
  if(opts.note) h+='<div style="font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escHtml(opts.note)+'</div>';
  h+='</div>';
  if(opts.right){
    var r=opts.right;
    var pillStyle=PILL+';color:'+r.color+';background:'+r.bg;
    if(r.type==='badge'){
      h+='<span style="'+pillStyle+'">'+r.text+'</span>';
    } else {
      h+='<span role="button" tabindex="0" style="'+pillStyle+';cursor:pointer" onclick="'+r.onclick+'">'+r.text+'</span>';
    }
  }
  h+='</div>';
  if(opts.body) h+=opts.body;
  h+='</div>';
  return h;
}

  h+='<div style="font-size:10px;color:var(--muted);margin-bottom:4px">本月收入</div>';

  h+='</div>';

  // === 待办任务 ===
  var approvedStdApps=state.myApps.filter(function(a){return a.status==='APPROVED'&&a.mode==='STANDARD'});
  var subForTask=function(tid){return state.mySubs.find(function(s){return s.task_id===tid&&s.status==='APPROVED'});};
  var rejectedSubForTask=function(tid){return state.mySubs.find(function(s){return s.task_id===tid&&s.status==='REJECTED'});};
  var pendingSubForTask=function(tid){return state.mySubs.find(function(s){return s.task_id===tid&&s.status==='PENDING_REVIEW'});};
  // 可提交 = 无APPROVED sub 且 无PENDING_REVIEW sub（REJECTED可重新提交）
  var actionableA=approvedStdApps.filter(function(a){return !subForTask(a.task_id)&&!pendingSubForTask(a.task_id);});
  var freshA=actionableA.filter(function(a){return !rejectedSubForTask(a.task_id);});
  var rejectedA=actionableA.filter(function(a){return !!rejectedSubForTask(a.task_id);});
  // 已提交等待审核
  var pendingReviewA=approvedStdApps.filter(function(a){return !!pendingSubForTask(a.task_id);});

  var actionableB=state.myApps.filter(function(a){return a.status==='APPROVED'&&a.mode==='PERFORMANCE' && state.myCodes.some(function(c){return c.task_id===a.task_id;});});

  var hasAction=rejectedA.length>0||freshA.length>0;
  var hasInProgress=pendingReviewA.length>0||actionableB.length>0;
  if(hasAction||hasInProgress){
    h+='<div style="margin-bottom:20px"><div style="font-size:14px;font-weight:600;margin-bottom:12px">待办任务</div>';

    // ── 待操作（需要赫使做事）──
    if(hasAction){
      if(hasInProgress) h+='<div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.8px;margin-bottom:8px">待操作</div>';
      for(var i=0;i<rejectedA.length;i++){
        var ra2=rejectedA[i];var rsub=rejectedSubForTask(ra2.task_id);
        h+=taskCardHTML({title:ra2.task_title,accent:'#dc2626',meta:'内容审核未通过，请修改后重新提交',
          note:rsub&&rsub.review_note?'原因：'+rsub.review_note:'',
          right:{type:'button',text:'重新提交',color:'#fff',bg:'#dc2626',onclick:"openSubmit('"+ra2.task_id+"')"}});
      }
      for(var i=0;i<freshA.length;i++){
        var aa=freshA[i];
        h+=taskCardHTML({title:aa.task_title,accent:'var(--primary)',
          meta:'内容任务 · ¥'+(aa.payout_per_herald||aa.commission||0),metaColor:'var(--muted)',
          right:{type:'button',text:'提交作品',color:'#fff',bg:'var(--primary)',onclick:"openSubmit('"+aa.task_id+"')"}});
      }
    }

    // ── 进行中（等待品牌 / 持续推广）──
    if(hasInProgress){
      if(hasAction) h+='<div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.8px;margin:12px 0 8px">进行中</div>';
      for(var i=0;i<pendingReviewA.length;i++){
        var pra=pendingReviewA[i];
        h+=taskCardHTML({title:pra.task_title,accent:'#0369a1',
          meta:'内容已提交，等待品牌审核',metaColor:'var(--muted)',
          right:{type:'badge',text:'审核中',color:'#0369a1',bg:'#eff6ff'}});
      }
      for(var j=0;j<actionableB.length;j++){
        var ab=actionableB[j];
        var code=state.myCodes.find(function(c){return c.task_id===ab.task_id});
        var codeBody=code
          ?'<div style="background:#fffbf0;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;margin-top:8px;display:flex;align-items:center;justify-content:space-between">'
            +'<span style="font-family:monospace;font-size:14px;font-weight:700;letter-spacing:1px">'+escHtml(code.unique_code||'')+'</span>'
            +'<span role="button" tabindex="0" style="display:inline-block;box-sizing:border-box;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;line-height:1;background:#f5a623;color:#fff;cursor:pointer;white-space:nowrap" data-code="'+escHtml(code.unique_code||'')+'" onclick="copyCode(this,this.dataset.code);event.stopPropagation()">复制</span></div>'

          :'<div style="font-size:11px;color:var(--muted);margin-top:6px">⏳ 推广码正在生成</div>';
        h+=taskCardHTML({title:ab.task_title,accent:'var(--gold)',
          meta:'推广任务',metaColor:'var(--muted)',body:codeBody,
          right:{type:'badge',text:'推广中',color:'#92400e',bg:'#fffbeb'}});
      }
    }

    h+='</div>';
  }

  // === 报名历史 ===
  var filter=state.heraldFilter||'all';
  var filteredApps=state.myApps;
  if(filter==='pending') filteredApps=state.myApps.filter(function(a){return a.status==='PENDING'});
  if(filter==='done') filteredApps=state.myApps.filter(function(a){
      var doneSub=state.mySubs.some(function(s){return s.task_id===a.task_id && s.status==='APPROVED'});
      return a.status==='APPROVED' && doneSub;
    });

  h+='<div style="margin-bottom:20px"><div style="font-size:14px;font-weight:600;margin-bottom:12px">报名历史</div>';

  // Filter tabs
  var filters=[{id:'all',label:'全部'},{id:'pending',label:'待审核'},{id:'done',label:'已完成'}];
  h+='<div style="display:flex;gap:6px;margin-bottom:12px">';
  for(var k=0;k<filters.length;k++){
    var f=filters[k];
    h+='<div style="padding:5px 14px;border-radius:16px;font-size:12px;cursor:pointer;'+(filter===f.id?'background:#111;color:#fff':'background:#e5e5ea;color:#555')+'" onclick="state.heraldFilter=\''+f.id+'\';render()">'+f.label+'</div>';
  }
  h+='</div>';

  if(filteredApps.length===0){
    h+='<div style="text-align:center;padding:32px 16px;color:var(--muted)">';
    h+='<div style="font-size:13px">'+(filter==='all'?'还没有报名记录':'暂无此状态的记录')+'</div></div>';
  } else {
    for(var m=0;m<filteredApps.length;m++){
      var ra=filteredApps[m];if(!ra)continue;
      var stMap={PENDING:['待审核','#d97706'],APPROVED:['已通过','#16a34a'],REJECTED:['未通过','#dc2626'],WITHDRAWN:['已撤回','#6b7280']};
      if(ra.status==='APPROVED' && ra.mode==='STANDARD'){
        var raSub=state.mySubs.find(function(s){return s.task_id===ra.task_id});
        if(raSub&&raSub.status==='APPROVED') stMap.APPROVED=['已完成','#6366f1'];
        else if(raSub&&raSub.status==='PENDING_REVIEW') stMap.APPROVED=['内容审核中','#0369a1'];
        else if(raSub&&raSub.status==='REJECTED') stMap.APPROVED=['需重新提交','#dc2626'];
      }
      var s=stMap[ra.status]||['','#666'];
      h+='<div style="background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:6px">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center">';
      h+='<div style="font-size:13px;font-weight:500">'+escHtml(ra.task_title)+'</div>';
      h+='<span style="font-size:10px;font-weight:600;color:'+s[1]+'">'+s[0]+'</span></div>';
      h+='<div style="font-size:11px;color:var(--muted);margin-top:4px">¥'+(ra.payout_per_herald||ra.commission||0)+' · '+(ra.mode==='PERFORMANCE'?'推广任务':'内容任务')+'</div>';

      if(ra.status==='APPROVED'&&ra.mode==='STANDARD'){
        var raSubD=state.mySubs.find(function(s){return s.task_id===ra.task_id});
        if(raSubD&&raSubD.status==='REJECTED'&&raSubD.review_note) h+='<div style="font-size:11px;color:#dc2626;margin-top:6px;padding:6px 8px;background:#fef2f2;border-radius:6px;border-left:3px solid #dc2626">内容拒绝原因：'+escHtml(raSubD.review_note)+'</div>';
      }
      h+='</div>';
    }
  }
  h+='</div></div>';
  return h;
}

function copyCode(el, code){
  log('copyCode: el='+(el.tagName||'')+' code='+code);
  var isBtn=el.tagName==='BUTTON';
  if(isBtn){
    el.innerHTML="✓ 已复制";
    el.style.background='#34c759';
    el.style.color='#fff';
  }else{
    el.style.background='#d4edda';
  }
  try{
    var ta=document.createElement('textarea');
    ta.value=code;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){
    navigator.clipboard.writeText(code).then(function(){}).catch(function(){});
  }
  setTimeout(function(){
    if(isBtn){
      el.innerHTML="复制";
      el.style.background='';
      el.style.color='';
    }else{
      el.style.background='';
    }
  },1500);
}

function seWechatInput(el){
  // 复用同一套检测逻辑，但用 se- 前缀的 DOM id
  var val=el.value.trim();
  var prefix=qs('#se-wechat-prefix');
  var hint=qs('#se-wechat-hint');
  if(!hint) return;
  if(/^\d+$/.test(val)&&val.length>0){
    if(prefix) prefix.style.display='block';
    var valid=/^1[3-9]\d{9}$/.test(val);
    if(val.length<11) hint.style.color='var(--muted)',hint.textContent='继续输入（11位）';
    else if(valid) hint.style.color='var(--success)',hint.textContent='✓ +86 '+val;
    else hint.style.color='#ef4444',hint.textContent='手机号格式有误';
  } else {
    if(prefix) prefix.style.display='none';
    if(val.length===0) hint.style.color='var(--muted)',hint.textContent='手机号输入纯数字自动识别';
    else if(val.length<6) hint.style.color='var(--muted)',hint.textContent='微信号至少6位';
    else hint.style.color='var(--success)',hint.textContent='✓ 微信 ID';
  }
}

function saveSocialProfile(){
  var wInput=qs('#se-wechat');
  var wVal=wInput?wInput.value.trim():'';
  var platforms=[];
  if(wVal){
    var check=obValidateWechat(wVal);
    if(!check.ok){alert(check.msg);return}
    if(check.saved) platforms.push({platformId:'wechat',accountId:check.saved,url:null,followers:null});
  }
  var sns=PLATFORM_REGISTRY.filter(function(p){return p.id!=='wechat'});
  for(var i=0;i<sns.length;i++){
    var pi=sns[i];
    var valEl=qs('#se-plat-'+pi.id),folEl=qs('#se-fol-'+pi.id);
    var val=valEl?valEl.value.trim():'';
    var fol=folEl&&folEl.value?parseInt(folEl.value,10):null;
    if(!val) continue;
    if(pi.inputType==='id') platforms.push({platformId:pi.id,accountId:val,url:null,followers:null});
    else platforms.push({platformId:pi.id,url:val,followers:fol,accountId:null});
  }
  var xhr=new XMLHttpRequest();
  xhr.open('PATCH',API+'/ambassador/profile',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('Authorization','Bearer '+state.token);
  xhr.onload=function(){
    try{
      var res=JSON.parse(xhr.responseText);
      if(res.error){alert(res.error);return}
      // 刷新本地档案
      applyProfilePatch(res);
      hideSocialEdit();
      toast('社交账号已保存');
      render();
    }catch(e){alert('保存失败')}
  };
  xhr.send(JSON.stringify({socialPlatforms:platforms}));
}

function submitWithdrawRequest(){
  var amount=parseFloat((document.getElementById('wr-amount')||{}).value);
  var method=(document.getElementById('wr-method')||{}).value;
  var acc=((document.getElementById('wr-acc')||{}).value||'').trim();
  var bank=((document.getElementById('wr-bank')||{}).value||'').trim();
  if(!amount||amount<1000){alert('最低提现金额 ¥1000');return;}
  if(!method){alert('请选择收款方式');return;}
  if(!acc){alert('请填写收款账号');return;}
  var accountDetails={account:acc};
  if(bank) accountDetails.bankName=bank;
  var currency=(document.getElementById('wr-currency')||{}).value||(state.walletBalance||{}).displayCurrency||'JPY';
  var xhr=new XMLHttpRequest();
  xhr.open('POST',API+'/wallet/withdraw-request',true);
  xhr.setRequestHeader('Authorization','Bearer '+state.token);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText);
      if(d.error){alert(d.error);return;}
      alert('提现申请已提交！预计1-3个工作日内打款。');
      loadWalletBalance();render();
    }catch(e){alert('提现失败，请重试');}
  };
  xhr.send(JSON.stringify({amount:amount,currency:currency,method:method,accountDetails:accountDetails}));
}

var walletPeriod='month';
var WALLET_PERIOD_LABELS={month:'本月', last_month:'上月', '7d':'最近7天', '30d':'最近30天', all:'全部'};

function walletPeriodRange(period){
  var now=new Date();
  var from, to=now;
  if(period==='last_month'){
    from=new Date(now.getFullYear(), now.getMonth()-1, 1);
    to=new Date(now.getFullYear(), now.getMonth(), 1);
  } else if(period==='7d'){
    from=new Date(now.getTime() - 7*86400000);
  } else if(period==='30d'){
    from=new Date(now.getTime() - 30*86400000);
  } else if(period==='all'){
    from=new Date('1970-01-01');
  } else {
    from=new Date(now.getFullYear(), now.getMonth(), 1);
  }
  return {from:from.toISOString(), to:to.toISOString()};
}

function setWalletPeriod(p){
  if(walletPeriod===p)return;
  walletPeriod=p;
  loadWalletBalance();
  loadWalletTxns();
}

function loadWalletTxns(){
  if(state._loadingTxns)return;state._loadingTxns=true;
  var filter=state.txnFilter||'all';
  var r=walletPeriodRange(walletPeriod);
  var url=API+'/wallet/transactions?walletType=herald&limit=50&from='+encodeURIComponent(r.from)+'&to='+encodeURIComponent(r.to)+(filter!=='all'?'&type='+filter:'');
  var x=new XMLHttpRequest();
  x.open('GET',url,true);
  x.setRequestHeader('Authorization','Bearer '+state.token);
  x.onload=function(){state._loadingTxns=false;try{var d=JSON.parse(x.responseText);state.walletTxns=d.transactions||[];state.walletFlow={inflow:d.periodInflow,outflow:d.periodOutflow}}catch(e){}render()};
  x.onerror=function(){state._loadingTxns=false};
  x.send();
}

function loadWalletMethods(){
  if(state._loadingMethods)return;state._loadingMethods=true;
  var x=new XMLHttpRequest();
  x.open('GET',API+'/wallet/methods',true);
  x.setRequestHeader('Authorization','Bearer '+state.token);
  x.onload=function(){state._loadingMethods=false;try{state.walletMethods=JSON.parse(x.responseText)}catch(e){}render()};
  x.onerror=function(){state._loadingMethods=false};
  x.send();
}

function deleteMethod(id){
  if(!confirm('确认删除此收款方式？'))return;
  var x=new XMLHttpRequest();
  x.open('DELETE',API+'/wallet/methods/'+id,true);
  x.setRequestHeader('Authorization','Bearer '+state.token);
  x.onload=function(){loadWalletMethods();loadWalletBalance()};
  x.send();
}

function loadWalletBalance(){
  if(state._loadingBalance)return;state._loadingBalance=true;
  var r=walletPeriodRange(walletPeriod);
  var x=new XMLHttpRequest();
  x.open('GET',API+'/wallet/balance?from='+encodeURIComponent(r.from)+'&to='+encodeURIComponent(r.to),true);
  x.setRequestHeader('Authorization','Bearer '+state.token);
  x.onload=function(){state._loadingBalance=false;try{state.walletBalance=JSON.parse(x.responseText)}catch(e){}render()};
  x.onerror=function(){state._loadingBalance=false};
  x.send();
}

function doAddMethod(){
  var region = state.addRegion || 'overseas';
  var sel    = state.addType  || 'BANK';
  var label  = (document.getElementById('method-label')||{}).value||'';
  label = label.trim();
  if(!label && sel!=='CASH'){alert('请填写收款方式名称');return;}
  var details={};

  if(sel==='CASH'){
    details.method='現金'; label=label||'現金受取';
  } else if(sel==='BANK' && region==='japan'){
    details.bank_code    =(document.getElementById('m-jp-code')||{}).value||'';
    details.bank_name    =(document.getElementById('m-bank')||{}).value||'';
    details.branch_code  =(document.getElementById('m-branch-code')||{}).value||'';
    details.branch       =(document.getElementById('m-branch')||{}).value||'';
    details.account_type =(document.getElementById('m-acct-type')||{}).value||'普通';
    details.account_number=(document.getElementById('m-acct')||{}).value||'';
    details.account_name =(document.getElementById('m-name')||{}).value||'';
  } else if(sel==='BANK'){
    details.bank_name    =(document.getElementById('m-bank')||{}).value||'';
    details.account_number=(document.getElementById('m-acct')||{}).value||'';
    details.account_name =(document.getElementById('m-name')||{}).value||'';
    details.swift_code   =(document.getElementById('m-swift')||{}).value||'';
  } else if(sel==='PAYPAL'){
    details.email=(document.getElementById('m-email')||{}).value||'';
  } else if(sel==='WECHAT'){
    details.wechat_id=(document.getElementById('m-wechat-id')||{}).value||'';
  } else if(sel==='ALIPAY'){
    details.account=(document.getElementById('m-alipay-acct')||{}).value||'';
  }
  var isDefault=(document.getElementById('m-default')||{}).checked||false;
  var countryMap={japan:'JP',china:'CN',overseas:''};
  var country=countryMap[region]||'';

  var x=new XMLHttpRequest();
  x.open('POST',API+'/wallet/methods',true);
  x.setRequestHeader('Content-Type','application/json');
  x.setRequestHeader('Authorization','Bearer '+state.token);
  x.onload=function(){
    try{
      var d=JSON.parse(x.responseText);
      if(d.error){alert(d.error);return;}
      loadWalletMethods();
      state.view='wallet'; state.addStep='region'; state.addRegion=''; state.addType='';
      render();
    }catch(e){alert('添加失败');}
  };
  x.send(JSON.stringify({type:sel,country:country,label:label,account_details:details,is_default:isDefault}));
}

function updateWithdrawPreview(){
  var bal     = state.walletBalance || {};
  var avail   = bal.available || 0;
  var methods = state.walletMethods || [];
  var selMethod = methods.find(function(m){ return m.id === state.wMethodId; }) || methods[0];
  var METHOD_ETA= {BANK:'1–3 工作日', ALIPAY:'即时到账', WECHAT:'即时到账', PAYPAL:'即时到账', CASH:'当面结算'};
  var isCNY = selMethod && (selMethod.type==='ALIPAY'||selMethod.type==='WECHAT');
  var FX_RATE = 0.049;
  var FEE_RATE = 0;

  // 重新渲染卡片选中态
  var ms = document.querySelectorAll('[onclick^="state.wMethodId"]');
  for(var i=0;i<ms.length;i++){
    var mid = ms[i].getAttribute('onclick').match(/state\.wMethodId='([^']+)'/);
    if(mid) ms[i].style.borderColor = (mid[1]===state.wMethodId?'var(--primary)':'var(--border)');
  }

  var amtEl = document.getElementById('w-amount');
  var previewEl = document.getElementById('w-preview');
  var btnEl = document.getElementById('w-submit-btn');
  if(!amtEl||!previewEl||!btnEl) return;

  var amount = parseFloat(amtEl.value) || 0;
  if(amount < 100 || amount > avail){
    previewEl.innerHTML = '';
    btnEl.disabled = true;
    btnEl.textContent = amount > avail ? '超出可用余额' : '输入提现金额';
    return;
  }

  var fee    = Math.round(amount * FEE_RATE);
  var net    = amount - fee;
  var cnyAmt = isCNY ? (net * FX_RATE).toFixed(2) : null;
  var eta    = selMethod ? (METHOD_ETA[selMethod.type]||'1–3 工作日') : '1–3 工作日';

  function row(label, val, color, bold){
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">'
      +'<span style="font-size:13px;color:var(--muted)">'+label+'</span>'
      +'<span style="font-size:13px;font-weight:'+(bold?'700':'500')+';color:'+(color||'var(--text)')+'">'+val+'</span></div>';
  }

  var html = '<div style="background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:4px 18px;margin-bottom:20px">';
  html += row('提现金额', '¥'+Number(amount).toLocaleString()+' JPY', null, false);
  html += row('手续费', fee===0 ? '免费' : '−¥'+fee.toLocaleString(), fee===0?'#16a34a':'var(--text)', false);
  html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0">'
    +'<span style="font-size:13px;color:var(--muted)">到账金额</span>'
    +'<div style="text-align:right">'
    +'<div style="font-size:18px;font-weight:700;color:#16a34a">¥'+Number(net).toLocaleString()+' JPY</div>'
    +(cnyAmt?'<div style="font-size:11px;color:var(--muted);margin-top:2px">≈ '+cnyAmt+' CNY（参考汇率，实际以到账为准）</div>':'')
    +'</div></div>';
  html += '</div>';
  html += '<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:20px">⏱ 预计到账：<strong style="color:var(--text)">'+eta+'</strong></div>';

  previewEl.innerHTML = html;
  btnEl.disabled = false;
  btnEl.textContent = '确认提现 ¥'+Number(net).toLocaleString();
}

function doWithdraw(){
  var methods = state.walletMethods || [];
  var selMethod = methods.find(function(m){ return m.id===state.wMethodId; }) || methods[0];
  if(!selMethod){ alert('请选择收款方式'); return; }
  var amount = parseFloat((document.getElementById('w-amount')||{}).value||0);
  if(!amount||amount<1000){ alert('最低提现 ¥1000'); return; }

  var btn = document.getElementById('w-submit-btn');
  if(btn){ btn.disabled=true; btn.textContent='提交中...'; }

  var x=new XMLHttpRequest();
  x.open('POST',API+'/wallet/withdraw',true);
  x.setRequestHeader('Content-Type','application/json');
  x.setRequestHeader('Authorization','Bearer '+state.token);
  x.onload=function(){
    try{
      var d=JSON.parse(x.responseText);
      if(d.error){ if(btn){btn.disabled=false;btn.textContent='确认提现';} alert(d.error); return; }
      loadWalletBalance(); loadWalletTxns();
      state.view='wallet'; render();
    }catch(e){ alert('提现失败'); }
  };
  x.send(JSON.stringify({method_id:selMethod.id, amount:amount}));
}

var _landingAuthPending=false;
function doLandingAuth(){
  if(_landingAuthPending) return;
  var tab=state.landingAuthTab||'login';
  var email=((document.getElementById('l-email')||{}).value||'').trim();
  var pass=((document.getElementById('l-pass')||{}).value||'').trim();
  var nick=((document.getElementById('l-nick')||{}).value||'').trim();
  var errEl=document.getElementById('landing-err');
  if(!errEl) return;
  if(!email||!pass){errEl.textContent='请填写邮箱和密码';return;}
  if(tab==='register'&&!nick){errEl.textContent='请填写昵称';return;}
  errEl.textContent='';
  _landingAuthPending=true;
  var btn=document.querySelector('button[onclick="doLandingAuth()"]');
  if(btn){btn.disabled=true;btn.textContent='处理中...';}
  var path=tab==='login'?'/api/auth/login':'/api/auth/register';
  var body=tab==='login'
    ?{account:email,password:pass}
    :{email:email,password:pass,nickname:nick,role:'HERALD'};
  var xhr=new XMLHttpRequest();
  xhr.open('POST',path);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onload=function(){
    _landingAuthPending=false;
    var d;try{d=JSON.parse(xhr.responseText);}catch(e){if(errEl)errEl.textContent='服务器错误';return;}
    if(d.error){if(errEl)errEl.textContent=d.error;if(btn){btn.disabled=false;btn.textContent=tab==='login'?'登录并报名':'注册并报名';}return;}
    localStorage.setItem('herix_token',d.token);
    state.view='list';
    state.landingTask=null;
    afterAuth(d);
  };
  xhr.onerror=function(){_landingAuthPending=false;if(errEl)errEl.textContent='网络错误，请重试';if(btn){btn.disabled=false;btn.textContent=tab==='login'?'登录并报名':'注册并报名';}};
  xhr.send(JSON.stringify(body));
}

function openLogin(){
  log('openLogin');
  Auth.init({onLogin:function(d){afterAuth(d)}, onRegister:function(d){afterAuth(d)}, api: API + '/auth'});
  state.showLogin=true;state.loginTab='login';window._r='HERALD';
  var inner = document.getElementById('login-card-inner');
  if(inner) inner.innerHTML = loginHTML();
  var modal = document.getElementById('login-modal');
  if(modal){modal.classList.add('show')}
  else log('ERR: login-modal not found');
  // 主动触发 Credential Management API，让 Bitwarden/Chrome/iCloud 检测到表单
  if (window.PasswordCredential && navigator.credentials) {
    setTimeout(function(){
      navigator.credentials.get({password:true, mediation:'silent'}).then(function(cred){
        if(cred){var e=document.getElementById('email');var p=document.getElementById('password');if(e&&!e.value)e.value=cred.id;if(p&&!p.value)p.value=cred.password||'';}
      }).catch(function(){});
    },200);
  }
}

function afterAuth(d) {
  state.token = d.token;
  state.user = d.user;
  state.showLogin = false;
  var modal = document.getElementById('login-modal');
  if(modal) modal.classList.remove('show');
  var inner = document.getElementById('login-card-inner');
  if(inner) inner.innerHTML = '';
  // 初始化 activeRole（默认用主角色）
  state.activeRole = d.user.role;

  if (d.user.role === 'ADMIN') {
    state.view = 'admin'; render(); return;
  }
  if (!d.user.is_onboarded) {
    state.showOnboard = true; state.onboardStep = 1; state.onboardData = {}; render(); return;
  }
  // 登录后恢复定向任务跳转：优先从 URL 读（最可靠），其次 sessionStorage
  var _urlTask = new URLSearchParams(window.location.search).get('task');
  var pendingTask = _urlTask || sessionStorage.getItem('herix_pending_task');
  log('afterAuth: is_onboarded='+d.user.is_onboarded+' pendingTask='+pendingTask+' urlTask='+_urlTask);
  if (pendingTask) {
    sessionStorage.removeItem('herix_pending_task');
    state.tab = 'explore';
    openDetail(pendingTask);
    return;
  }
  // 登录后拉一次 unread count，让消息红点立即生效
  loadNotifications();
  // 已入驻：根据 activeRole 决定初始视图
  applyActiveRole();
}

function applyActiveRole() {
  var r = state.activeRole || (state.user && state.user.role);
  if (r === 'BRAND') {
    state.tab = 'tasks';
    loadMyTasks();
  } else {
    state.tab = 'explore'; state.view = 'list'; render(); loadTasks();
  }
}

/** 任务报酬展示：直接显示 payout_per_herald（已是赫使实收），附加币种换算 */
function commissionLabel(amount, taskCurrency){
  var cur=taskCurrency||'JPY';
  var payout=Number(amount)||0;
  var label='¥'+Number(payout).toLocaleString();
  var disp=state.displayCurrency;
  var er=state.exchangeRate;
  if(disp&&cur!==disp&&er&&er.rate){
    var converted=null;
    if(er.from===cur&&er.to===disp) converted=payout*er.rate;
    else if(er.to===cur&&er.from===disp) converted=payout/er.rate;
    if(converted!=null) label+=' <span style="font-size:11px;color:var(--muted)">(≈¥'+Math.round(converted).toLocaleString()+' '+disp+')</span>';
  }
  return label;
}

      var roles=d.user.roles||[d.user.role];
      if(d.user.role==='BRAND'&&!roles.includes('HERALD')){
        sessionStorage.setItem('herix_switch_token',d.token);

function tryResumeSwitchedSession(){
  var token=sessionStorage.getItem('herix_switch_token');
  if(!token) return false;
  var targetRole=sessionStorage.getItem('herix_switch_role')||null;
  sessionStorage.removeItem('herix_switch_token');
  sessionStorage.removeItem('herix_switch_role');
  state.token=token;
  var xhr=new XMLHttpRequest();
  xhr.open('GET',API+'/auth/me',true);
  xhr.setRequestHeader('Authorization','Bearer '+token);
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText);
      if(d.error||!d.id){state.token=null;render();return}
      var roles=d.roles||[d.role];
      if(d.role==='BRAND'&&!roles.includes('HERALD')&&targetRole!=='HERALD'){
        sessionStorage.setItem('herix_switch_token',token);
        window.location.href='merchant.html';
        return;
      }
      state.user={id:d.id,nickname:d.nickname,role:d.role,roles:roles,is_verified:!!d.is_verified,is_onboarded:!!(d.is_onboarded||d.brand_onboarded)};
      state.activeRole=targetRole&&roles.includes(targetRole)?targetRole:d.role;
      if(!state.user.is_onboarded&&d.role==='HERALD'){state.showOnboard=true;state.onboardStep=1;state.onboardData={};render();return}
      applyActiveRole();
    }catch(e){state.token=null;render()}
  };
  xhr.send();
  return true;
}

function obSelect(key,val){

function obWechatInput(el){
  var val=el.value.trim();
  var prefix=qs('#ob-wechat-prefix');
  var hint=qs('#ob-wechat-hint');
  if(!hint) return;
  // 纯数字 → 手机号模式
  if(/^\d+$/.test(val)&&val.length>0){
    if(prefix) prefix.style.display='block';
    var valid=/^1[3-9]\d{9}$/.test(val);
    if(val.length<11) hint.style.color='var(--muted)',hint.textContent='继续输入手机号（11位）';
    else if(valid) hint.style.color='var(--success)',hint.textContent='✓ 有效的中国大陆手机号，将以 +86 '+val+' 保存';
    else hint.style.color='#ef4444',hint.textContent='手机号格式有误，请检查';
  } else {
    if(prefix) prefix.style.display='none';
    if(val.length===0) hint.style.color='var(--muted)',hint.textContent='微信号：字母+数字，6-20位 · 手机号：输入数字自动识别';
    else if(val.length<6) hint.style.color='var(--muted)',hint.textContent='微信号至少6位';
    else hint.style.color='var(--success)',hint.textContent='✓ 微信 ID';
  }
}

function obValidateWechat(val){
  if(!val) return {ok:true, saved:null}; // 选填，空也可以
  if(/^\d+$/.test(val)){
    if(!/^1[3-9]\d{9}$/.test(val)) return {ok:false, msg:'手机号格式有误（需11位，以1开头）'};
    return {ok:true, saved:'+86'+val};
  }
  if(val.length<6||val.length>20) return {ok:false, msg:'微信号需6-20位'};
  return {ok:true, saved:val};
}

function obNextPlatforms(){
  var wechat=qs('#ob-wechat');
  var d=state.onboardData;
  if(wechat&&wechat.value.trim()){
    var check=obValidateWechat(wechat.value.trim());
    if(!check.ok){alert(check.msg);return}
    d.wechatId=check.saved;
  }
  // 收集 SNS 信息
  if(d.snsPlatform){
    var valEl=qs('#ob-sns-val'),fol=qs('#ob-sns-followers');
    d.snsVal=valEl?valEl.value.trim():'';
    d.snsFollowers=fol&&fol.value?parseInt(fol.value,10):null;
  }
  state.onboardStep=2;render();
}

function obSkipPlatforms(){
  var wechat=qs('#ob-wechat');
  if(wechat&&wechat.value.trim()){
    var check=obValidateWechat(wechat.value.trim());
    if(!check.ok){alert(check.msg);return}
    if(check.saved) state.onboardData.wechatId=check.saved;

  state.onboardStep=2;render();
}

function obSubmit(){
  var d=state.onboardData;
  // 组装 social_platforms
  var platforms=[];
  if(d.wechatId) platforms.push({platformId:'wechat',accountId:d.wechatId,url:null,followers:null});
  if(d.snsPlatform&&d.snsVal){
    var snsMeta=platformById(d.snsPlatform);
    if(snsMeta.inputType==='id') platforms.push({platformId:d.snsPlatform,accountId:d.snsVal,url:null,followers:null});
    else platforms.push({platformId:d.snsPlatform,url:d.snsVal,followers:d.snsFollowers||null,accountId:null});
  }
  var body={
    residence: d.residence,
    residenceCountry: d.residenceCountry||null,
    visaType: d.visaType||null,
    hasWorkPermit: true,
    bankAccountType: d.bankType||null,
    bankDetails: d.bankType?{email:d.bankEmail,swiftCode:d.swiftCode,iban:d.iban}:null,
    socialPlatforms: platforms.length>0?platforms:null,
  };
  var xhr=new XMLHttpRequest();
  xhr.open('POST',API+'/ambassador/onboard',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('Authorization','Bearer '+state.token);
  xhr.onload=function(){
    try{
      var res=JSON.parse(xhr.responseText);
      if(res.error){alert(res.error);return}
      state.user.is_onboarded=1;
      state.onboardStep=4;
      render();
    }catch(e){alert('提交失败')}
  };
  xhr.send(JSON.stringify(body));
}

function obFinish(){

  var pendingTask=_urlTask||sessionStorage.getItem('herix_pending_task');
  if(pendingTask){sessionStorage.removeItem('herix_pending_task');openDetail(pendingTask);return;}
  state.view='list';
  render();loadTasks();
}

function obBrandStep1(){
  var company=qs('#ob-company'),website=qs('#ob-website');

  state.onboardData.website=website?website.value.trim():'';
  state.onboardStep=2;render();
}

function obBrandStep2(){

function applyTask(){
  if(!state.token||!state.detailTask)return;
  var xhr=new XMLHttpRequest();
  xhr.open('POST',API+'/applications/'+state.detailTask.id,true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('Authorization','Bearer '+state.token);
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText);
      if(d.error){
        if(d.code==='REQUIREMENTS_NOT_MET'){
          showRequirementsModal(d.failures, d.canRetry, function(){ applyTask(); });
          return;
        }
        alert(d.error);return;
      }
      toast('报名成功！');openDetail(state.detailTask.id);
    }catch(e){alert('报名失败')}
  };
  xhr.send('{}');
}

function showRequirementsModal(failures, canRetry, onSuccess){
  var modal=document.createElement('div');
  modal.className='modal-overlay';
  modal.id='req-modal';
  var inner='<div class="modal-card">';
  inner+='<div class="modal-title">不满足报名条件</div>';
  inner+='<div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px">请查看以下问题</div>';

  var missingIds=[];
  for(var i=0;i<failures.length;i++){
    var f=failures[i];
    var p=platformById(f.platformId);
    inner+='<div style="padding:10px 12px;border-radius:10px;margin-bottom:8px;';
    if(f.type==='INSUFFICIENT'){
      // 硬拒绝，红色背景
      inner+='background:#fef2f2;border:1px solid #fecaca">';
      inner+='<div style="display:flex;align-items:center;gap:8px">';
      inner+='<span style="font-size:18px">'+p.icon+'</span>';
      inner+='<div><div style="font-size:13px;font-weight:600;color:#dc2626">'+p.name+' 粉丝数不足</div>';
      inner+='<div style="font-size:11px;color:#ef4444;margin-top:2px">当前 '+f.current.toLocaleString()+' · 要求 '+f.required.toLocaleString()+'+ 粉</div></div></div>';
    } else {
      // 缺失，橙色背景，可补充
      inner+='background:#fffbeb;border:1px solid #fde68a">';
      inner+='<div style="display:flex;align-items:center;gap:8px">';
      inner+='<span style="font-size:18px">'+p.icon+'</span>';
      inner+='<div><div style="font-size:13px;font-weight:600;color:#92400e">'+p.name+' 账号未添加</div>';
      inner+='<div style="font-size:11px;color:#a16207;margin-top:2px">添加后可重新报名</div></div></div>';
      missingIds.push(f.platformId);
    }
    inner+='</div>';
  }

  if(canRetry && missingIds.length>0){
    // 有缺失账号 → 展开添加表单
    inner+='<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">';
    inner+='<div style="font-size:12px;font-weight:600;margin-bottom:10px">补充缺失账号</div>';
    for(var j=0;j<missingIds.length;j++){
      var pid=missingIds[j];
      var pm=platformById(pid);
      var isWechat=pid==='wechat';
      var isIdType=pm.inputType==='id';
      inner+='<div style="margin-bottom:10px">';
      inner+='<div style="font-size:12px;color:#555;margin-bottom:4px">'+pm.icon+' '+pm.name+(isIdType?' 账号 ID':' 主页链接')+'</div>';
      if(isWechat){
        inner+='<div style="display:flex;gap:6px;align-items:center">';
        inner+='<div id="req-wx-prefix-'+pid+'" style="padding:11px 10px;background:#f2f3f7;border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--muted);display:none">+86</div>';
        inner+='<input id="req-plat-'+pid+'" class="ob-input" style="flex:1;margin:0;font-size:13px" placeholder="微信号 或 手机号" oninput="reqWxInput(this,\''+pid+'\')">';
        inner+='</div>';
        inner+='<div id="req-wx-hint-'+pid+'" style="font-size:11px;margin-top:3px;color:var(--muted)">纯数字自动识别手机号</div>';
      } else {
        inner+='<input id="req-plat-'+pid+'" class="ob-input" style="margin:0;font-size:13px" placeholder="'+escHtml(pm.placeholder||'')+'">';
        if(!isIdType){
          inner+='<input id="req-fol-'+pid+'" class="ob-input" style="margin:4px 0 0;font-size:13px" type="number" placeholder="粉丝数（选填）">';
        }
      }
      inner+='</div>';
    }
    inner+='<button class="btn btn-primary" style="margin-top:4px" onclick="submitRequirementsAdd('+JSON.stringify(missingIds).replace(/"/g,'&quot;')+')">保存并重新报名</button>';
  } else {
    // 全是粉丝不足 → 纯告知，无操作
    inner+='<div style="margin-top:4px;padding:10px;background:#f9fafb;border-radius:8px;font-size:12px;color:var(--muted);text-align:center">你目前不满足该任务的资质要求</div>';
  }

  inner+='<div class="link" style="margin-top:12px" onclick="document.getElementById(\'req-modal\').remove()">关闭</div>';
  inner+='</div>';
  modal.innerHTML=inner;
  window._reqModalCallback=onSuccess;
  document.body.appendChild(modal);
}

function reqWxInput(el, pid){
  var val=el.value.trim();
  var prefix=document.getElementById('req-wx-prefix-'+pid);
  var hint=document.getElementById('req-wx-hint-'+pid);
  if(!hint) return;
  if(/^\d+$/.test(val)&&val.length>0){
    if(prefix) prefix.style.display='block';
    var valid=/^1[3-9]\d{9}$/.test(val);
    if(val.length<11) hint.style.color='var(--muted)',hint.textContent='继续输入（11位）';
    else if(valid) hint.style.color='var(--success)',hint.textContent='✓ +86 '+val;
    else hint.style.color='#ef4444',hint.textContent='手机号格式有误';
  } else {
    if(prefix) prefix.style.display='none';
    hint.style.color=val.length>=6?'var(--success)':'var(--muted)';
    hint.textContent=val.length>=6?'✓ 微信 ID':val.length>0?'微信号至少6位':'纯数字自动识别手机号';
  }
}

function submitRequirementsAdd(missingIds){
  var existing=[];
  try{var ap=state.ambassadorProfile||{};existing=ap.social_platforms?JSON.parse(ap.social_platforms):[];}catch(e){}
  var toAdd=[];
  for(var i=0;i<missingIds.length;i++){
    var pid=missingIds[i];
    var pm=platformById(pid);
    var inp=document.getElementById('req-plat-'+pid);
    var val=inp?inp.value.trim():'';
    if(!val){alert('请填写 '+pm.name+' 账号');return}
    if(pid==='wechat'){
      var check=obValidateWechat(val);
      if(!check.ok){alert(check.msg);return}
      toAdd.push({platformId:pid,accountId:check.saved,url:null,followers:null});
    } else if(pm.inputType==='id'){
      toAdd.push({platformId:pid,accountId:val,url:null,followers:null});
    } else {
      var folEl=document.getElementById('req-fol-'+pid);
      var fol=folEl&&folEl.value?parseInt(folEl.value,10):null;
      toAdd.push({platformId:pid,url:val,accountId:null,followers:fol});
    }
  }
  var merged=existing.filter(function(s){return missingIds.indexOf(s.platformId)<0}).concat(toAdd);
  var xhr=new XMLHttpRequest();
  xhr.open('PATCH',API+'/ambassador/profile',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('Authorization','Bearer '+state.token);
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText);
      if(d.error){alert(d.error);return}
      applyProfilePatch(d);
      var m=document.getElementById('req-modal');
      if(m) m.remove();
      if(window._reqModalCallback) window._reqModalCallback();
    }catch(e){alert('保存失败')}
  };
  xhr.send(JSON.stringify({socialPlatforms:merged}));
}

function submitPlatformCollect(platformId, isWechat){
  var inputEl=qs('#pc-platform-input');
  var val=inputEl?inputEl.value.trim():'';
  if(!val){alert('请填写账号信息');return}

  var pMeta=platformById(platformId);
  var newEntry={platformId:platformId};
  if(isWechat){
    var check=obValidateWechat(val);
    if(!check.ok){alert(check.msg);return}
    newEntry.accountId=check.saved;newEntry.url=null;newEntry.followers=null;
  } else if(pMeta.inputType==='id'){
    newEntry.accountId=val;newEntry.url=null;newEntry.followers=null;
  } else {
    var folEl=qs('#pc-followers-input');
    newEntry.url=val;newEntry.accountId=null;
    newEntry.followers=folEl&&folEl.value?parseInt(folEl.value,10):null;
  }

  // 合并到现有档案
  var existing=[];
  try{var ap=state.ambassadorProfile||{};existing=ap.social_platforms?JSON.parse(ap.social_platforms):[];}catch(e){}
  var merged=existing.filter(function(s){return s.platformId!==platformId});
  merged.push(newEntry);

  var xhr=new XMLHttpRequest();
  xhr.open('PATCH',API+'/ambassador/profile',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('Authorization','Bearer '+state.token);
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText);
      if(d.error){alert(d.error);return}
      applyProfilePatch(d);
      var modal=document.getElementById('plat-collect-modal');
      if(modal) modal.remove();
      if(window._platformCollectCallback) window._platformCollectCallback();
    }catch(e){alert('保存失败')}
  };
  xhr.send(JSON.stringify({socialPlatforms:merged}));
}

function showFollowersUpdateModal(platformId, required, onSuccess){
  var pInfo=platformById(platformId);

  var existing=[];
  try{var ap=state.ambassadorProfile||{};existing=ap.social_platforms?JSON.parse(ap.social_platforms):[];}catch(e){}

  modal.className='modal-overlay';

  inner+=pInfo.icon+' '+pInfo.name+' 需要 <strong>'+required.toLocaleString()+'</strong> 粉丝以上';
  if(currentCount) inner+='<br><span style="color:var(--muted);font-size:12px">当前记录：'+currentCount.toLocaleString()+'</span>';
  inner+='</div>';

  inner+='<div id="fu-hint" style="font-size:11px;margin-top:6px;min-height:16px"></div>';
  inner+='<button class="btn btn-primary" style="margin-top:12px" onclick="submitFollowersUpdate(\''+platformId+'\','+required+')">更新并重试</button>';
  inner+='<div class="link" style="margin-top:8px;color:var(--muted)" onclick="document.getElementById(\'followers-update-modal\').remove()">取消报名</div>';
  inner+='</div>';
  modal.innerHTML=inner;
  window._followersUpdateCallback=onSuccess;
  document.body.appendChild(modal);

  // 实时提示是否满足要求
  setTimeout(function(){
    var inp=document.getElementById('fu-followers');
    var hint=document.getElementById('fu-hint');
    if(!inp||!hint) return;
    inp.oninput=function(){
      var v=parseInt(inp.value,10);
      if(isNaN(v)||v<=0){hint.style.color='var(--muted)';hint.textContent='';return}

      else{hint.style.color='#ef4444';hint.textContent='仍不足 '+required.toLocaleString()+' 粉，无法报名此任务';}
    };
    if(inp.value) inp.oninput();
  },50);

function submitFollowersUpdate(platformId, required){
  var inp=document.getElementById('fu-followers');
  var newCount=inp?parseInt(inp.value,10):NaN;
  if(isNaN(newCount)||newCount<=0){alert('请输入有效的粉丝数');return}
  if(newCount<required){
    // 明确告知不符合，不再循环
    document.getElementById('followers-update-modal').remove();
    alert('你的 '+platformById(platformId).name+' 粉丝数（'+newCount.toLocaleString()+'）不满足该任务要求（'+required.toLocaleString()+'+ 粉），暂时无法报名。');
    return;
  }
  // 更新档案里的粉丝数
  var existing=[];
  try{var ap=state.ambassadorProfile||{};existing=ap.social_platforms?JSON.parse(ap.social_platforms):[];}catch(e){}
  var merged=existing.map(function(s){
    if(s.platformId!==platformId) return s;
    return Object.assign({},s,{followers:newCount});
  });
  var xhr=new XMLHttpRequest();
  xhr.open('PATCH',API+'/ambassador/profile',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('Authorization','Bearer '+state.token);
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText);
      if(d.error){alert(d.error);return}
      applyProfilePatch(d);
      var modal=document.getElementById('followers-update-modal');
      if(modal) modal.remove();
      if(window._followersUpdateCallback) window._followersUpdateCallback();
    }catch(e){alert('保存失败')}
  };
  xhr.send(JSON.stringify({socialPlatforms:merged}));
}

function assignReferral(){
  if(!state.token||!state.detailTask)return;
  var xhr=new XMLHttpRequest();
  xhr.open('POST',API+'/referrals/assign/'+state.detailTask.id,true);

function doCreateTask(){
  var title=qs('#ct-title').value,desc=qs('#ct-desc').value,budget=qs('#ct-budget').value,comm=qs('#ct-comm').value;
  var max=qs('#ct-max').value||1,mode=qs('#ct-mode').value,cat=qs('#ct-cat').value;
  if(!title||!desc||!comm){alert('请填写标题、描述和报酬');return}
  var xhr=new XMLHttpRequest();
  xhr.open('POST',API+'/tasks',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('Authorization','Bearer '+state.token);
  xhr.onload=function(){
    try{var d=JSON.parse(xhr.responseText);if(d.error){alert(d.error);return}
      // 自动发布
      var xhr2=new XMLHttpRequest();
      xhr2.open('PATCH',API+'/tasks/'+d.id+'/publish',true);
      xhr2.setRequestHeader('Authorization','Bearer '+state.token);
      xhr2.onload=function(){
        // 自动托管 escrow
        var xhr3=new XMLHttpRequest();
        xhr3.open('PATCH',API+'/tasks/'+d.id+'/escrow',true);
        xhr3.setRequestHeader('Authorization','Bearer '+state.token);
        xhr3.onload=function(){alert('任务已创建并发布！');loadMyTasks()};
        xhr3.send();
      };
      xhr2.send();
    }catch(e){alert('创建失败')}
  };
  xhr.send(JSON.stringify({title:title,description:desc,payoutPerHerald:Number(comm),maxHeralds:Number(max),mode:mode,category:cat}));
}

/* ── 消息中心帮助函数 ── */
function formatNotifTime(ts){
  if(!ts) return '';
  var d=new Date(ts),now=new Date();
  var diffH=(now-d)/(1000*60*60);
  if(diffH<24&&d.getDate()===now.getDate())
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  if(d.getFullYear()===now.getFullYear())
    return (d.getMonth()+1)+'月'+d.getDate()+'日';
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
}

function notifCardHTML(n){
  var isUnread=!n.is_read;
  var accentMap={SUB_APPROVED:'#16a34a',SUB_REJECTED:'#dc2626',APP_APPROVED:'#16a34a',APP_REJECTED:'#dc2626',SETTLEMENT_BLOCKED:'#d97706'};
  var iconMap={SUB_APPROVED:'✅',SUB_REJECTED:'❌',APP_APPROVED:'🎉',APP_REJECTED:'😔',SETTLEMENT_BLOCKED:'⚠️'};
  var accent=accentMap[n.type]||'var(--primary)';
  var icon=iconMap[n.type]||'💬';
  var ts=formatNotifTime(n.created_at);
  var meta={};try{meta=JSON.parse(n.metadata||'{}')}catch(e){}
  var h='<div onclick="notifClick(\''+n.id+'\')" style="background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:8px;border-left:3px solid '+(isUnread?accent:'transparent')+';cursor:'+(isUnread?'pointer':'default')+'">';
  h+='<div style="display:flex;gap:12px;align-items:flex-start">';
  h+='<div style="flex-shrink:0;width:38px;height:38px;background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px">'+icon+'</div>';
  h+='<div style="flex:1;min-width:0">';
  h+='<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">';
  h+='<div style="font-size:13px;font-weight:'+(isUnread?'600':'400')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escHtml(n.title)+'</div>';
  h+='<div style="flex-shrink:0;font-size:11px;color:var(--muted)">'+ts+'</div>';
  h+='</div>';
  h+='<div style="font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6">'+escHtml(n.body)+'</div>';
  if(meta.taskId){
    h+='<div style="margin-top:8px"><span role="button" onclick="goToTask(\''+meta.taskId+'\');event.stopPropagation()" style="font-size:12px;color:var(--primary);font-weight:500;cursor:pointer">查看任务 →</span></div>';
  }
  h+='</div></div></div>';
  return h;
}

function notifClick(id){
  var n=state.notifications.find(function(x){return x.id===id});
  if(!n||n.is_read) return;
  var xhr=new XMLHttpRequest();
  xhr.open('PATCH',API+'/notifications/'+id+'/read',true);
  xhr.setRequestHeader('Authorization','Bearer '+state.token);
  xhr.onload=function(){n.is_read=true;state.unread=Math.max(0,state.unread-1);render();};
  xhr.send();
}

function goToTask(taskId){state.tab='explore';openDetail(taskId);}

function messagesHTML(){
  var SLABEL='font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.8px;margin-bottom:8px';
  var h=hdrHTML()+'<div class="dash">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  h+='<div style="font-size:16px;font-weight:700">消息</div>';
  if(state.unread>0) h+='<span role="button" style="font-size:12px;color:var(--primary);cursor:pointer" onclick="markAllRead()">全部已读</span>';
  h+='</div>';

  if(!state._notifsLoaded){
    h+='<div style="text-align:center;padding:60px 20px;color:var(--muted);font-size:13px">加载中…</div>';
  } else if(state.notifications.length===0){
    h+='<div style="text-align:center;padding:60px 20px">';
    h+='<div style="font-size:36px;margin-bottom:12px">📭</div>';
    h+='<div style="font-size:14px;font-weight:600;margin-bottom:6px">暂无消息</div>';
    h+='<div style="font-size:12px;color:var(--muted)">任务审核、报名结果等通知会出现在这里</div>';
    h+='</div>';
  } else {
    var unreadList=state.notifications.filter(function(n){return !n.is_read;});
    var readList=state.notifications.filter(function(n){return !!n.is_read;});
    var hasBoth=unreadList.length>0&&readList.length>0;
    if(unreadList.length>0){
      if(hasBoth) h+='<div style="'+SLABEL+'">新消息</div>';
      for(var i=0;i<unreadList.length;i++) h+=notifCardHTML(unreadList[i]);
    }
    if(readList.length>0){
      h+='<div style="'+SLABEL+(hasBoth?';margin-top:16px':'')+'">历史消息</div>';
      for(var i=0;i<readList.length;i++) h+=notifCardHTML(readList[i]);
    }
  }
  h+='</div>';
  return h;
}
