function setLang(lang) {
  document.querySelectorAll('.lang-btn').forEach(function(b) {
    b.classList.remove('active');
  });
  document.querySelector('.lang-btn[onclick="setLang(\'' + lang + '\')"]').classList.add('active');

  var c = CONTENT[lang];
  document.querySelectorAll('[data-key]').forEach(function(el) {
    var key = el.dataset.key;
    if (c[key] !== undefined) {
      if (key === 'headline') {
        el.innerHTML = c[key].replace(/\n/g, '<br>');
      } else {
        el.textContent = c[key];
      }
    }
  });

  // 商标横版 logo 含"赫使"汉字，非中文语言切换为纯英文版
  document.querySelectorAll('.brand-logo').forEach(function(img) {
    img.src = lang === 'zh' ? img.dataset.srcZh : img.dataset.srcAlt;
  });
}

var lang = navigator.language || 'zh';
if (lang.startsWith('zh')) setLang('zh');
else if (lang.startsWith('ja')) setLang('ja');
else setLang('en');
