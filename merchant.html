<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herix 商户后台</title>
<style>
:root {
  --primary: #0070CC; --sidebar: #111827; --sidebar-text: #9ca3af;
  --sidebar-active: #fff; --bg: #f5f5f7; --card: #fff;
  --text: #111; --muted: #6b7280; --border: #e5e7eb;
  --success: #16a34a; --warning: #d97706; --danger: #dc2626;
  --sidebar-w: 220px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif; background:var(--bg); color:var(--text); font-size:14px; }

/* ── Layout ── */
.layout { display:flex; min-height:100vh; }
.sidebar {
  width:var(--sidebar-w); background:var(--sidebar); color:var(--sidebar-text);
  display:flex; flex-direction:column; position:fixed; top:0; left:0; height:100vh; z-index:100;
  transition: transform .25s;
}
.main { margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; min-height:100vh; }
.topbar {
  background:#fff; border-bottom:1px solid var(--border);
  padding:0 28px; height:60px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:50;
}
.content { padding:28px; flex:1; }

/* ── Sidebar ── */
.sb-logo { padding:20px 20px 8px; font-size:16px; font-weight:800; color:#fff; letter-spacing:1px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:8px; }
.sb-logo span { color:var(--primary); }
.sb-section { padding:8px 12px 4px; font-size:10px; letter-spacing:1.5px; color:rgba(255,255,255,.3); text-transform:uppercase; }
.sb-item {
  display:flex; align-items:center; gap:10px; padding:10px 16px; margin:2px 8px;
  border-radius:8px; cursor:pointer; font-size:13px; color:var(--sidebar-text);
  transition: all .15s;
}
.sb-item:hover { background:rgba(255,255,255,.07); color:#fff; }
.sb-item.active { background:var(--primary); color:#fff; }
.sb-item .icon { font-size:16px; width:20px; text-align:center; }
.sb-badge { background:#ef4444; color:#fff; font-size:10px; padding:1px 6px; border-radius:10px; margin-left:auto; }
.sb-icon { font-size:15px; width:20px; text-align:center; }
.sb-bottom { margin-top:auto; padding:16px; border-top:1px solid rgba(255,255,255,.08); }
.sb-user { font-size:12px; color:rgba(255,255,255,.5); margin-bottom:8px; }
.sb-logout { font-size:12px; color:rgba(255,255,255,.4); cursor:pointer; }
.sb-logout:hover { color:#fff; }

/* ── Topbar ── */
.page-title { font-size:18px; font-weight:700; }
.topbar-right { display:flex; align-items:center; gap:12px; }
.btn { padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; border:none; cursor:pointer; transition:all .15s; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:#005bb5; }
.btn-outline { background:#fff; color:var(--text); border:1px solid var(--border); }
.btn-outline:hover { border-color:#999; }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-success { background:var(--success); color:#fff; }

/* ── Cards & Stats ── */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
.stat-card { background:#fff; border-radius:12px; padding:20px; }
.stat-val { font-size:28px; font-weight:700; margin-bottom:4px; }
.stat-lbl { font-size:12px; color:var(--muted); }

/* ── Table ── */
.table-card { background:#fff; border-radius:12px; overflow:hidden; }
.table-head { padding:16px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
.table-title { font-size:15px; font-weight:600; }
table { width:100%; border-collapse:collapse; }
th { padding:10px 20px; text-align:left; font-size:12px; color:var(--muted); font-weight:500; border-bottom:1px solid var(--border); background:#fafafa; }
td { padding:12px 20px; border-bottom:1px solid var(--border); font-size:13px; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#f9fafb; cursor:pointer; }
.tag { display:inline-flex; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.tag-open { background:#dcfce7; color:#16a34a; }
.tag-draft { background:#fef3c7; color:#d97706; }
.tag-completed { background:#e0e7ff; color:#4338ca; }
.tag-cancelled { background:#fee2e2; color:#dc2626; }
.tag-pending { background:#fef3c7; color:#d97706; }
.tag-approved { background:#dcfce7; color:#16a34a; }
.tag-rejected { background:#fee2e2; color:#dc2626; }

/* ── Form ── */
.form-card { background:#fff; border-radius:12px; padding:24px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-full { grid-column:1/-1; }
.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size:12px; font-weight:600; color:var(--muted); }
.field input, .field textarea, .field select {
  padding:10px 12px; border:1px solid var(--border); border-radius:8px;
  font-size:13px; color:var(--text); background:#fff; outline:none;
  transition: border-color .15s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color:var(--primary); }
.field textarea { resize:vertical; min-height:80px; }
.form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding-top:20px; border-top:1px solid var(--border); }
.field-hint { font-size:11px; color:var(--muted); margin-top:2px; }

/* ── Detail panels ── */
.detail-grid { display:grid; grid-template-columns:1fr 320px; gap:20px; align-items:start; }
.panel { background:#fff; border-radius:12px; padding:20px; margin-bottom:16px; }
.panel-title { font-size:14px; font-weight:600; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
.info-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.info-row:last-child { border-bottom:none; }
.info-key { color:var(--muted); }
.applicant-card { padding:14px; border:1px solid var(--border); border-radius:10px; margin-bottom:10px; }
.applicant-card:last-child { margin-bottom:0; }
.applicant-hdr { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.av { width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
.sub-card { border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; }
.sub-card:last-child { margin-bottom:0; }

/* ── Tabs ── */
.tabs { display:flex; gap:4px; background:#f3f4f6; border-radius:10px; padding:4px; margin-bottom:20px; }
.tab { flex:1; text-align:center; padding:7px; border-radius:7px; font-size:13px; cursor:pointer; color:var(--muted); font-weight:500; }
.tab.active { background:#fff; color:var(--text); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.1); }

/* ── Login ── */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); }
.login-card { background:#fff; border-radius:16px; padding:40px; width:380px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
.login-logo { font-size:22px; font-weight:800; text-align:center; margin-bottom:4px; }
.login-logo span { color:var(--primary); }
.login-sub { text-align:center; font-size:12px; color:var(--muted); margin-bottom:28px; }
.field-lg input { padding:12px 14px; font-size:14px; }

/* ── Empty ── */
.empty { text-align:center; padding:60px 20px; color:var(--muted); }
.empty-icon { font-size:40px; margin-bottom:12px; }

/* ── Alert ── */
.alert { padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; }
.alert-error { background:#fee2e2; color:#991b1b; }
.alert-success { background:#dcfce7; color:#166534; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .sidebar { transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); }
  .main { margin-left:0; }
  .stats-grid { grid-template-columns:1fr 1fr; }
  .form-grid { grid-template-columns:1fr; }
  .detail-grid { grid-template-columns:1fr; }
  .hamburger { display:flex; }
}
.hamburger { display:none; align-items:center; justify-content:center; width:36px; height:36px; border:none; background:none; cursor:pointer; font-size:20px; }
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:90; }
.overlay.show { display:block; }
</style>
<script src="/shared/auth.js"></script>
<script src="/shared/sidebar.js"></script>
<script src="/shared/platforms.js"></script>
</head>
<body>

<div id="root"></div>

<script>
var API = '/api';
var state = {
  page: 'login', user: null, token: null,
  tasks: [], currentTask: null, taskTab: 'applicants',
  stats: {}, msg: null, msgType: 'success',
  editingTask: null, showActivate: false, tasksLoading: false, taskFilter: '',
};

/* ── Routing ── */
function go(page, data) {
  state.page = page;
  if (data) Object.assign(state, data);
  state.msg = null;
  render();
}

function render() {
  var root = document.getElementById('root');
  if (!state.user) { root.innerHTML = loginPage(); bindLogin(); return; }
  if (state.showActivate) { root.innerHTML = activateBrandPage(); return; }
  root.innerHTML = layout(pageContent());
  bindNav();
  bindPage();
}

function layout(inner) {
  var sm = state.dashStats?.summary||{}; var pending = (sm.pendingApplicants||0)+(sm.pendingSubmissions||0);
  var nav = [
    { id:'dashboard', icon:'📊', label:'概览' },
    { id:'tasks', icon:'📋', label:'任务管理' },
    { id:'reviews', icon:'✅', label:'审核中心', badge: pending },
    { id:'wallet', icon:'💰', label:'钱包充值' },
    { id:'csv', icon:'📤', label:'数据上传' },
    { id:'settings', icon:'⚙️', label:'账户设置' },
  ];
  var sb = '<div class="sidebar" id="sidebar">';
  sb += '<div class="sb-logo">HERIX<span>.</span><div style="font-size:10px;color:rgba(255,255,255,.4);font-weight:400;margin-top:2px;letter-spacing:0">商户后台</div></div>';
  sb += Sidebar.navItems(nav, { activeId: state.page, onclick: "nav('%s')" });
  sb += '<div class="sb-bottom"><div class="sb-user">'+esc(state.user.nickname)+'<br><span style="font-size:10px">品牌商家</span></div>';
  var linked = state.brandProfile?.linkedAccount;
  if (linked) {
    var linkedRoleLabel = (linked.roles||[]).includes('HERALD') ? '赫使' : '商家';
    sb += '<div class="sb-logout" onclick="switchAccount()" style="margin-bottom:4px">🔁 切换到'+esc(linked.nickname)+'（'+linkedRoleLabel+'）</div>';
  }
  sb += '<div class="sb-logout" onclick="logout()">退出登录</div></div></div>';

  var main = '<div class="main"><div class="topbar">';
  main += '<div style="display:flex;align-items:center;gap:12px"><button class="hamburger" onclick="toggleSidebar()">☰</button>';
  main += '<div class="page-title" id="page-title">'+getPageTitle()+'</div></div>';
  main += '<div class="topbar-right">'+topbarActions()+'</div></div>';
  if (state.msg) main += '<div style="padding:0 28px;margin-top:16px"><div class="alert alert-'+state.msgType+'">'+esc(state.msg)+'</div></div>';
  main += '<div class="content">'+inner+'</div></div>';

  return '<div class="layout">'+sb+main+'</div><div class="overlay" id="overlay" onclick="toggleSidebar()"></div>';
}

function getPageTitle() {
  var m = {dashboard:'概览', tasks:'任务管理', reviews:'审核中心', wallet:'钱包充值', csv:'数据上传', settings:'账户设置', task_detail:'任务详情', task_create:'创建任务', task_edit:'编辑任务', task_meta_edit:'编辑任务'};
  return m[state.page] || '';
}

function topbarActions() {
  if (state.page === 'tasks') return '<button class="btn btn-primary btn-sm" onclick="go(\'task_create\')">+ 创建任务</button>';
  if (state.page === 'task_detail' && state.currentTask) {
    var t = state.currentTask;
    var btns = '<button class="btn btn-outline btn-sm" onclick="go(\'tasks\')">← 返回</button>';
    if (t.status === 'DRAFT') btns += ' <button class="btn btn-primary btn-sm" onclick="publishTask(\''+t.id+'\')">发布任务</button>';
    if (t.status === 'OPEN' || t.status === 'IN_PROGRESS') {
      btns += ' <button class="btn btn-outline btn-sm" onclick="editTaskMeta()">编辑</button>';
      if (t.status === 'OPEN') btns += ' <button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="closeTask(\''+t.id+'\')">关闭任务</button>';
    }
    return btns;
  }
  if (state.page === 'task_create' || state.page === 'task_edit' || state.page === 'task_meta_edit') return '<button class="btn btn-outline btn-sm" onclick="go(\'task_detail\')">取消</button>';
  return '';
}

function pageContent() {
  switch(state.page) {
    case 'dashboard':   return dashPage();
    case 'tasks':       return tasksPage();
    case 'task_detail': return taskDetailPage();
    case 'task_create': taskPlatformReqs=[]; return taskFormPage(null);
    case 'task_edit':   taskPlatformReqs=[]; return taskFormPage(state.editingTask);
    case 'task_meta_edit': taskPlatformReqs=[]; return taskMetaEditPage();
    case 'reviews':     return reviewsPage();
    case 'wallet':      return walletPage();
    case 'csv':         return csvPage();
    case 'settings':    return settingsPage();
    default: return dashPage();
  }
}

/* ── Login ── */
function loginPage() {
  return '<div class="login-wrap"><div class="login-card">'
    +'<div class="login-logo">HERIX<span>.</span></div>'
    +'<div class="login-sub">品牌商家管理后台</div>'
    +Auth.loginForm({
      title: '',
      subtitle: '',
      emailId: 'email',
      passwordId: 'password',
      emailPlaceholder: 'brand@company.com',
      passwordPlaceholder: '密码',
      fieldClass: 'field field-lg',
      titleClass: '',
      subtitleClass: '',
      submitStyle: 'width:100%;padding:12px',
      submitBtnClass: '',
    })
    +'<div style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted)">还没有账号？<a href="preview.html" style="color:var(--primary)">前往注册</a></div>'
    +'</div></div>';
}

function bindLogin() {
  Auth.init({
    api: API + '/auth',
    onLogin: function(d) {
      var uRoles=d.user.roles||[d.user.role];
      if(!uRoles.includes('BRAND')){
        document.getElementById('auth-form-err').innerHTML='<div class="alert alert-error">此页面仅限商家用户</div>';
        return;
      }
      state.token=d.token;state.user=d.user;
      state.msg='登录成功';state.msgType='success';
      loadDashStats();loadMyTasks();loadBrandProfile();
    },
    onError: function(msg) {
      var el=document.getElementById('auth-form-err');
      if(el)el.innerHTML='<div class="alert alert-error">'+esc(msg)+'</div>';
    }
  });
}

function activateBrandPage() {
  var step = state.activateStep || 1;
  var h = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc">';
  h += '<div style="background:#fff;border-radius:16px;padding:40px;width:440px;max-width:94vw;box-shadow:0 4px 24px rgba(0,0,0,.08)">';

  // 进度条
  h += '<div style="display:flex;gap:6px;margin-bottom:28px">';
  for (var i = 1; i <= 2; i++) h += '<div style="flex:1;height:3px;border-radius:2px;background:'+(i<=step?'var(--primary)':'#e2e8f0')+'"></div>';
  h += '</div>';

  if (step === 1) {
    var actCur = state.activateData?.currency;
    h += '<div style="font-size:20px;font-weight:700;margin-bottom:6px">开通品牌商家功能</div>';
    h += '<div style="font-size:13px;color:var(--muted);margin-bottom:24px">你好，'+esc(state.user.nickname)+'！填写品牌信息后即可发布任务、招募赫使。</div>';
    h += '<div class="field"><label>业务市场 *</label><div style="display:flex;gap:10px;margin-top:6px">';
    h += '<div class="btn btn-outline btn-sm" style="flex:1;'+(actCur==='JPY'?'border-color:var(--primary);color:var(--primary)':'')+'" onclick="state.activateData=Object.assign({},state.activateData,{currency:\'JPY\'});render()">🇯🇵 日本市场（JPY）</div>';
    h += '<div class="btn btn-outline btn-sm" style="flex:1;'+(actCur==='CNY'?'border-color:var(--primary);color:var(--primary)':'')+'" onclick="state.activateData=Object.assign({},state.activateData,{currency:\'CNY\'});render()">🇨🇳 中国市场（CNY）</div>';
    h += '</div><div style="font-size:12px;color:var(--muted);margin-top:6px">入驻后业务市场和结算币种不可更改，请谨慎选择</div></div>';
    h += '<div class="field" style="margin-top:12px"><label>公司 / 品牌名称 *</label><input id="act-company" placeholder="例：Remitly Japan" value="'+esc(state.activateData?.companyName||'')+'"></div>';
    h += '<div class="field" style="margin-top:12px"><label>所属行业</label><select id="act-industry">';
    ['金融服务','美妆','时尚','食品饮料','旅游','母婴','电商','其他'].forEach(function(i){h+='<option>'+i+'</option>'});
    h += '</select></div>';
    h += '<div class="field" style="margin-top:12px"><label>官网（选填）</label><input id="act-website" placeholder="https://..." value="'+esc(state.activateData?.website||'')+'"></div>';
    h += '<div style="display:flex;gap:10px;margin-top:24px">';
    h += '<button class="btn btn-outline" style="flex:1" onclick="cancelActivate()">取消</button>';
    h += '<button class="btn btn-primary" style="flex:1" onclick="activateStep2()">下一步</button>';
    h += '</div>';
  } else {
    h += '<div style="font-size:20px;font-weight:700;margin-bottom:6px">联系方式</div>';
    h += '<div style="font-size:13px;color:var(--muted);margin-bottom:24px">平台将通过此方式与你确认合作细节。</div>';
    h += '<div class="field"><label>联系人姓名 *</label><input id="act-contact" placeholder="你的姓名"></div>';
    h += '<div class="field" style="margin-top:12px"><label>联系电话（选填）</label><input id="act-phone" placeholder="+81 ..."></div>';
    h += '<div id="act-err" style="margin-top:12px"></div>';
    h += '<div style="display:flex;gap:10px;margin-top:24px">';
    h += '<button class="btn btn-outline" style="flex:1" onclick="state.activateStep=1;render()">返回</button>';
    h += '<button class="btn btn-primary" style="flex:1" onclick="doActivateBrand()">开通并进入后台</button>';
    h += '</div>';
  }

  h += '</div></div>';
  return h;
}

function activateStep2() {
  var company = (document.getElementById('act-company')||{}).value||'';
  if (!state.activateData?.currency) { alert('请选择业务市场'); return; }
  if (!company.trim()) { alert('请填写品牌名称'); return; }
  state.activateData = Object.assign({}, state.activateData, {
    companyName: company.trim(),
    industry: (document.getElementById('act-industry')||{}).value||'',
    website: (document.getElementById('act-website')||{}).value||'',
  });
  state.activateStep = 2;
  render();
}

function doActivateBrand() {
  var contact = (document.getElementById('act-contact')||{}).value||'';
  if (!contact.trim()) { alert('请填写联系人姓名'); return; }
  var data = Object.assign({}, state.activateData||{}, {
    contactName: contact.trim(),
    contactPhone: (document.getElementById('act-phone')||{}).value||'',
  });
  var errEl = document.getElementById('act-err');

  // Step 1: 添加 BRAND 角色
  patch('POST', '/users/add-role', { role: 'BRAND' }, function(d) {
    if (d.error && d.error.indexOf('已拥有') === -1) {
      if (errEl) errEl.innerHTML = '<div class="alert alert-error">'+esc(d.error)+'</div>';
      return;
    }
    if (d.token) state.token = d.token;

    // Step 2: 完成品牌入驻
    patch('POST', '/users/brand/onboard', data, function(d2) {
      if (d2.error) {
        if (errEl) errEl.innerHTML = '<div class="alert alert-error">'+esc(d2.error)+'</div>';
        return;
      }
      state.showActivate = false;
      state.activateStep = 1;
      state.activateData = null;
      state.page = 'dashboard';
      render();
      loadDashStats();
    });
  });
}

function cancelActivate() {
  state.showActivate = false;
  state.token = null;
  state.user = null;
  render();
}



/* ── Dashboard ── */
function dashPage() {
  var s = state.dashStats || {};
  var sm = s.summary || {};
  var tasks = s.tasks || [];
  var pending = (sm.pendingApplicants||0) + (sm.pendingSubmissions||0);

  var html = '';

  // 核心指标 — 第一行
  html += '<div class="stats-grid">'
    + statCard('累计支出', '¥'+Number(sm.totalSpend||0).toLocaleString(), '#0070CC', '💰')
    + statCard('已完成任务', sm.totalCompleted||0, '#16a34a', '✅', '件')
    + statCard('在线任务', sm.openTasks||0, '#7c3aed', '📋', '个')
    + statCard('待处理', pending, pending>0?'#dc2626':'#16a34a', '⚠️', '项')
    + '</div>';

  // 第二行
  html += '<div class="stats-grid" style="margin-top:-8px">'
    + statCard('总报名人次', sm.totalApplicants||0, '#0891b2', '👤', '人')
    + statCard('待审报名', sm.pendingApplicants||0, '#d97706', '⏳', '条')
    + statCard('待审内容', sm.pendingSubmissions||0, '#d97706', '📄', '条')
    + statCard('推广码转化', sm.qualifiedReferrals||0, '#0070CC', '🔗', '单')
    + '</div>';

  // 待处理提醒
  if (pending > 0) {
    html += '<div style="background:#fffbeb;border:1px solid #fbbf24;border-radius:12px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between">'
      + '<div style="font-size:13px;color:#92400e">⚠️ 有 <strong>'+pending+'</strong> 条事项待处理'
      + (sm.pendingApplicants?' · '+sm.pendingApplicants+'条报名':'')
      + (sm.pendingSubmissions?' · '+sm.pendingSubmissions+'条内容审核':'')
      +'</div><button class="btn btn-sm" style="background:#f59e0b;color:#fff" onclick="nav(\'reviews\')">去处理</button></div>';
  }

  // 任务绩效表
  if (tasks.length) {
    html += '<div class="table-card"><div class="table-head"><div class="table-title">任务绩效</div>'
      +'<button class="btn btn-outline btn-sm" onclick="nav(\'tasks\')">管理任务</button></div>'
      +'<table><thead><tr><th>任务名称</th><th>状态</th><th>报名</th><th>通过</th><th>提交</th><th>完成</th><th>转化率</th><th>支出</th></tr></thead><tbody>'
      + tasks.map(function(t) {
          var conversion = t.app_total > 0 ? Math.round((t.sub_approved/t.app_total)*100)+'%' : '-';
          var spent = (t.sub_approved||0) * t.commission;
          return '<tr onclick="openTask(\''+t.id+'\')" style="cursor:pointer">'
            +'<td><div style="font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</div>'
            +'<div style="font-size:11px;color:var(--muted);margin-top:1px">'+(t.mode==='PERFORMANCE'?'类A · 推广码':'类B · 内容')+'</div></td>'
            +'<td><span class="tag tag-'+t.status.toLowerCase()+'">'+statusLabel(t.status)+'</span></td>'
            +'<td>'+t.app_total+(t.app_pending?' <span style="color:var(--warning);font-size:11px">('+t.app_pending+'待)</span>':'')+'</td>'
            +'<td>'+t.app_approved+'</td>'
            +'<td>'+t.sub_total+(t.sub_pending?' <span style="color:var(--warning);font-size:11px">('+t.sub_pending+'待)</span>':'')+'</td>'
            +'<td style="font-weight:600;color:var(--success)">'+t.sub_approved+'</td>'
            +'<td style="color:var(--muted)">'+conversion+'</td>'
            +'<td>¥'+Number(spent).toLocaleString()+'</td>'
            +'</tr>';
        }).join('')
      +'</tbody></table></div>';
  } else {
    html += '<div class="table-card"><div class="empty"><div class="empty-icon">📋</div><div style="margin-bottom:14px">还没有任务</div>'
      +'<button class="btn btn-primary" onclick="go(\'task_create\')">+ 创建第一个任务</button></div></div>';
  }

  return html;
}

function tierBadge(tierSnapshot) {
  if (!tierSnapshot) return '';
  try {
    var snap = typeof tierSnapshot === 'string' ? JSON.parse(tierSnapshot) : tierSnapshot;
    return Object.keys(snap).map(function(pid) {
      var p = platformById(pid);
      return '<span style="font-size:10px;background:#f0f4ff;color:#4f6ef7;border-radius:4px;padding:1px 6px;margin-right:3px">'
        + p.icon + ' ' + snap[pid] + '</span>';
    }).join('');
  } catch(e) { return ''; }
}

function ratingBadge(completedTasks, goodRate) {
  if (!completedTasks || completedTasks < 3) return '<span style="font-size:10px;color:var(--muted)">未评级</span>';
  var rate = Number(goodRate) || 0;
  var level = 'Bronze';
  if (completedTasks >= 50 && rate >= 0.95) level = 'Platinum';
  else if (completedTasks >= 25 && rate >= 0.85) level = 'Gold';
  else if (completedTasks >= 10 && rate >= 0.75) level = 'Silver';
  var colors = {Bronze:'#cd7f32',Silver:'#9ca3af',Gold:'#f59e0b',Platinum:'#7c3aed'};
  return '<span style="font-size:10px;font-weight:600;color:'+colors[level]+'">⭐ '+level+'</span>'
    + '<span style="font-size:10px;color:var(--muted);margin-left:4px">'+completedTasks+'单 好评'+Math.round(rate*100)+'%</span>';
}

  if (!apps.length) return '<div class="empty" style="padding:30px"><div class="empty-icon">👤</div>暂无报名</div>';

    var country = a.country ? ' · '+esc(a.country) : '';
    var tiers = tierBadge(a.tier_snapshot);
    var rating = ratingBadge(a.completed_tasks, a.good_rate);

      +(tiers ? '<div style="margin-bottom:6px">'+tiers+'</div>' : '')

      +(a.message?'<div style="font-size:12px;color:#555;margin-bottom:8px;padding:8px;background:#f9fafb;border-radius:6px">'+esc(a.message)+'</div>':'')
      +(a.status==='PENDING'?'<div style="display:flex;gap:8px"><button class="btn btn-success btn-sm" onclick="reviewApp(\''+a.id+'\',\'APPROVED\')">✓ 通过</button><button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="reviewApp(\''+a.id+'\',\'REJECTED\')">✗ 拒绝</button></div>':'')

function toggleCodeMode() {

}

function toggleCodeModeSection() {
  var mode = document.getElementById('mode')?.value;
  var codeSection = document.getElementById('code-mode-section');
  var ctField = document.getElementById('contentType-field');
  if (codeSection) codeSection.style.display = (mode === 'PERFORMANCE') ? 'block' : 'none';
  // PERFORMANCE 任务不需要内容形式（赫使用推广码，不提交内容）

function uploadCustomCodes(taskId) {
  var raw = (document.getElementById('custom-codes-input') || {}).value || '';
  var codes = raw.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
  if (!codes.length) { alert('请输入至少一个推广码'); return; }
  var resultEl = document.getElementById('upload-result');
  patch('POST', '/tasks/' + taskId + '/codes/upload', { codes: codes }, function(d) {
    if (d.error) {
      if (resultEl) resultEl.innerHTML = '<div class="alert alert-error">'+esc(d.error)+'</div>';
      return;
    }
    if (resultEl) resultEl.innerHTML = '<div class="alert alert-success">已上传 '+d.added+' 个推广码'+(d.skipped?' （'+d.skipped+' 个重复跳过）':'')+'</div>';
    var input = document.getElementById('custom-codes-input');
    if (input) input.value = '';
    // 刷新码池
    get('/tasks/'+taskId+'/codes', function(pool) { state.codePool = pool; render(); });
  });
}

function downloadCodes(taskId) {
  var url = API + '/tasks/' + taskId + '/codes/export';
  fetch(url, { headers: { Authorization: 'Bearer ' + state.token } })
    .then(function(r) { return r.blob(); })
    .then(function(b) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'herix_promo_codes.csv';
      a.click();
    });
}

function attachAuthHeader(el, url) {
  // 因为浏览器 <a> 无法带 Authorization header，改用 fetch 下载
  event.preventDefault();
  fetch(url, {headers:{Authorization:'Bearer '+state.token}})
    .then(function(r){return r.blob()})
    .then(function(b){
      var a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='herix_codes.csv';
      a.click();
    });
}

function platformReqsFormHTML(t) {
  // 初始化：若是编辑模式，从任务数据加载
  if(t && t.platform_requirements && taskPlatformReqs.length === 0){
    try{ taskPlatformReqs = JSON.parse(t.platform_requirements); }catch(e){}
  }
  var h = '<div class="field form-full" data-plat-reqs="1"><label>赫使社交平台要求 <span style="font-weight:400;font-size:11px;color:var(--muted)">（选填）</span></label>';
  h += '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">选择赫使必须拥有的社交账号及最低粉丝要求</div>';
  h += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">';
  for(var i=0;i<PLATFORM_REGISTRY.length;i++){
    var p=PLATFORM_REGISTRY[i];
    var selected = taskPlatformReqs.some(function(r){return r.platformId===p.id});
    h += '<div class="ob-chip'+(selected?' ob-chip-sel':'')+'" style="cursor:pointer" onclick="togglePlatformReq(\''+p.id+'\')">'+p.icon+' '+p.name+'</div>';
  }
  h += '</div>';
  // 已选平台：显示最低粉丝数输入
  for(var j=0;j<taskPlatformReqs.length;j++){
    var req=taskPlatformReqs[j];
    var pInfo=PLATFORM_REGISTRY.find(function(p){return p.id===req.platformId})||{icon:'🔗',name:req.platformId};
    h += '<div style="display:flex;align-items:center;gap:8px;padding:8px;background:#f9fafb;border-radius:8px;margin-bottom:6px">';
    h += '<span style="font-size:15px">'+pInfo.icon+'</span><span style="font-weight:500;font-size:12px;min-width:64px">'+pInfo.name+'</span>';
    h += '<span style="font-size:11px;color:var(--muted)">最低粉丝数</span>';
    h += '<input type="number" value="'+(req.minFollowers||'')+'" min="0" placeholder="不限" style="width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px" onchange="updatePlatformReqFollowers(\''+req.platformId+'\',this.value)">';
    h += '<label style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-left:auto"><input type="checkbox"'+(req.required?' checked':'')+' onchange="updatePlatformReqRequired(\''+req.platformId+'\',this.checked)"> 必须</label>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function togglePlatformReq(platformId){
  var idx = taskPlatformReqs.findIndex(function(r){return r.platformId===platformId});
  if(idx>=0){ taskPlatformReqs.splice(idx,1); }
  else { taskPlatformReqs.push({platformId:platformId,minFollowers:null,required:true}); }
  var reqSection = document.querySelector('[data-plat-reqs]');
  if(!reqSection) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = platformReqsFormHTML(null);
  var newEl = tmp.firstElementChild;
  if(newEl) reqSection.replaceWith(newEl);
}

function updatePlatformReqFollowers(platformId, val){
  var req = taskPlatformReqs.find(function(r){return r.platformId===platformId});
  if(req) req.minFollowers = val ? parseInt(val,10) : null;
}

function updatePlatformReqRequired(platformId, checked){
  var req = taskPlatformReqs.find(function(r){return r.platformId===platformId});
  if(req) req.required = checked;
}

var brandBalance = null;
var walletLedger = null;
var walletPeriod = 'month';
var topupHistory = [];
var topupStep = 1;
var topupAmount = 0;
var topupMethod = 'bank';
var topupRef = null;

var WALLET_PERIOD_LABELS = {month:'本月', last_month:'上月', '7d':'最近7天', '30d':'最近30天', all:'全部'};

function walletPeriodRange(period) {
  var now = new Date();
  var from, to = now;
  if (period === 'last_month') {
    from = new Date(now.getFullYear(), now.getMonth()-1, 1);
    to = new Date(now.getFullYear(), now.getMonth(), 1);
  } else if (period === '7d') {
    from = new Date(now.getTime() - 7*86400000);
  } else if (period === '30d') {
    from = new Date(now.getTime() - 30*86400000);
  } else if (period === 'all') {
    from = new Date('1970-01-01');
  } else { // month
    from = new Date(now.getFullYear(), now.getMonth(), 1);
  }
  return { from: from.toISOString(), to: to.toISOString() };
}

function setWalletPeriod(p) {
  if (walletPeriod === p) return;
  walletPeriod = p;
  brandBalance = null;
  walletLedger = null;
  render();
}

function loadBrandWallet() {
  var r = walletPeriodRange(walletPeriod);
  var qs = '?from='+encodeURIComponent(r.from)+'&to='+encodeURIComponent(r.to);
  api('GET', '/wallet/brand-balance'+qs, null, function(d) { brandBalance = d; render(); });
  api('GET', '/wallet/transactions'+qs+'&walletType=brand&limit=50', null, function(d) { walletLedger = d; render(); });
  api('GET', '/wallet/topup-history', null, function(d) { topupHistory = d || []; render(); });
}

function genTopupRef() {
  var d = new Date();
  var dt = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  return 'HERIX-'+dt+'-'+String(Math.floor(Math.random()*9000)+1000);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(function() {
    var t = document.createElement('div');
    t.textContent = '已复制';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:9999;pointer-events:none';
    document.body.appendChild(t);
    setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);}, 1500);
  });
}

function walletPage() {
  if (!brandBalance) { loadBrandWallet(); return '<div style="padding:80px;text-align:center;color:var(--muted)">加载中...</div>'; }
  var b = brandBalance;
  var cur = b.currency || 'JPY';
  var h = '';

  // 余额汇总：可用 / 冻结 / 本期流入 / 本期流出
  h += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px">';
  h += wStatCard('可用余额', '¥'+(b.available||0).toLocaleString()+' '+cur, '#16a34a', '发布任务前需保证充足');
  h += wStatCard('冻结中', '¥'+(b.frozen||0).toLocaleString()+' '+cur, '#f59e0b', '进行中任务已锁定');
  h += wStatCard(WALLET_PERIOD_LABELS[walletPeriod]+'流入', '+¥'+(b.periodInflow||0).toLocaleString(), '#16a34a', '充值到账');
  h += wStatCard(WALLET_PERIOD_LABELS[walletPeriod]+'流出', '-¥'+(b.periodOutflow||0).toLocaleString(), '#dc2626', '任务结算支出');
  h += '</div>';

  // 充值向导卡片
  h += '<div class="card" style="margin-bottom:20px;padding:32px">';
  h += topupWizardHTML();
  h += '</div>';

  // 充值申请 + 钱包流水（第4步成功后不展示，避免分散）
  if (topupStep !== 4) { h += pendingTopupHTML(); h += walletLedgerHTML(); }

  return h;
}

function wStatCard(label, value, color, sub) {
  return '<div class="card" style="padding:20px">'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+label+'</div>'
    +'<div style="font-size:24px;font-weight:700;color:'+color+';margin-bottom:4px">'+value+'</div>'
    +'<div style="font-size:11px;color:var(--muted)">'+sub+'</div>'
    +'</div>';
}

function topupWizardHTML() {
  var steps = ['选择金额','支付方式','付款详情','完成'];
  var h = '';

  // 步骤指示器
  h += '<div style="display:flex;align-items:center;justify-content:center;margin-bottom:32px">';
  for (var i = 0; i < steps.length; i++) {
    var active = (i+1) === topupStep;
    var done   = (i+1) < topupStep;
    var dotBg  = done ? '#16a34a' : active ? 'var(--primary)' : '#e5e7eb';
    var txtClr = active ? 'var(--primary)' : done ? '#16a34a' : '#9ca3af';
    h += '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-width:56px">';
    h += '<div style="width:30px;height:30px;border-radius:50%;background:'+dotBg+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:all .2s">'+(done?'✓':(i+1))+'</div>';
    h += '<div style="font-size:11px;color:'+txtClr+';font-weight:'+(active?'600':'400')+';white-space:nowrap">'+steps[i]+'</div>';
    h += '</div>';
    if (i < steps.length-1) h += '<div style="flex:1;height:2px;background:'+(i+1<topupStep?'#16a34a':'#e5e7eb')+';margin:0 4px;margin-bottom:22px"></div>';
  }
  h += '</div>';

  switch(topupStep) {
    case 1: h += topupStep1(); break;
    case 2: h += topupStep2(); break;
    case 3: h += topupStep3(); break;
    case 4: h += topupStep4(); break;
  }
  return h;
}

/* Step 1 — 选择金额 */
function topupStep1() {
  var presets = [1000, 3000, 5000, 10000, 30000, 50000];
  var ok = topupAmount >= 1000;
  var h = '<div style="max-width:420px;margin:0 auto">';
  h += '<div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:16px">充值金额（日元）</div>';

  // 顶部金额：可直接编辑
  h += '<div style="text-align:center;margin-bottom:6px">';
  h += '<div style="display:inline-flex;align-items:center;gap:6px;border-bottom:2px solid var(--primary);padding:0 4px 8px">';
  h += '<span style="font-size:32px;font-weight:700;color:#111">¥</span>';
  h += '<input type="number" inputmode="numeric" id="topup-amount-input" placeholder="0" value="'+(topupAmount>0?topupAmount:'')+'" oninput="onTopupAmountInput(this)" style="font-size:40px;font-weight:800;color:#111;border:none;outline:none;width:200px;background:transparent;padding:0">';
  h += '</div></div>';

  h += '<div style="text-align:center;margin-bottom:24px">';
  h += '<span onclick="topupAmount=0;render()" style="font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline">清空</span>';
  h += '</div>';

  // 点击累加金额
  h += '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">点击下方金额可累加</div>';
  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px">';
  presets.forEach(function(p) {
    h += '<div onclick="topupAmount=(topupAmount||0)+'+p+';render()" style="padding:14px 8px;border-radius:10px;cursor:pointer;text-align:center;font-weight:600;font-size:15px;border:2px solid #e5e7eb;background:#fff;color:#374151;transition:all .15s">';
    h += '+¥'+p.toLocaleString();
    h += '</div>';
  });
  h += '</div>';

  h += '<div style="text-align:center">';
  h += '<button id="topup-next-btn" class="btn btn-primary" style="min-width:160px;padding:12px 24px;font-size:15px" onclick="onTopupNext()" '+(ok?'':'disabled')+'>下一步 →</button>';
  h += '<div id="topup-min-hint" style="font-size:12px;color:var(--muted);margin-top:8px'+(ok?';display:none':'')+'">最低充值金额 ¥1,000</div>';
  h += '</div></div>';
  return h;
}

// 编辑金额：仅更新变量和按钮状态，不触发整页 render（避免输入框失焦）
function onTopupAmountInput(el) {
  var v = parseFloat(el.value);
  topupAmount = (isNaN(v) || v < 0) ? 0 : v;
  var ok = topupAmount >= 1000;
  var btn = document.getElementById('topup-next-btn');
  var hint = document.getElementById('topup-min-hint');
  if (btn) btn.disabled = !ok;
  if (hint) hint.style.display = ok ? 'none' : '';
}

function onTopupNext() {
  if (topupAmount >= 1000) { topupStep = 2; render(); }
}

/* Step 2 — 支付方式 */
function topupStep2() {
  var h = '<div style="max-width:400px;margin:0 auto">';
  h += '<div style="text-align:center;margin-bottom:20px">';
  h += '<div style="font-size:13px;color:var(--muted)">充值金额</div>';
  h += '<div style="font-size:28px;font-weight:800;color:#111">¥'+topupAmount.toLocaleString()+'</div>';

function uploadBrandAsset(type, input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var msgEl = document.getElementById('assetUploadMsg');
  if (msgEl) msgEl.textContent = '上传中...';
  var fd = new FormData();
  fd.append('file', file);
  var xhr = new XMLHttpRequest();
  xhr.open('POST', API+'/uploads/brand/'+type, true);
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() {
    var d; try { d = JSON.parse(xhr.responseText); } catch(e) { d = {}; }
    if (d.error) { if (msgEl) msgEl.textContent = d.error; return; }
    state.brandProfile = state.brandProfile || {};
    if (type === 'logo') state.brandProfile.logo_url = d.url;
    else state.brandProfile.promo_image_url = d.url;
    if (msgEl) msgEl.textContent = '上传成功';
    render();
  };
  xhr.onerror = function() { if (msgEl) msgEl.textContent = '上传失败'; };
  xhr.send(fd);
}

/* ── API ── */
function api(method, path, body, cb) { patch(method, path, body, cb); }
function get(path, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', API+path, true);
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({}); } };
  xhr.onerror = function() { cb({}); };
  xhr.send();
}
function post(path, body, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open('POST', API+path, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({}); } };
  xhr.onerror = function() { cb({}); };
  xhr.send(JSON.stringify(body));
}
function patch(method, path, body, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, API+path, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({}); } };
  xhr.onerror = function() { cb({}); };
  xhr.send(JSON.stringify(body));
}

function nav(page) {
  state.page = page;

  if (page === 'dashboard') loadDashStats();
  if (page === 'tasks') { state.taskFilter = ''; loadMyTasks(); }
  if (page === 'reviews') loadPendingReviews();
  if (page === 'wallet') { brandBalance = null; loadBrandWallet(); }

function loadDashStats() {
  get('/tasks/my/stats', function(d) {
    state.dashStats = d;
    state.tasks = d.tasks || [];
    render();
  });
}

function loadMyTasks() {
  if (!state.user) return;
  get('/tasks/my/stats', function(d) {
    if (d && d.tasks) {
      state.dashStats = d;
      state.tasks = d.tasks;
    }
    state.tasksLoading = false;
    render();
  });
}

function loadPendingReviews() {
  state.reviewTab = state.reviewTab || 'apps';
  state.allPendingApps = [];
  state.allPendingSubs = [];
  get('/tasks?creator='+state.user.id+'&status=OPEN&limit=100', function(d) {
    var tasks = d.tasks || [];
    var remaining = tasks.length;
    if (!remaining) { render(); return; }
    tasks.forEach(function(t) {
      get('/tasks/'+t.id, function(detail) {
        (detail.applications||[]).forEach(function(a) {
          if (a.status==='PENDING') state.allPendingApps.push(Object.assign({}, a, {task_title:t.title, task_id:t.id}));
        });
        remaining--;
        if (!remaining) {
          // load subs
          var subTasks = tasks.slice(); var srem = subTasks.length;
          subTasks.forEach(function(st) {
            get('/submissions/task/'+st.id, function(subs) {
              (subs||[]).forEach(function(s) {
                if (s.status==='PENDING_REVIEW') state.allPendingSubs.push(Object.assign({}, s, {task_title:st.title}));
              });
              srem--;
              if (!srem) render();
            });
          });
        }
      });
    });
    render();
  });
}

function loadBrandProfile() {
  get('/auth/me', function(d) {
    state.brandProfile = d;
    render();
  });
}

      if (t.mode === 'PERFORMANCE') {
        // 加载已分配的推广码（赫使维度）
        get('/tasks/'+id+'/codes', function(pool) {
          state.taskCodes = codes || [];
          render();
        });
        // 加载码池概览（含未分配）
        get('/tasks/'+id+'/codes', function(pool) {
          state.codePool = pool;
          render();
        });
      } else {
        render();
      }
    });
  });
}

function switchTab(tab) { state.taskTab = tab; render(); }
function switchReviewTab(tab) { state.reviewTab = tab; render(); }

function editTask() {
  state.editingTask = state.currentTask;
  go('task_edit');
}

function editTaskMeta() {
  state.editingTask = state.currentTask;
  go('task_meta_edit');
}

function taskMetaEditPage() {
  var t = state.editingTask;
  if (!t) return '<div class="empty">未选择任务</div>';

  // 初始化平台要求
  if (t.platform_requirements && taskPlatformReqs.length === 0) {
    try { taskPlatformReqs = JSON.parse(t.platform_requirements); } catch(e) {}
  }

  var h = '<div class="form-card"><div class="form-grid">';
  h += '<div class="field form-full" style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400e">';
  h += '以下字段不可修改：<strong>报酬金额、任务类型、推广码方式</strong>（如需修改请关闭任务重新创建）</div>';

  h += '<div class="field form-full"><label>任务描述 *</label><textarea id="meta-description" rows="4">'+esc(t.description||'')+'</textarea></div>';
  h += '<div class="field form-full"><label>具体要求</label><textarea id="meta-requirements" rows="3">'+esc(t.requirements||'')+'</textarea></div>';
  h += '<div class="field"><label>截止日期</label><input id="meta-deadline" type="date" value="'+(t.deadline?t.deadline.slice(0,10):'')+'"></div>';
  h += '<div class="field"><label>招募名额（当前 '+t.max_heralds+' 人，只能增加）</label><input id="meta-maxHeralds" type="number" min="'+t.max_heralds+'" value="'+t.max_heralds+'"></div>';
  h += '<div class="field form-full"><label>封面图链接</label><input id="meta-coverImage" type="text" value="'+esc(t.cover_image||'')+'" placeholder="https://...（选填）"></div>';
  h += platformReqsFormHTML(t);
  h += '<div class="form-actions">';
  h += '<button class="btn btn-outline" onclick="go(\'task_detail\')">取消</button>';
  h += '<button class="btn btn-primary" onclick="saveTaskMeta()">保存</button>';
  h += '</div></div></div>';
  return h;
}

function saveTaskMeta() {
  var t = state.editingTask;
  if (!t) return;
  var desc = (document.getElementById('meta-description')||{}).value || '';
  var req  = (document.getElementById('meta-requirements')||{}).value || '';
  var dl   = (document.getElementById('meta-deadline')||{}).value || '';
  var mh   = Number((document.getElementById('meta-maxHeralds')||{}).value || t.max_heralds);
  var ci   = (document.getElementById('meta-coverImage')||{}).value || '';
  if (!desc.trim()) { alert('描述不能为空'); return; }
  if (mh < t.max_heralds) { alert('名额不能减少'); return; }
  var body = {
    description: desc,
    requirements: req || undefined,
    deadline: dl || undefined,
    maxHeralds: mh,
    coverImage: ci || undefined,
    platformRequirements: taskPlatformReqs.length > 0 ? taskPlatformReqs : undefined,
  };
  patch('PATCH', '/tasks/'+t.id+'/meta', body, function(d) {
    if (d.error) { alert(d.error); return; }
    state.currentTask = Object.assign(state.currentTask, d);
    state.editingTask = null;
    taskPlatformReqs = [];
    showMsg('保存成功');
    go('task_detail');
    loadMyTasks();
  });
}

function saveTask(publish) {
  var body = {
    title: (document.getElementById('title')||{}).value,
    description: (document.getElementById('description')||{}).value,
    requirements: (document.getElementById('requirements')||{}).value,
    commission: Number((document.getElementById('commission')||{}).value),
    budget: Number((document.getElementById('commission')||{}).value) * Number((document.getElementById('maxHeralds')||{}).value||1),
    maxHeralds: Number((document.getElementById('maxHeralds')||{}).value||1),
    mode: (document.getElementById('mode')||{}).value,
    category: (document.getElementById('category')||{}).value,
    contentType: (document.getElementById('contentType')||{}).value,
    difficulty: (document.getElementById('difficulty')||{}).value,
    coverImage: (document.getElementById('coverImage')||{}).value || undefined,
    deadline: (document.getElementById('deadline')||{}).value || undefined,
    codeMode: document.getElementById('codeMode-custom')?.checked ? 'custom' : 'auto',
    platformRequirements: taskPlatformReqs.length > 0 ? taskPlatformReqs : undefined,
  };
  if (!body.title || !body.description || !body.commission) { alert('请填写标题、描述和报酬'); return; }

  var isEdit = state.page === 'task_edit' && state.editingTask;
  var method = isEdit ? 'PUT' : 'POST';
  var path = isEdit ? '/tasks/'+state.editingTask.id : '/tasks';

  patch(method, path, body, function(d) {
    if (d.error) {
      var msg = d.error;
      if (d.details && d.details.length) {
        msg += ':\n' + d.details.map(function(e){ return '  - ' + (e.path||[]).join('.') + ': ' + e.message; }).join('\n');
      }
      alert(msg); return;
    }
    // 问题1：创建/更新后刷新任务列表
    loadMyTasks();
    loadDashStats();

    if (publish && d.status === 'DRAFT') {
      // 问题2：直接发布前检查邀请码
      if (body.mode === 'PERFORMANCE') {
        doPublishWithCodeCheck(d.id);
      } else {
        patch('PATCH', '/tasks/'+d.id+'/publish', {}, function(p) {
          if (p.error) { alert(p.error); return; }
          state.msg = '任务已发布！'; state.msgType = 'success';
          loadMyTasks(); loadDashStats();
          openTask(d.id);
        });
      }
    } else {
      // 问题3：保存草稿后跳转到任务详情，提示需要发布
      state.msg = isEdit ? '任务已更新' : '草稿已保存，请检查推广码后点击「发布任务」使其生效';
      state.msgType = 'success';
      openTask(d.id);
    }
  });
}

function doPublishWithCodeCheck(id) {
  // 问题2+4：检查邀请码是否存在，并提示确认
  get('/tasks/'+id, function(t) {
    get('/tasks/'+id+'/codes', function(pool) {
      var codeCount = pool ? pool.total : 0;
      var isCustom = t.code_mode === 'custom';

      if (codeCount === 0) {
        if (isCustom) {
          alert('请先上传推广码后再发布任务。\n\n操作：任务详情 → 上传推广码 → 发布任务');
        } else {
          alert('推广码生成异常，请重新创建任务。');
        }
        openTask(id);
        return;
      }

      // 问题4：确认邀请码有效性
      var msg = '确认发布任务？\n\n'
        + '📋 任务共有 ' + codeCount + ' 个推广码\n'
        + (isCustom ? '⚠️ 请确认这些推广码已在 Remitly 等第三方系统中配置完成，发布后赫使将立即收到推广码。'
                    : '⚠️ 系统已自动生成推广码，请确认已下载 CSV 并上传到第三方系统，否则赫使拿到的码将无法使用。')
        + '\n\n推广码未配置到第三方系统将导致赫使推广无效。';

      if (!confirm(msg)) { openTask(id); return; }

      patch('PATCH', '/tasks/'+id+'/publish', {}, function(p) {
        if (p.error) { alert(p.error); return; }
        state.msg = '任务已发布！赫使现在可以看到并报名。'; state.msgType = 'success';
        loadMyTasks(); loadDashStats();
        openTask(id);
      });
    });
  });
}

function publishTask(id) {
  var t = state.currentTask;
  if (t && t.mode === 'PERFORMANCE') {
    doPublishWithCodeCheck(id);
  } else {
    if (!confirm('确认发布？发布后赫使即可看到并报名。')) return;
    patch('PATCH', '/tasks/'+id+'/publish', {}, function(d) {
      if (d.error) {
        if (d.code === 'INSUFFICIENT_BALANCE') {
          if (confirm('余额不足（需 ¥'+d.needed+'，可用 ¥'+(d.available||0).toFixed(0)+'）。\n前往充值？')) nav('wallet');
        } else { alert(d.error); }
        return;
      }
      state.msg = '任务已发布'; state.msgType = 'success';
      if (state.currentTask) state.currentTask.status = 'OPEN';
      loadMyTasks(); loadDashStats(); render();
    });
  }
}

function closeTask(id) {
  if (!confirm('确认关闭任务？关闭后赫使无法继续报名。')) return;
  patch('PATCH', '/tasks/'+id+'/complete', {}, function(d) {
    if (d.error) { alert(d.error); return; }
    state.msg = '任务已关闭'; state.msgType = 'success';
    loadMyTasks();
  });
}

function reviewApp(id, status, fromAll) {
  patch('PATCH', '/applications/'+id+'/review', {status:status}, function(d) {
    if (d.error) { alert(d.error); return; }
    if (fromAll) {
      state.allPendingApps = state.allPendingApps.filter(function(a){return a.id!==id});
      render();
    } else {
      openTask(state.currentTask.id);
      loadMyTasks();
      loadDashStats();
    }
  });
}

function reviewSub(id, status, fromAll) {
  patch('PATCH', '/submissions/'+id+'/review', {status:status}, function(d) {
    if (d.error) { alert(d.error); return; }
    if (d.needsRating) { showRatingModal(id, fromAll); return; }
    if (fromAll) {
      state.allPendingSubs = state.allPendingSubs.filter(function(s){return s.id!==id});
      render();
    } else {
      openTask(state.currentTask.id);
      loadMyTasks();
      loadDashStats();
    }
  });
}

function showRatingModal(submissionId, fromAll) {
  var selected = 0;
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9000;display:flex;align-items:center;justify-content:center';
  overlay.innerHTML = '<div style="background:#fff;border-radius:16px;padding:28px;width:320px;max-width:90vw">'
    +'<div style="font-size:16px;font-weight:700;margin-bottom:6px;text-align:center">为这次合作打分</div>'
    +'<div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:18px">帮助其他品牌了解赫使质量（可选）</div>'
    +'<div id="stars" style="display:flex;justify-content:center;gap:8px;font-size:32px;margin-bottom:16px;cursor:pointer">'
    +'<span data-v="1">☆</span><span data-v="2">☆</span><span data-v="3">☆</span><span data-v="4">☆</span><span data-v="5">☆</span>'
    +'</div>'
    +'<textarea id="rate-comment" placeholder="写点评语（可选）" style="width:100%;height:64px;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;resize:none;box-sizing:border-box;margin-bottom:14px"></textarea>'
    +'<div style="display:flex;gap:8px">'
    +'<button id="skip-rate" class="btn btn-outline" style="flex:1">跳过</button>'
    +'<button id="submit-rate" class="btn btn-primary" style="flex:1" disabled>提交评分</button>'
    +'</div></div>';

  document.body.appendChild(overlay);

  var stars = overlay.querySelectorAll('#stars span');
  function setStars(v) {
    selected = v;
    stars.forEach(function(s){ s.textContent = Number(s.dataset.v) <= v ? '★' : '☆'; });
    overlay.querySelector('#submit-rate').disabled = false;
  }
  stars.forEach(function(s){ s.addEventListener('click', function(){ setStars(Number(s.dataset.v)); }); });

  function close() {
    document.body.removeChild(overlay);
    if (fromAll) {
      state.allPendingSubs = state.allPendingSubs.filter(function(s){return s.id!==submissionId});
      render();
    } else {
      openTask(state.currentTask.id);
      loadMyTasks();
      loadDashStats();
    }
  }

  overlay.querySelector('#skip-rate').addEventListener('click', close);
  overlay.querySelector('#submit-rate').addEventListener('click', function() {
    var comment = overlay.querySelector('#rate-comment').value.trim();
    patch('POST', '/submissions/'+submissionId+'/rate', {score:selected, comment:comment||undefined}, function(d) {
      if (d.error) { alert(d.error); return; }
      close();
    });
  });
}

function reviewSubReject(id, fromAll) {
  var reason = prompt('拒绝原因（可选）');
  if (reason === null) return;
  patch('PATCH', '/submissions/'+id+'/review', {status:'REJECTED', reviewNote:reason}, function(d) {
    if (d.error) { alert(d.error); return; }
    if (fromAll) {
      state.allPendingSubs = state.allPendingSubs.filter(function(s){return s.id!==id});
      render();
    } else {
      openTask(state.currentTask.id);
      loadMyTasks();
      loadDashStats();
    }
  });
}

function doCsvUpload() {
  var taskId = (document.getElementById('csv-task')||{}).value;
  var raw = (document.getElementById('csv-data')||{}).value;
  var resultEl = document.getElementById('csv-result');
  if (!raw.trim()) { resultEl.innerHTML='<div class="alert alert-error">请粘贴数据或选择CSV文件</div>'; return; }

  var lines = raw.trim().split('\n').map(function(l){return l.trim()}).filter(Boolean);
  if (lines.length < 2) { resultEl.innerHTML='<div class="alert alert-error">数据至少需要2行（表头+数据）</div>'; return; }

  // 解析第一行表头
  var headers = lines[0].split(',').map(function(h){return h.trim().toLowerCase()});
  var codeIdx = headers.indexOf('code');
  var regIdx = headers.indexOf('注册数');
  var usedIdx = headers.indexOf('使用数');
  if (codeIdx === -1) { resultEl.innerHTML='<div class="alert alert-error">表头需要包含 "code" 列</div>'; return; }

  var records = [];
  for (var i = 1; i < lines.length; i++) {
    var cols = lines[i].split(',');
    var code = (cols[codeIdx]||'').trim();
    if (!code) continue;
    var regCount = regIdx >= 0 ? parseInt(cols[regIdx]||'0',10) : 0;
    var usedCount = usedIdx >= 0 ? parseInt(cols[usedIdx]||'0',10) : 0;
    records.push({ code: code, registered_count: isNaN(regCount)?0:regCount, used_count: isNaN(usedCount)?0:usedCount });
  }

  if (!records.length) { resultEl.innerHTML='<div class="alert alert-error">没有有效的推广码数据</div>'; return; }

  post('/tasks/' + taskId + '/csv', { records: records }, function(d) {
    if (d.error) { resultEl.innerHTML = '<div class="alert alert-error">'+esc(d.error)+'</div>'; return; }
    resultEl.innerHTML = '<div class="alert alert-success">处理完成：成功 '+d.processed+' 条，跳过 '+d.skipped+' 条，单价 ¥'+d.commissionPerUser+'/人</div>';
  });
}

function loadCsvFile(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('csv-data').value = e.target.result;
  };
  reader.readAsText(file);
}

function downloadCsvTemplate() {
  var csv = 'code,注册数,使用数\nHERIX-EXAMPLE1,0,0\nHERIX-EXAMPLE2,0,0';
  var blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'herix_conversion_template.csv';
  a.click();
}

function saveSettings() {
  var body = {
    companyName: (document.getElementById('company_name')||{}).value,
    industry: (document.getElementById('industry')||{}).value,
    website: (document.getElementById('website')||{}).value,
    contactName: (document.getElementById('contact_name')||{}).value,
    contactPhone: (document.getElementById('contact_phone')||{}).value,
    companyDesc: (document.getElementById('company_desc')||{}).value,
    billingEmail: (document.getElementById('billing_email')||{}).value,
  };
  patch('PATCH', '/users/profile/brand', body, function(d) {
    if (d.error) { alert(d.error); return; }
    state.brandProfile = d;
    state.msg = '设置已保存'; state.msgType = 'success';
    render();
  });

function logout() {
  state.token = null; state.user = null; state.tasks = [];
  render();
}

function switchAccount() {
  post('/auth/switch-account', {}, function(d) {
    if (d.error) { alert(d.error); return; }
    var roles = d.user.roles || [d.user.role];
    sessionStorage.setItem('herix_switch_token', d.token);
    window.location.href = roles.includes('BRAND') ? 'merchant.html' : 'preview.html';
  });
}

function tryResumeSwitchedSession() {
  var token = sessionStorage.getItem('herix_switch_token');
  if (!token) return false;
  sessionStorage.removeItem('herix_switch_token');
  state.token = token;
  get('/auth/me', function(d) {
    if (d.error || !d.id) { state.token = null; render(); return; }
    var roles = d.roles || [d.role];
    if (!roles.includes('BRAND')) {
      // 切到的账号没有品牌身份，跳转到赫使端
      sessionStorage.setItem('herix_switch_token', state.token);
      window.location.href = 'preview.html';
      return;
    }
    state.user = {
      id: d.id, nickname: d.nickname, role: d.role, roles: roles,
      isVerified: !!d.is_verified, is_onboarded: !!d.brand_onboarded,
    };
    state.brandProfile = d;
    loadDashStats(); loadMyTasks();
  });
  return true;
}

function toggleSidebar() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('overlay');
  if (sb) sb.classList.toggle('open');
  if (ov) ov.classList.toggle('show');
}
function closeSidebar() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('overlay');
  if (sb) sb.classList.remove('open');
  if (ov) ov.classList.remove('show');
}

function bindNav() {}
function bindPage() {
  if (state.page === 'task_create' || state.page === 'task_edit') {
    setTimeout(toggleCodeModeSection, 0);
  }
  // 任务列表行点击（事件代理）
  var table = document.getElementById('tasks-table');
  if (table) {
    table.addEventListener('click', function(e) {
      var tr = e.target.closest('tr[data-task-id]');
      if (tr) openTask(tr.getAttribute('data-task-id'));
    });
  }
}

// Init
if (!tryResumeSwitchedSession()) loadDashStats();
