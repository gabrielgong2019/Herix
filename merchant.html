<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herix 商户后台</title>
<style>
:root {
  --primary: #D43B27; --sidebar: #111827; --sidebar-text: #9ca3af;
  --sidebar-active: #fff; --bg: #f5f5f7; --card: #fff;
  --text: #111; --muted: #6b7280; --border: #e5e7eb;
  --success: #16a34a; --warning: #d97706; --danger: #dc2626;
  --sidebar-w: 220px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif; background:var(--bg); color:var(--text); font-size:14px; }

/* ── Layout ── */
.layout { display:flex; min-height:100vh; }
.sidebar {
  width:var(--sidebar-w); background:var(--sidebar); color:var(--sidebar-text);
  display:flex; flex-direction:column; position:fixed; top:0; left:0; height:100vh; z-index:100;
  transition: transform .25s;
}
.main { margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; min-height:100vh; }
.topbar {
  background:#fff; border-bottom:1px solid var(--border);
  padding:0 28px; height:60px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:50;
}
.content { padding:28px; flex:1; }

/* ── Sidebar ── */
.sb-logo { padding:20px 20px 8px; font-size:16px; font-weight:800; color:#fff; letter-spacing:1px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:8px; }
.sb-logo span { color:var(--primary); }
.sb-section { padding:8px 12px 4px; font-size:10px; letter-spacing:1.5px; color:rgba(255,255,255,.3); text-transform:uppercase; }
.sb-item {
  display:flex; align-items:center; gap:10px; padding:10px 16px; margin:2px 8px;
  border-radius:8px; cursor:pointer; font-size:13px; color:var(--sidebar-text);
  transition: all .15s;
}
.sb-item:hover { background:rgba(255,255,255,.07); color:#fff; }
.sb-item.active { background:var(--primary); color:#fff; }
.sb-item .icon { font-size:16px; width:20px; text-align:center; }
.sb-badge { background:#ef4444; color:#fff; font-size:10px; padding:1px 6px; border-radius:10px; margin-left:auto; }
.sb-icon { font-size:15px; width:20px; text-align:center; }
.sb-bottom { margin-top:auto; padding:16px; border-top:1px solid rgba(255,255,255,.08); }
.sb-user { font-size:12px; color:rgba(255,255,255,.5); margin-bottom:8px; }
.sb-logout { font-size:12px; color:rgba(255,255,255,.4); cursor:pointer; }
.sb-logout:hover { color:#fff; }

/* ── Topbar ── */
.page-title { font-size:18px; font-weight:700; }
.topbar-right { display:flex; align-items:center; gap:12px; }
.btn { padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; border:none; cursor:pointer; transition:all .15s; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:#005bb5; }
.btn-outline { background:#fff; color:var(--text); border:1px solid var(--border); }
.btn-outline:hover { border-color:#999; }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-success { background:var(--success); color:#fff; }

/* ── Cards & Stats ── */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
.stat-card { background:#fff; border-radius:12px; padding:20px; }
.stat-val { font-size:28px; font-weight:700; margin-bottom:4px; }
.stat-lbl { font-size:12px; color:var(--muted); }

/* ── Table ── */
.table-card { background:#fff; border-radius:12px; overflow:hidden; }
.table-head { padding:16px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
.table-title { font-size:15px; font-weight:600; }
table { width:100%; border-collapse:collapse; }
th { padding:10px 20px; text-align:left; font-size:12px; color:var(--muted); font-weight:500; border-bottom:1px solid var(--border); background:#fafafa; }
td { padding:12px 20px; border-bottom:1px solid var(--border); font-size:13px; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#f9fafb; cursor:pointer; }
.tag { display:inline-flex; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.tag-open { background:#dcfce7; color:#16a34a; }
.tag-draft { background:#fef3c7; color:#d97706; }
.tag-completed { background:#e0e7ff; color:#4338ca; }
.tag-cancelled { background:#fee2e2; color:#dc2626; }
.tag-pending { background:#fef3c7; color:#d97706; }
.tag-approved { background:#dcfce7; color:#16a34a; }
.tag-rejected { background:#fee2e2; color:#dc2626; }

/* ── Form ── */
.form-card { background:#fff; border-radius:12px; padding:24px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-full { grid-column:1/-1; }
.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size:12px; font-weight:600; color:var(--muted); }
.field input, .field textarea, .field select {
  padding:10px 12px; border:1px solid var(--border); border-radius:8px;
  font-size:13px; color:var(--text); background:#fff; outline:none;
  transition: border-color .15s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color:var(--primary); }
.field textarea { resize:vertical; min-height:80px; }
.form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding-top:20px; border-top:1px solid var(--border); }
.field-hint { font-size:11px; color:var(--muted); margin-top:2px; }

/* ── Detail panels ── */
.detail-grid { display:grid; grid-template-columns:1fr 320px; gap:20px; align-items:start; }
.panel { background:#fff; border-radius:12px; padding:20px; margin-bottom:16px; }
.panel-title { font-size:14px; font-weight:600; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
.info-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.info-row:last-child { border-bottom:none; }
.info-key { color:var(--muted); }
.applicant-card { padding:16px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; background:var(--card); transition:box-shadow .15s; }
.applicant-card:hover { box-shadow:0 2px 10px rgba(0,0,0,.07); }
.applicant-card:last-child { margin-bottom:0; }
.applicant-hdr { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.av { width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
.sub-card { border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:10px; background:var(--card); transition:box-shadow .15s; }
.sub-card:hover { box-shadow:0 2px 10px rgba(0,0,0,.07); }
.sub-card:last-child { margin-bottom:0; }

/* ── Tabs ── */
.tabs { display:flex; gap:4px; background:#f3f4f6; border-radius:10px; padding:4px; margin-bottom:20px; }
.tab { flex:1; text-align:center; padding:7px; border-radius:7px; font-size:13px; cursor:pointer; color:var(--muted); font-weight:500; }
.tab.active { background:#fff; color:var(--text); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.1); }

/* ── Login ── */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); }
.login-card { background:#fff; border-radius:16px; padding:40px; width:380px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
.login-logo { font-size:22px; font-weight:800; text-align:center; margin-bottom:4px; }
.login-logo span { color:var(--primary); }
.login-sub { text-align:center; font-size:12px; color:var(--muted); margin-bottom:28px; }
.field-lg input { padding:12px 14px; font-size:14px; }

/* ── Empty ── */
.empty { text-align:center; padding:60px 20px; color:var(--muted); }
.empty-icon { font-size:40px; margin-bottom:12px; }

/* ── Alert ── */
.alert { padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; }
.alert-error { background:#fee2e2; color:#991b1b; }
.alert-success { background:#dcfce7; color:#166534; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .sidebar { transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); }
  .main { margin-left:0; }
  .stats-grid { grid-template-columns:1fr 1fr; }
  .form-grid { grid-template-columns:1fr; }
  .detail-grid { grid-template-columns:1fr; }
  .hamburger { display:flex; }
}
.hamburger { display:none; align-items:center; justify-content:center; width:36px; height:36px; border:none; background:none; cursor:pointer; font-size:20px; }
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:90; }
.overlay.show { display:block; }
</style>
<script src="/shared/auth.js"></script>
<script src="/shared/sidebar.js"></script>
<script src="/shared/platforms.js"></script>
</head>
<body>

<div id="root"></div>

<script>
var API = '/api';
var state = {
  page: 'login', user: null, token: null,
  tasks: [], currentTask: null, taskTab: 'applicants',
  stats: {}, msg: null, msgType: 'success',
  editingTask: null, showActivate: false, tasksLoading: false, taskFilter: '',
};

/* ── Routing ── */
function go(page, data) {
  state.page = page;
  if (data) Object.assign(state, data);
  state.msg = null;
  // 进入任务表单时懒加载额度（不在 render 时触发，避免重渲清空输入）
  if (page === 'task_create' || page === 'task_edit') {
    if (!brandBalance) loadBrandWallet();
  }
  render();
}

function render() {
  var root = document.getElementById('root');
  if (!state.user) { root.innerHTML = loginPage(); bindLogin(); return; }
  if (state.showActivate) { root.innerHTML = activateBrandPage(); return; }
  root.innerHTML = layout(pageContent());
  bindNav();
  bindPage();
}

function layout(inner) {
  var sm = state.dashStats?.summary||{}; var pending = (sm.pendingApplicants||0)+(sm.pendingSubmissions||0);
  var nav = [
    { id:'dashboard', icon:'📊', label:'概览' },
    { id:'tasks', icon:'📋', label:'任务管理' },
    { id:'reviews', icon:'✅', label:'审核中心', badge: pending },
    { id:'wallet', icon:'💰', label:'钱包充值' },
    { id:'csv', icon:'📤', label:'数据上传' },
    { id:'settings', icon:'⚙️', label:'账户设置' },
  ];
  var sb = '<div class="sidebar" id="sidebar">';
  sb += '<div class="sb-logo"><div style="display:flex;align-items:center;gap:9px"><img src="/Logo/herix-icon-filled.png" style="width:30px;height:30px;border-radius:7px;flex-shrink:0"><div>Herix<div style="font-size:10px;color:rgba(255,255,255,.4);font-weight:400;margin-top:1px;letter-spacing:0">商户后台</div></div></div></div>';
  sb += Sidebar.navItems(nav, { activeId: state.page, onclick: "nav('%s')" });
  sb += '<div class="sb-bottom"><div class="sb-user">'+esc(state.user.nickname)+'<br><span style="font-size:10px">品牌商家</span></div>';
  var linked = state.brandProfile?.linkedAccount;
  if (linked) {
    var linkedRoleLabel = (linked.roles||[]).includes('HERALD') ? '赫使' : '商家';
    sb += '<div class="sb-logout" onclick="switchAccount()" style="margin-bottom:4px">🔁 切换到'+esc(linked.nickname)+'（'+linkedRoleLabel+'）</div>';
  }
  var userRoles = (state.user && state.user.roles) || [state.user && state.user.role];
  if (userRoles.includes('HERALD')) {
    sb += '<div class="sb-logout" onclick="switchToHerald()" style="margin-bottom:4px">⇄ 切换赫使模式</div>';
  }
  sb += '<div class="sb-logout" onclick="logout()">退出登录</div></div></div>';

  var main = '<div class="main"><div class="topbar">';
  main += '<div style="display:flex;align-items:center;gap:12px"><button class="hamburger" onclick="toggleSidebar()">☰</button>';
  main += '<div class="page-title" id="page-title">'+getPageTitle()+'</div></div>';
  main += '<div class="topbar-right" style="display:flex;align-items:center;gap:8px">'+notifBellHTML()+topbarActions()+'</div></div>';
  if (state.msg) main += '<div style="padding:0 28px;margin-top:16px"><div class="alert alert-'+state.msgType+'">'+esc(state.msg)+'</div></div>';
  main += '<div class="content">'+inner+'</div></div>';

  return '<div class="layout">'+sb+main+'</div><div class="overlay" id="overlay" onclick="toggleSidebar()"></div>';
}

function getPageTitle() {
  var m = {dashboard:'概览', tasks:'任务管理', reviews:'审核中心', wallet:'钱包充值', csv:'数据上传', settings:'账户设置', task_detail:'任务详情', task_create:'创建任务', task_edit:'编辑任务', task_meta_edit:'编辑任务'};
  return m[state.page] || '';
}

function topbarActions() {
  if (state.page === 'tasks') return '<button class="btn btn-primary btn-sm" onclick="go(\'task_create\')">+ 创建任务</button>';
  if (state.page === 'task_detail' && state.currentTask) {
    var t = state.currentTask;
    var btns = '<button class="btn btn-outline btn-sm" onclick="go(\'tasks\')">← 返回</button>';
    if (t.status === 'DRAFT') btns += ' <button class="btn btn-primary btn-sm" onclick="publishTask(\''+t.id+'\')">发布任务</button>';
    if (t.status === 'OPEN' || t.status === 'IN_PROGRESS') {
      btns += ' <button class="btn btn-outline btn-sm" onclick="editTaskMeta()">编辑</button>';
      if (t.status === 'OPEN') btns += ' <button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="closeTask(\''+t.id+'\')">关闭任务</button>';
    }
    return btns;
  }
  if (state.page === 'task_create' || state.page === 'task_edit' || state.page === 'task_meta_edit') return '<button class="btn btn-outline btn-sm" onclick="go(\'task_detail\')">取消</button>';
  return '';
}

function pageContent() {
  switch(state.page) {
    case 'dashboard':   return dashPage();
    case 'tasks':       return tasksPage();
    case 'task_detail': return taskDetailPage();
    case 'task_create': taskPlatformReqs=[]; taskReqMode='ALL'; taskReqMinCount=1; return taskFormPage(null);
    case 'task_edit':   taskPlatformReqs=[]; taskReqMode='ALL'; taskReqMinCount=1; return taskFormPage(state.editingTask);
    case 'task_meta_edit': taskPlatformReqs=[]; taskReqMode='ALL'; taskReqMinCount=1; return taskMetaEditPage();
    case 'reviews':     return reviewsPage();
    case 'wallet':      return walletPage();
    case 'csv':         return csvPage();
    case 'settings':    return settingsPage();
    default: return dashPage();
  }
}

/* ── Login ── */
function loginPage() {
  return '<div class="login-wrap"><div class="login-card">'
    +'<div class="login-logo"><img src="/Logo/herix-icon-filled.png" style="width:52px;height:52px;border-radius:13px;display:block;margin:0 auto 8px">Herix</div>'
    +'<div class="login-sub">品牌商家管理后台</div>'
    +Auth.loginForm({
      title: '',
      subtitle: '',
      emailId: 'email',
      passwordId: 'password',
      emailPlaceholder: 'brand@company.com',
      passwordPlaceholder: '密码',
      fieldClass: 'field field-lg',
      titleClass: '',
      subtitleClass: '',
      submitStyle: 'width:100%;padding:12px',
      submitBtnClass: '',
    })
    +'<div style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted)">还没有账号？<a href="herix.html" style="color:var(--primary)">前往注册</a></div>'
    +'</div></div>';
}

function bindLogin() {
  Auth.init({
    api: API + '/auth',
    onLogin: function(d) {
      var uRoles=d.user.roles||[d.user.role];
      if(!uRoles.includes('BRAND')){
        document.getElementById('auth-form-err').innerHTML='<div class="alert alert-error">此页面仅限商家用户</div>';
        return;
      }
      state.token=d.token;state.user=d.user;
      state.msg='登录成功';state.msgType='success';
      loadDashStats();loadMyTasks();loadBrandProfile();
      loadNotifications();
      setInterval(loadNotifications, 60000);  // 每分钟轮询一次
    },
    onError: function(msg) {
      var el=document.getElementById('auth-form-err');
      if(el)el.innerHTML='<div class="alert alert-error">'+esc(msg)+'</div>';
    }
  });
}

function activateBrandPage() {
  var step = state.activateStep || 1;
  var h = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc">';
  h += '<div style="background:#fff;border-radius:16px;padding:40px;width:440px;max-width:94vw;box-shadow:0 4px 24px rgba(0,0,0,.08)">';

  // 进度条
  h += '<div style="display:flex;gap:6px;margin-bottom:28px">';
  for (var i = 1; i <= 3; i++) h += '<div style="flex:1;height:3px;border-radius:2px;background:'+(i<=step?'var(--primary)':'#e2e8f0')+'"></div>';
  h += '</div>';

  if (step === 1) {
    var actCur = state.activateData?.currency;
    h += '<div style="font-size:20px;font-weight:700;margin-bottom:6px">开通品牌商家功能</div>';
    h += '<div style="font-size:13px;color:var(--muted);margin-bottom:24px">你好，'+esc(state.user.nickname)+'！填写品牌信息后即可发布任务、招募赫使。</div>';
    h += '<div class="field"><label>业务市场 *</label><div style="display:flex;gap:10px;margin-top:6px">';
    h += '<div class="btn btn-outline btn-sm" style="flex:1;border-color:var(--primary);color:var(--primary)">🇯🇵 日本市场（JPY）</div>';
    h += '</div><div style="font-size:12px;color:var(--muted);margin-top:6px">入驻后业务市场和结算币种不可更改，请谨慎选择</div></div>';
    h += '<div class="field" style="margin-top:12px"><label>公司 / 品牌名称 *</label><input id="act-company" placeholder="例：Herix" value="'+esc(state.activateData?.companyName||'')+'"></div>';
    h += '<div class="field" style="margin-top:12px"><label>所属行业</label><select id="act-industry">';
    ['金融服务','美妆','时尚','食品饮料','旅游','母婴','电商','其他'].forEach(function(i){h+='<option>'+i+'</option>'});
    h += '</select></div>';
    h += '<div class="field" style="margin-top:12px"><label>官网（选填）</label><input id="act-website" placeholder="https://..." value="'+esc(state.activateData?.website||'')+'"></div>';
    h += '<div style="display:flex;gap:10px;margin-top:24px">';
    h += '<button class="btn btn-outline" style="flex:1" onclick="cancelActivate()">取消</button>';
    h += '<button class="btn btn-primary" style="flex:1" onclick="activateStep2()">下一步</button>';
    h += '</div>';
  } else if (step === 2) {
    h += '<div style="font-size:20px;font-weight:700;margin-bottom:6px">联系方式</div>';
    h += '<div style="font-size:13px;color:var(--muted);margin-bottom:24px">平台将通过此方式与你确认合作细节。</div>';
    h += '<div class="field"><label>联系人姓名 *</label><input id="act-contact" placeholder="你的姓名" value="'+esc(state.activateData?.contactName||'')+'"></div>';
    h += '<div class="field" style="margin-top:12px"><label>联系电话（选填）</label><input id="act-phone" placeholder="+81 ..." value="'+esc(state.activateData?.contactPhone||'')+'"></div>';
    h += '<div style="display:flex;gap:10px;margin-top:24px">';
    h += '<button class="btn btn-outline" style="flex:1" onclick="state.activateStep=1;render()">返回</button>';
    h += '<button class="btn btn-primary" style="flex:1" onclick="activateStep3()">下一步</button>';
    h += '</div>';
  } else {
    h += '<div style="font-size:20px;font-weight:700;margin-bottom:6px">服务协议</div>';
    h += '<div style="font-size:13px;color:var(--muted);margin-bottom:16px">请仔细阅读以下协议，确认后完成入驻。</div>';

    h += '<div style="height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:16px;font-size:12px;line-height:1.9;color:#374151;background:#fafafa;margin-bottom:16px">';
    h += '<p style="font-weight:700;font-size:13px;margin-bottom:10px">Herix 品牌商家服务协议（版本 2026-07-09-v1）</p>';
    h += '<p style="font-weight:600;margin-bottom:4px">一、服务内容</p>';
    h += '<p style="margin-bottom:10px">Herix（以下简称"平台"）由 HUAXUE 合同会社运营，提供海外华人赫使（KOL/大使）招募、任务发布及报酬结算服务。品牌商家（以下简称"您"）通过平台发布任务，招募赫使完成推广或体验工作。</p>';
    h += '<p style="font-weight:600;margin-bottom:4px">二、资金与结算</p>';
    h += '<p style="margin-bottom:10px">1. 发布任务前须预充足额资金至平台账户，任务发布时等额锁定为保证金。<br>2. 赫使完成任务并经审核通过后，平台将自动结算报酬，不可撤销。<br>3. 平台就每笔结算收取 <strong>15%</strong> 服务费（含支付处理费）。<br>4. 未使用的锁定资金可在任务关闭后申请退回，到账时间为 3 个工作日内。</p>';
    h += '<p style="font-weight:600;margin-bottom:4px">三、您的义务</p>';

function activateStep2() {
  var company = (document.getElementById('act-company')||{}).value||'';
  if (!company.trim()) { alert('请填写品牌名称'); return; }
  state.activateData = Object.assign({}, state.activateData, {
    currency: 'JPY',
    companyName: company.trim(),
    industry: (document.getElementById('act-industry')||{}).value||'',
    website: (document.getElementById('act-website')||{}).value||'',
  });
  state.activateStep = 2;
  render();
}

function activateStep3() {
  var contact = (document.getElementById('act-contact')||{}).value||'';
  if (!contact.trim()) { alert('请填写联系人姓名'); return; }
  state.activateData = Object.assign({}, state.activateData, {
    contactName: contact.trim(),
    contactPhone: (document.getElementById('act-phone')||{}).value||'',
  });
  state.activateStep = 3;
  render();
}

function doActivateBrand() {
  var checked = (document.getElementById('agree-checkbox')||{}).checked;
  var errEl = document.getElementById('act-err');
  if (!checked) {
    if (errEl) errEl.innerHTML = '<div class="alert alert-error">请先勾选同意服务协议</div>';
    return;
  }
  var data = Object.assign({}, state.activateData||{}, { agreedToTerms: true });

  // Step 1: 添加 BRAND 角色
  patch('POST', '/users/add-role', { role: 'BRAND' }, function(d) {
    if (d.error && d.error.indexOf('已拥有') === -1) {
      if (errEl) errEl.innerHTML = '<div class="alert alert-error">'+esc(d.error)+'</div>';
      return;
    }
    if (d.token) state.token = d.token;

    // Step 2: 完成品牌入驻
    patch('POST', '/users/brand/onboard', data, function(d2) {
      if (d2.error) {
        if (errEl) errEl.innerHTML = '<div class="alert alert-error">'+esc(d2.error)+'</div>';
        return;
      }
      state.showActivate = false;
      state.activateStep = 1;
      state.activateData = null;
      state.page = 'dashboard';
      render();
      loadDashStats();
    });
  });
}

function cancelActivate() {
  state.showActivate = false;
  state.token = null;
  state.user = null;
  render();
}



/* ── Dashboard ── */
function dashPage() {
  var s = state.dashStats || {};
  var sm = s.summary || {};
  var tasks = s.tasks || [];
  var pending = (sm.pendingApplicants||0) + (sm.pendingSubmissions||0);

  var html = '';

  // 核心指标 — 第一行
  html += '<div class="stats-grid">'
    + statCard('累计支出', '¥'+Number(sm.totalSpend||0).toLocaleString(), '#D43B27', '💰')
    + statCard('已完成任务', sm.totalCompleted||0, '#16a34a', '✅', '件')
    + statCard('在线任务', sm.openTasks||0, '#7c3aed', '📋', '个')
    + statCard('待处理', pending, pending>0?'#dc2626':'#16a34a', '⚠️', '项')
    + '</div>';

  // 第二行
  html += '<div class="stats-grid" style="margin-top:-8px">'
    + statCard('总报名人次', sm.totalApplicants||0, '#0891b2', '👤', '人')
    + statCard('待审报名', sm.pendingApplicants||0, '#d97706', '⏳', '条')
    + statCard('待审内容', sm.pendingSubmissions||0, '#d97706', '📄', '条')
    + statCard('推广码转化', sm.qualifiedReferrals||0, '#D43B27', '🔗', '单')
    + '</div>';

  // 待处理提醒
  if (pending > 0) {
    html += '<div style="background:#fffbeb;border:1px solid #fbbf24;border-radius:12px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between">'
      + '<div style="font-size:13px;color:#92400e">⚠️ 有 <strong>'+pending+'</strong> 条事项待处理'
      + (sm.pendingApplicants?' · '+sm.pendingApplicants+'条报名':'')
      + (sm.pendingSubmissions?' · '+sm.pendingSubmissions+'条内容审核':'')
      +'</div><button class="btn btn-sm" style="background:#f59e0b;color:#fff" onclick="nav(\'reviews\')">去处理</button></div>';
  }

  // 任务绩效表
  if (tasks.length) {
    html += '<div class="table-card"><div class="table-head"><div class="table-title">任务绩效</div>'
      +'<button class="btn btn-outline btn-sm" onclick="nav(\'tasks\')">管理任务</button></div>'
      +'<table><thead><tr><th>任务名称</th><th>状态</th><th>报名</th><th>通过</th><th>提交</th><th>完成</th><th>转化率</th><th>支出</th></tr></thead><tbody>'
      + tasks.map(function(t) {
          var conversion = t.app_total > 0 ? Math.round((t.sub_approved/t.app_total)*100)+'%' : '-';
          var spent = (t.sub_approved||0) * (t.cost_per_herald||t.payout_per_herald||0);
          return '<tr onclick="openTask(\''+t.id+'\')" style="cursor:pointer">'
            +'<td><div style="font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</div>'
            +'<div style="font-size:11px;color:var(--muted);margin-top:1px">'+(t.mode==='PERFORMANCE'?'类A · 推广码':'类B · 内容')+'</div></td>'
            +'<td><span class="tag tag-'+t.status.toLowerCase()+'">'+statusLabel(t.status)+'</span></td>'
            +'<td>'+t.app_total+(t.app_pending?' <span style="color:var(--warning);font-size:11px">('+t.app_pending+'待)</span>':'')+'</td>'
            +'<td>'+t.app_approved+'</td>'
            +'<td>'+t.sub_total+(t.sub_pending?' <span style="color:var(--warning);font-size:11px">('+t.sub_pending+'待)</span>':'')+'</td>'
            +'<td style="font-weight:600;color:var(--success)">'+t.sub_approved+'</td>'
            +'<td style="color:var(--muted)">'+conversion+'</td>'
            +'<td>¥'+Number(spent).toLocaleString()+'</td>'
            +'</tr>';
        }).join('')
      +'</tbody></table></div>';
  } else {
    html += '<div class="table-card"><div class="empty"><div class="empty-icon">📋</div><div style="margin-bottom:14px">还没有任务</div>'
      +'<button class="btn btn-primary" onclick="go(\'task_create\')">+ 创建第一个任务</button></div></div>';
  }

  return html;
}

function statCard(label, val, color, icon, unit) {
  unit = unit || '';
  return '<div class="stat-card"><div style="display:flex;justify-content:space-between;align-items:flex-start">'
    +'<div><div class="stat-val" style="color:'+color+'">'+val+'<span style="font-size:13px;color:var(--muted);font-weight:400"> '+unit+'</span></div>'
    +'<div class="stat-lbl">'+label+'</div></div>'
    +'<div style="font-size:24px;opacity:.2">'+icon+'</div></div></div>';
}

  var creditBanner = creditStatusBanner();
  var filterBar = '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">';
  var statuses = [{v:'',l:'全部'},{v:'DRAFT',l:'草稿'},{v:'OPEN',l:'招募中'},{v:'COMPLETED',l:'已完成'},{v:'CANCELLED',l:'已取消'}];
  statuses.forEach(function(s){
    filterBar += '<button class="btn btn-sm '+(status===s.v?'btn-primary':'btn-outline')+'" onclick="state.taskFilter=\''+s.v+'\';render()">'+s.l+'</button>';

      +'</div></div>';
  }

  var rows = filtered.map(function(t) {
    var st = t.status || 'DRAFT';

    var fpBadge = t.fast_payout ? '<span style="display:inline-block;font-size:10px;font-weight:600;color:#0369a1;background:#e0f2fe;border-radius:4px;padding:1px 6px;margin-left:5px;vertical-align:middle">⚡ 极速打款</span>' : '';

      +'<td><div style="font-weight:500">'+esc(t.title)+fpBadge+'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:2px">'+catLabel(t.category)+'</div></td>'
      +'<td><span class="tag tag-'+st.toLowerCase()+'">'+statusLabel(st)+'</span></td>'
      +'<td><span style="font-size:12px">'+modeLabel(t.mode)+'</span></td>'
      +'<td>¥'+Number(t.payout_per_herald||0).toLocaleString()+'</td>'

      +'<td>'+created+'</td>'

    + '<div style="font-size:12px;word-break:break-all;font-family:monospace;color:var(--text);margin-bottom:8px" id="invite-link-text">'+taskShareUrl(t.id)+'</div>'
    + '<div style="display:flex;gap:8px;margin-bottom:12px">'
    + '<button class="btn btn-outline btn-sm" onclick="copyInviteLink(\''+t.id+'\')">复制链接</button>'
    + '<button class="btn btn-primary btn-sm" onclick="openSharePoster(\''+t.id+'\')">生成分享海报</button>'

function tierBadge(tierSnapshot) {
  if (!tierSnapshot) return '';
  try {
    var snap = typeof tierSnapshot === 'string' ? JSON.parse(tierSnapshot) : tierSnapshot;
    return Object.keys(snap).map(function(pid) {
      var p = platformById(pid);
      return '<span style="font-size:10px;background:#f0f4ff;color:#4f6ef7;border-radius:4px;padding:1px 6px;margin-right:3px">'
        + p.icon + ' ' + snap[pid] + '</span>';
    }).join('');
  } catch(e) { return ''; }
}

function ratingBadge(completedTasks, goodRate) {
  if (!completedTasks || completedTasks < 3) return '<span style="font-size:10px;color:var(--muted)">未评级</span>';
  var rate = Number(goodRate) || 0;
  var level = 'Bronze';
  if (completedTasks >= 50 && rate >= 0.95) level = 'Platinum';
  else if (completedTasks >= 25 && rate >= 0.85) level = 'Gold';
  else if (completedTasks >= 10 && rate >= 0.75) level = 'Silver';
  var colors = {Bronze:'#cd7f32',Silver:'#9ca3af',Gold:'#f59e0b',Platinum:'#7c3aed'};
  return '<span style="font-size:10px;font-weight:600;color:'+colors[level]+'">⭐ '+level+'</span>'
    + '<span style="font-size:10px;color:var(--muted);margin-left:4px">'+completedTasks+'单 好评'+Math.round(rate*100)+'%</span>';
}

function applicantsPanel(apps) {
  if (!apps.length) return '<div class="empty" style="padding:30px"><div class="empty-icon">👤</div>暂无报名</div>';
  return apps.map(function(a) {
    var color = a.status==='APPROVED'?'var(--success)':a.status==='REJECTED'?'var(--danger)':'var(--warning)';
    var country = a.country ? ' · '+esc(a.country) : '';
    var tiers = tierBadge(a.tier_snapshot);
    var rating = ratingBadge(a.completed_tasks, a.good_rate);
    return '<div class="applicant-card">'
      +'<div class="applicant-hdr"><div class="av">'+esc((a.nickname||'?')[0])+'</div>'
      +'<div><div style="font-weight:600;font-size:13px">'+esc(a.nickname)+'</div>'
      +'<div style="font-size:11px;color:var(--muted)">'+esc(a.display_name||'')+''+country+'</div></div>'
      +'<span style="margin-left:auto;font-size:12px;font-weight:600;color:'+color+'">'+appStatusLabel(a.status)+'</span></div>'
      +(tiers ? '<div style="margin-bottom:6px">'+tiers+'</div>' : '')
      +'<div style="margin-bottom:8px">'+rating+'</div>'
      +(a.message?'<div style="font-size:12px;color:#555;margin-bottom:8px;padding:8px;background:#f9fafb;border-radius:6px">'+esc(a.message)+'</div>':'')
      +(a.status==='PENDING'?'<div style="display:flex;gap:8px"><button class="btn btn-success btn-sm" onclick="reviewApp(\''+a.id+'\',\'APPROVED\')">✓ 通过</button><button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="reviewApp(\''+a.id+'\',\'REJECTED\')">✗ 拒绝</button></div>':'')
      +'</div>';
  }).join('');
}

function submissionsPanel(subs) {
  if (!subs.length) return '<div class="empty" style="padding:30px"><div class="empty-icon">📄</div>暂无提交</div>';
  return subs.map(function(s) {
    var color = s.status==='APPROVED'?'var(--success)':s.status==='REJECTED'?'var(--danger)':'var(--warning)';
    var screenshots = s.screenshot_urls ? JSON.parse(s.screenshot_urls||'[]') : [];
    return '<div class="sub-card">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:8px">'
      +'<div style="font-weight:600;font-size:13px">'+esc(s.herald_name||s.herald_id.slice(0,8))+'</div>'
      +'<span style="font-size:12px;font-weight:600;color:'+color+'">'+subStatusLabel(s.status)+'</span></div>'
      +(s.content_url?'<a href="'+esc(s.content_url)+'" target="_blank" style="font-size:12px;color:var(--primary);display:block;margin-bottom:6px;word-break:break-all">🔗 '+esc(s.content_url)+'</a>':'')
      +(s.description?'<div style="font-size:12px;color:#555;margin-bottom:8px">'+esc(s.description)+'</div>':'')
      +(screenshots.length?'<div style="font-size:12px;color:var(--muted);margin-bottom:8px">'+screenshots.length+' 张截图</div>':'')
      +'<div style="font-size:11px;color:var(--muted);margin-bottom:10px">提交于 '+s.submitted_at.slice(0,16).replace('T',' ')+'</div>'
      +(s.status==='PENDING_REVIEW'?'<div style="display:flex;gap:8px"><button class="btn btn-success btn-sm" onclick="reviewSub(\''+s.id+'\',\'APPROVED\')">✓ 通过</button><button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="reviewSubReject(\''+s.id+'\')">✗ 拒绝</button></div>':'')
      +(s.status==='APPROVED'&&s.rating_score?'<div style="font-size:12px;color:var(--muted);margin-top:6px">已评价 '+'★'.repeat(s.rating_score)+'☆'.repeat(5-s.rating_score)+(s.rating_comment?' · '+esc(s.rating_comment):'')+'</div>':'')
      +(s.status==='APPROVED'&&!s.rating_score?'<button class="btn btn-outline btn-sm" style="margin-top:6px" onclick="showRatingModal(\''+s.id+'\')">★ 评价赫使</button>':'')
      +(s.status==='REJECTED'&&s.review_note?'<div style="font-size:11px;color:var(--danger);margin-top:8px">拒绝原因：'+esc(s.review_note)+'</div>':'')
      +'</div>';
  }).join('');

function codesPanel(t) {
  var codes = state.taskCodes || [];

function toggleCodeMode() {
  var isCustom = document.getElementById('codeMode-custom')?.checked;
  var hint = document.getElementById('custom-code-hint');
  if (hint) hint.style.display = isCustom ? 'block' : 'none';
}

function toggleCodeModeSection() {
  var mode = document.getElementById('mode')?.value;
  var codeSection = document.getElementById('code-mode-section');
  var ctField = document.getElementById('contentType-field');
  if (codeSection) codeSection.style.display = (mode === 'PERFORMANCE') ? 'block' : 'none';
  // PERFORMANCE 任务不需要内容形式（赫使用推广码，不提交内容）
  if (ctField) ctField.style.display = (mode === 'PERFORMANCE') ? 'none' : 'block';
}

function uploadCustomCodes(taskId) {
  var raw = (document.getElementById('custom-codes-input') || {}).value || '';
  var codes = raw.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
  if (!codes.length) { alert('请输入至少一个推广码'); return; }
  var resultEl = document.getElementById('upload-result');
  patch('POST', '/tasks/' + taskId + '/codes/upload', { codes: codes }, function(d) {
    if (d.error) {
      if (resultEl) resultEl.innerHTML = '<div class="alert alert-error">'+esc(d.error)+'</div>';
      return;
    }
    if (resultEl) resultEl.innerHTML = '<div class="alert alert-success">已上传 '+d.added+' 个推广码'+(d.skipped?' （'+d.skipped+' 个重复跳过）':'')+'</div>';
    var input = document.getElementById('custom-codes-input');
    if (input) input.value = '';
    // 刷新码池
    get('/tasks/'+taskId+'/codes', function(pool) { state.codePool = pool; render(); });
  });
}

function downloadCodes(taskId) {
  var url = API + '/tasks/' + taskId + '/codes/export';
  fetch(url, { headers: { Authorization: 'Bearer ' + state.token } })
    .then(function(r) { return r.blob(); })
    .then(function(b) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'herix_promo_codes.csv';
      a.click();
    });
}

function attachAuthHeader(el, url) {
  // 因为浏览器 <a> 无法带 Authorization header，改用 fetch 下载
  event.preventDefault();
  fetch(url, {headers:{Authorization:'Bearer '+state.token}})
    .then(function(r){return r.blob()})
    .then(function(b){
      var a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='herix_codes.csv';
      a.click();
    });
}

    h += '<label style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="radio" name="req-mode"'+(taskReqMode==='ALL'?' checked':'')+' onchange="setReqMode(\'ALL\')"> 全部"必须"项都满足</label>';
    h += '<label style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="radio" name="req-mode"'+(taskReqMode==='ANY_N'?' checked':'')+' onchange="setReqMode(\'ANY_N\')"> 满足任意';
    h += ' <input type="number" value="'+taskReqMinCount+'" min="1" max="'+taskPlatformReqs.length+'"'+(taskReqMode!=='ANY_N'?' disabled':'')+' style="width:44px;padding:2px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px" onchange="setReqMinCount(this.value)"> 项即可</label>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function setReqMode(mode){
  taskReqMode = mode;
  if(mode === 'ANY_N' && taskReqMinCount > taskPlatformReqs.length) taskReqMinCount = taskPlatformReqs.length;
  rerenderPlatformReqs();
}

function setReqMinCount(val){
  var n = parseInt(val,10) || 1;
  taskReqMinCount = Math.min(Math.max(1, n), Math.max(1, taskPlatformReqs.length));
  rerenderPlatformReqs();
}

function rerenderPlatformReqs(){
  var reqSection = document.querySelector('[data-plat-reqs]');
  if(!reqSection) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = platformReqsFormHTML(null);
  var newEl = tmp.firstElementChild;
  if(newEl) reqSection.replaceWith(newEl);
}

function togglePlatformReq(platformId){
  var idx = taskPlatformReqs.findIndex(function(r){return r.platformId===platformId});
  if(idx>=0){ taskPlatformReqs.splice(idx,1); }
  else { taskPlatformReqs.push({platformId:platformId,minFollowers:null,required:true}); }
  var reqSection = document.querySelector('[data-plat-reqs]');
  if(!reqSection) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = platformReqsFormHTML(null);
  var newEl = tmp.firstElementChild;
  if(newEl) reqSection.replaceWith(newEl);
}

function updatePlatformReqFollowers(platformId, val){
  var req = taskPlatformReqs.find(function(r){return r.platformId===platformId});
  if(req) req.minFollowers = val ? parseInt(val,10) : null;
}

function updatePlatformReqRequired(platformId, checked){
  var req = taskPlatformReqs.find(function(r){return r.platformId===platformId});
  if(req) req.required = checked;
}

function submitReview(id, type, action) {
  var ta = document.getElementById('rv-note-' + id);

    if (ta) {
      ta.style.borderColor = '#dc2626';
      ta.rows = 3;
      ta.placeholder = '请填写原因，帮助赫使了解如何改进内容';
      ta.focus();
    }
    return;
  }
  if (type === 'app') reviewApp(id, action, true, note);
  else reviewSub(id, action, true, note);
}

function readNotif(id) {
  api('PATCH', '/notifications/'+id+'/read', {}, function(){
    if (notifData) {
      notifData.notifications.forEach(function(n){ if(n.id===id) n.is_read=1; });
      notifData.unread = Math.max(0, notifData.unread-1);
    }
    var bell = document.getElementById('notif-bell');
    if (bell) bell.outerHTML = notifBellHTML();
    var panel = document.getElementById('notif-panel');
    if (panel) { notifOpen=false; toggleNotifPanel(); }
  });
}

function markAllRead() {
  api('PATCH', '/notifications/read-all?role=BRAND', {}, function(){
    if (notifData) { notifData.notifications.forEach(function(n){n.is_read=1;}); notifData.unread=0; }
    var bell = document.getElementById('notif-bell');
    if (bell) bell.outerHTML = notifBellHTML();
    var panel = document.getElementById('notif-panel');
    if (panel) { notifOpen=false; toggleNotifPanel(); }
  });
}

function timeAgo(iso) {
  var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60)+'分钟前';
  if (diff < 86400) return Math.floor(diff/3600)+'小时前';
  return Math.floor(diff/86400)+'天前';
}

function walletPeriodRange(period) {
  var now = new Date();
  var from, to = now;
  if (period === 'last_month') {
    from = new Date(now.getFullYear(), now.getMonth()-1, 1);
    to = new Date(now.getFullYear(), now.getMonth(), 1);
  } else if (period === '7d') {
    from = new Date(now.getTime() - 7*86400000);
  } else if (period === '30d') {
    from = new Date(now.getTime() - 30*86400000);
  } else if (period === 'all') {
    from = new Date('1970-01-01');
  } else { // month
    from = new Date(now.getFullYear(), now.getMonth(), 1);
  }
  return { from: from.toISOString(), to: to.toISOString() };
}

    +'</div>';
}

/** 报酬 × 人数 实时费用计算器 */
function onTaskCostInput() {
  var meter = document.getElementById('task-cost-meter');
  if (!meter) return;

  var payout = Number((document.getElementById('payout')||{}).value) || 0;
  var mh     = Number((document.getElementById('maxHeralds')||{}).value) || 0;
  if (!payout || !mh) { meter.innerHTML = ''; return; }

  var rate = (state.brandProfile && state.brandProfile.commission_rate) || 0.15;
  var cost  = Math.round(payout / (1 - rate));
  var fee   = cost - payout;
  var total = cost * mh;
  var isPerformance = ((document.getElementById('mode')||{}).value) === 'PERFORMANCE';

  // 额度数据（成果报酬任务按转化付费，无法预估总支出，不做额度预检）
  var c        = brandBalance && brandBalance.credit;
  var capacity = !isPerformance ? (c ? c.totalCapacity : (brandBalance ? brandBalance.available : null)) : null;
  var over     = capacity !== null && total > capacity;
  var barColor = over ? '#dc2626' : '#16a34a';

  var h = '<div style="background:'+(over?'#fef2f2':'#f8fafc')+';border:1px solid '+(over?'#fca5a5':'#e2e8f0')
    +';border-radius:10px;padding:14px 16px;margin-bottom:12px">';

  // 三栏：任务报酬 / 平台服务费 / 任务总支出
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:'+(capacity!==null?'10px':'0')+';">';
  h += '<div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">任务报酬</div>'
    +'<div style="font-size:18px;font-weight:700;color:#16a34a">¥'+Number(payout).toLocaleString()+'</div>'
    +'<div style="font-size:10px;color:var(--muted)">赫使到手 / 人</div></div>';
  h += '<div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">平台服务费</div>'
    +'<div style="font-size:18px;font-weight:700;color:#6b7280">¥'+Number(fee).toLocaleString()+'</div>'
    +'<div style="font-size:10px;color:var(--muted)">'+(rate*100).toFixed(0)+'% / 人</div></div>';
  h += '<div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">任务总支出</div>'
    +'<div style="font-size:18px;font-weight:700;color:'+(over?'#dc2626':'var(--text)')+'">¥'+Number(total).toLocaleString()+'</div>'
    +'<div style="font-size:10px;color:var(--muted)">¥'+Number(cost).toLocaleString()+' × '+mh+' 人</div></div>';
  h += '</div>';

  // 额度占用（仅公开任务 + 有额度数据时显示）
  if (capacity !== null && taskCap > 0) {
    var pct = Math.min(100, Math.round(total / taskCap * 100));
    h += '<div style="height:4px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-bottom:4px">'
      +'<div style="height:100%;width:'+pct+'%;background:'+barColor+';border-radius:3px;transition:width .25s"></div></div>';
    h += '<div style="display:flex;justify-content:space-between;align-items:center">';
    if (over) {
      h += '<span style="font-size:11px;color:#dc2626;font-weight:500">⚠ 超出可发额度，需充值 ¥'+Math.round(total-capacity).toLocaleString()+'</span>'
        +'<span onclick="nav(\'wallet\')" style="font-size:11px;font-weight:600;color:#dc2626;cursor:pointer;text-decoration:underline">去充值 →</span>';
    } else {
      h += '<span style="font-size:11px;color:var(--muted)">额度占用 '+pct+'%</span>'
        +'<span style="font-size:11px;color:var(--muted)">发布后剩余 ¥'+Math.round(capacity-total).toLocaleString()+'</span>';
    }
    h += '</div>';
  }

  h += '</div>';
  meter.innerHTML = h;
}

/** 表单内联错误（替代 alert） */
function showFormError(msg) {
  var el = document.getElementById('task-form-error');
  if (!el) return;
  if (msg) {

/** 任务管理页顶部额度汇总 */
function taskCapacitySummary() {
  if (!brandBalance) return '<div style="height:72px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px">加载额度信息...</div>';
  var b      = brandBalance;
  var c      = b.credit || {};
  var avail  = b.available || 0;
  var frozen = b.frozen    || 0;
  var credit = c.initialCredit || 0;   // 信用额度上限
  var cUsed  = c.creditUsed   || 0;   // 活跃信用任务占用
  // 单笔最高可发 = max(钱包余额, 信用剩余)
  var cRemaining = c.creditRemaining != null ? c.creditRemaining : Math.max(0, credit - cUsed);
  var taskCap    = Math.max(avail, cRemaining);
  var remaining  = taskCap;
  var isFastPayout = c.fastPayoutEligible;
  var fpThresh    = c.fastPayoutThreshold || 100000;

  // 进度条：信用已占用 / 信用额度上限
  var pct      = credit > 0 ? Math.min(100, Math.round(cUsed / credit * 100)) : 0;
  var barColor = pct >= 90 ? '#dc2626' : pct >= 60 ? '#f59e0b' : '#22c55e';

  function stat(label, val, color) {
    return '<div><div style="font-size:11px;color:var(--muted);margin-bottom:3px">'+label+'</div>'
      +'<div style="font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:'+color+'">¥'+Number(val).toLocaleString()+'</div></div>';
  }
  function sep(sym) {
    return '<div style="font-size:11px;color:var(--muted);align-self:center;padding:0 3px;white-space:nowrap">'+sym+'</div>';
  }
  function vline() {
    return '<div style="width:1px;background:var(--border);align-self:stretch;margin:2px 0"></div>';
  }

  var leftStats = '<div style="display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;flex:1">';
  if (credit > 0) {
    leftStats += stat('钱包余额', avail, 'var(--text)');
    leftStats += vline();
    leftStats += stat('信用剩余', cRemaining, cRemaining <= 0 ? '#dc2626' : '#1d4ed8');
    leftStats += sep('→');
    leftStats += stat('单笔最高可发', remaining, remaining <= 0 ? '#dc2626' : '#16a34a');
    if (frozen > 0) { leftStats += vline(); leftStats += stat('任务冻结', frozen, '#f59e0b'); }
  } else {
    leftStats += stat('可用余额', avail, avail < 0 ? '#dc2626' : 'var(--text)');
    if (frozen > 0) { leftStats += vline(); leftStats += stat('任务冻结', frozen, '#f59e0b'); }
    leftStats += sep('=');
    leftStats += stat('可发任务额度', Math.max(0, avail), avail <= 0 ? '#dc2626' : '#1d4ed8');
  }
  leftStats += '</div>';

  var rightEl = isFastPayout
    ? '<div style="align-self:center;text-align:center">'
        +'<span style="display:block;font-size:12px;font-weight:600;color:#0369a1;background:#e0f2fe;border-radius:6px;padding:4px 10px;white-space:nowrap;margin-bottom:4px">⚡ 极速打款</span>'
        +'<button class="btn btn-outline btn-sm" onclick="nav(\'wallet\')">充值</button>'
      +'</div>'
    : '<div style="align-self:center;text-align:center">'
        +'<button class="btn btn-primary btn-sm" style="white-space:nowrap;display:block;margin-bottom:4px" onclick="nav(\'wallet\')">充值 →</button>'
        +'<div style="font-size:10px;color:var(--muted)">余额≥¥'+Number(fpThresh).toLocaleString()+'开启⚡</div>'
      +'</div>';

  var border = remaining <= 0 ? '#fecaca' : credit > 0 ? '#bfdbfe' : 'var(--border)';

  var html = '<div style="background:var(--card-bg);border:1px solid '+border+';border-radius:12px;padding:14px 18px;margin-bottom:16px">'
    +'<div style="display:flex;align-items:stretch;gap:16px">'+leftStats+rightEl+'</div>';

  if (credit > 0) {
    html += '<div style="display:flex;align-items:center;gap:10px;margin-top:10px">'
      +'<div style="flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden">'
      +'<div style="height:100%;width:'+pct+'%;background:'+barColor+';border-radius:2px;transition:width .4s"></div></div>'
      +'<div style="font-size:11px;color:var(--muted);white-space:nowrap">信用额度 ¥'+Number(credit).toLocaleString()+' · 已占用 '+pct+'%'
      +(remaining<=0?' · <span style="color:#dc2626;font-weight:600">额度已耗尽，请充值</span>':'')+'</div>'
      +'</div>';
  }

  html += '</div>';
  return html;
}

  h += '<div style="font-size:18px;color:var(--muted);padding:0 4px;padding-top:14px">=</div>';
  h += '<div><div style="font-size:11px;color:var(--muted);margin-bottom:3px">任务额度</div>'

  if (used > 0) {

      +'<div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#3b82f6,#7c3aed);border-radius:3px;transition:width .4s"></div></div>';
    h += '<div style="font-size:11px;color:var(--muted)">已承诺 ¥'+Number(used).toLocaleString()+' · 剩余可承诺 ¥'+Number(Math.max(0,taskCapacity-used)).toLocaleString()+'</div>';

  if (!hasToppedUp) {

      +'</div>';

function topupWizardHTML() {
  var steps = ['选择金额','支付方式','付款详情','完成'];
  var h = '';

  // 步骤指示器
  h += '<div style="display:flex;align-items:center;justify-content:center;margin-bottom:32px">';
  for (var i = 0; i < steps.length; i++) {
    var active = (i+1) === topupStep;
    var done   = (i+1) < topupStep;
    var dotBg  = done ? '#16a34a' : active ? 'var(--primary)' : '#e5e7eb';
    var txtClr = active ? 'var(--primary)' : done ? '#16a34a' : '#9ca3af';
    h += '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-width:56px">';
    h += '<div style="width:30px;height:30px;border-radius:50%;background:'+dotBg+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:all .2s">'+(done?'✓':(i+1))+'</div>';
    h += '<div style="font-size:11px;color:'+txtClr+';font-weight:'+(active?'600':'400')+';white-space:nowrap">'+steps[i]+'</div>';
    h += '</div>';
    if (i < steps.length-1) h += '<div style="flex:1;height:2px;background:'+(i+1<topupStep?'#16a34a':'#e5e7eb')+';margin:0 4px;margin-bottom:22px"></div>';

  return h;
}

// 编辑金额：仅更新变量和按钮状态，不触发整页 render（避免输入框失焦）
function onTopupAmountInput(el) {
  var v = parseFloat(el.value);

function uploadBrandAsset(type, input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var msgEl = document.getElementById('assetUploadMsg');
  if (msgEl) msgEl.textContent = '上传中...';
  var fd = new FormData();
  fd.append('file', file);
  var xhr = new XMLHttpRequest();
  xhr.open('POST', API+'/uploads/brand/'+type, true);
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() {
    var d; try { d = JSON.parse(xhr.responseText); } catch(e) { d = {}; }
    if (d.error) { if (msgEl) msgEl.textContent = d.error; return; }
    state.brandProfile = state.brandProfile || {};
    if (type === 'logo') state.brandProfile.logo_url = d.url;
    else state.brandProfile.promo_image_url = d.url;
    if (msgEl) msgEl.textContent = '上传成功';
    render();
  };
  xhr.onerror = function() { if (msgEl) msgEl.textContent = '上传失败'; };
  xhr.send(fd);
}

/* ── API ── */
function api(method, path, body, cb) { patch(method, path, body, cb); }
function get(path, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', API+path, true);
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({}); } };
  xhr.onerror = function() { cb({}); };
  xhr.send();
}
function post(path, body, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open('POST', API+path, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({}); } };
  xhr.onerror = function() { cb({}); };
  xhr.send(JSON.stringify(body));
}
function patch(method, path, body, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, API+path, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({}); } };
  xhr.onerror = function() { cb({}); };
  xhr.send(JSON.stringify(body));
}

  if (page === 'reviews') loadPendingReviews();

function loadMyTasks() {
  if (!state.user) return;
  get('/tasks/my/stats', function(d) {
    if (d && d.tasks) {
      state.dashStats = d;
      state.tasks = d.tasks;
    }
    state.tasksLoading = false;
    render();
  });
}

function loadPendingReviews() {
  state.reviewTab = state.reviewTab || 'apps';
  state.allPendingApps = [];
  state.allPendingSubs = [];
  get('/tasks?creator='+state.user.id+'&status=OPEN&limit=100', function(d) {
    var tasks = d.tasks || [];
    var remaining = tasks.length;
    if (!remaining) { render(); return; }
    tasks.forEach(function(t) {
      get('/tasks/'+t.id, function(detail) {
        (detail.applications||[]).forEach(function(a) {
          if (a.status==='PENDING') state.allPendingApps.push(Object.assign({}, a, {task_title:t.title, task_id:t.id}));
        });
        remaining--;
        if (!remaining) {
          // load subs
          var subTasks = tasks.slice(); var srem = subTasks.length;
          subTasks.forEach(function(st) {
            get('/submissions/task/'+st.id, function(subs) {
              (subs||[]).forEach(function(s) {
                if (s.status==='PENDING_REVIEW') state.allPendingSubs.push(Object.assign({}, s, {task_title:st.title}));
              });
              srem--;
              if (!srem) render();
            });
          });
        }
      });
    });
    render();
  });
}

  state.page = 'task_detail';

/* ── 封面图上传 ── */
var _pendingCoverBlob = null; // 创建任务时暂存压缩后的图

function compressImage(file, maxLong, quality) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(e) {
      var img = new Image();
      img.onerror = reject;
      img.onload = function() {
        var w = img.width, h = img.height;
        var ratio = Math.min(maxLong / Math.max(w, h), 1); // 只缩不放大
        var cw = Math.round(w * ratio), ch = Math.round(h * ratio);
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        canvas.toBlob(function(blob) { resolve(blob); }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function uploadCoverToTask(taskId, blob, onDone) {
  var form = new FormData();
  form.append('file', blob, 'cover.jpg');
  var xhr = new XMLHttpRequest();
  xhr.open('POST', API + '/uploads/task/' + taskId + '/cover', true);
  xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
  xhr.onload = function() {
    try { var d = JSON.parse(xhr.responseText); onDone(d.error || null, d.url); }
    catch(e) { onDone('上传失败'); }
  };
  xhr.onerror = function() { onDone('网络错误'); };
  xhr.send(form);
}

// 创建表单：选文件后预览，暂存到 _pendingCoverBlob
function onCoverFileSelect(input) {
  if (!input.files || !input.files[0]) return;
  var wrap = document.getElementById('cover-upload-wrap');
  var status = document.getElementById('cover-status');
  if (status) status.textContent = '压缩中…';
  compressImage(input.files[0], 1200, 0.82).then(function(blob) {
    _pendingCoverBlob = blob;
    var url = URL.createObjectURL(blob);
    var preview = document.getElementById('cover-preview-img');
    if (preview) { preview.src = url; preview.style.display = 'block'; }
    var ph = document.getElementById('cover-placeholder');
    if (ph) ph.style.display = 'none';
    if (status) status.textContent = '已选择（' + Math.round(blob.size/1024) + 'KB），保存任务后上传';
  }).catch(function() { if (status) status.textContent = '图片读取失败，请重试'; });
}

function saveTask(publish) {
  var body = {
    title: (document.getElementById('title')||{}).value,
    description: (document.getElementById('description')||{}).value,
    requirements: (document.getElementById('requirements')||{}).value,
    payoutPerHerald: Number((document.getElementById('payout')||{}).value),
    maxHeralds: Number((document.getElementById('maxHeralds')||{}).value||1),
    mode: (document.getElementById('mode')||{}).value,
    category: (document.getElementById('category')||{}).value,
    contentType: (document.getElementById('contentType')||{}).value,
    difficulty: (document.getElementById('difficulty')||{}).value,
    deadline: (document.getElementById('deadline')||{}).value || undefined,
    codeMode: document.getElementById('codeMode-custom')?.checked ? 'custom' : 'auto',
    platformRequirements: taskPlatformReqs.length > 0 ? taskPlatformReqs : undefined,
    reqMode: taskReqMode,
    reqMinCount: taskReqMode === 'ANY_N' ? taskReqMinCount : undefined,
    visibility: (document.getElementById('visibility')||{}).value || 'PUBLIC',
  };
  showFormError('');  // 清除旧错误
  if (!body.title || !body.description || !body.payoutPerHerald || !body.category) {
    showFormError('请填写任务标题、描述、分类和报酬金额'); return;
  }

  // 发布前客户端额度预检（减少不必要的服务器往返）
  if (publish) {
    var rate  = (state.brandProfile && state.brandProfile.commission_rate) || 0.15;
    var total = Math.round(body.payoutPerHerald / (1 - rate)) * body.maxHeralds;
    var c        = brandBalance && brandBalance.credit;
    // 单笔任务只走一个资金池：钱包 OR 信用剩余，取较大值
    var wallet = brandBalance ? (brandBalance.available || 0) : 0;
    var creditLeft = c ? (c.creditRemaining || 0) : 0;
    var maxSingle = Math.max(wallet, creditLeft);
    if (maxSingle > 0 && total > maxSingle) {
      showFormError('额度不足，本任务需 ¥'+Number(total).toLocaleString()
        +'，当前最大可发 ¥'+Math.round(maxSingle).toLocaleString()
        +'（钱包 ¥'+Math.round(wallet).toLocaleString()+' / 信用剩余 ¥'+Math.round(creditLeft).toLocaleString()+'）。');
      return;
    }
  }

  var isEdit = state.page === 'task_edit' && state.editingTask;
  var method = isEdit ? 'PUT' : 'POST';
  var path = isEdit ? '/tasks/'+state.editingTask.id : '/tasks';

  patch(method, path, body, function(d) {
    if (d.error) {
      var msg = d.error;
      if (d.details && d.details.length) {
        msg += '：' + d.details.map(function(e){ return (e.path||[]).join('.')+' '+e.message; }).join('；');
      }
      showFormError(msg); return;
    }
    // 上传封面图（仅新建时，编辑时已在选文件时即时上传）
    if (!isEdit && _pendingCoverBlob) {
      var blob = _pendingCoverBlob;
      _pendingCoverBlob = null;
      uploadCoverToTask(d.id, blob, function(err, url) {
        if (!err && state.currentTask) state.currentTask.cover_image = url;
      });
    }
    loadMyTasks();
    loadDashStats();

    if (publish && d.status === 'DRAFT') {
      if (body.mode === 'PERFORMANCE') {
        doPublishWithCodeCheck(d.id);
      } else {
        patch('PATCH', '/tasks/'+d.id+'/publish', {}, function(p) {
          if (p.error) {
            var errMsg = p.error;
            if (p.code === 'INSUFFICIENT_CREDIT') {
              errMsg = '额度不足，本任务需 ¥'+(p.needed||0).toLocaleString()
                +'，当前剩余 ¥'+Math.round((p.creditInfo||{}).totalCapacity||0).toLocaleString()
                +'。请充值后再发布。';
            }
            showFormError(errMsg); return;
          }
          state.msg = '任务已发布！'; state.msgType = 'success';
          if (p.topupReminder) setTimeout(function(){ showTopupReminder(p.topupReminder); }, 400);
          loadMyTasks(); loadDashStats();
          openTask(d.id);
        });
      }
    } else {
      state.msg = isEdit ? '任务已更新' : '草稿已保存，请检查推广码后点击「发布任务」使其生效';
      state.msgType = 'success';
      openTask(d.id);
    }
  });
}

function doPublishWithCodeCheck(id) {
  // 问题2+4：检查邀请码是否存在，并提示确认
  get('/tasks/'+id, function(t) {
    get('/tasks/'+id+'/codes', function(pool) {
      var codeCount = pool ? pool.total : 0;
      var isCustom = t.code_mode === 'custom';

      if (codeCount === 0) {
        openTask(id);
        showMsg(isCustom
          ? '请先上传推广码再发布：任务详情 → 上传推广码 → 发布任务'
          : '推广码生成异常，请重新创建任务',
          'error'
        );
        return;
      }

      // 问题4：确认邀请码有效性
      var msg = '确认发布任务？\n\n'
        + '📋 任务共有 ' + codeCount + ' 个推广码\n'
        + (isCustom ? '⚠️ 请确认这些推广码已在 Remitly 等第三方系统中配置完成，发布后赫使将立即收到推广码。'
                    : '⚠️ 系统已自动生成推广码，请确认已下载 CSV 并上传到第三方系统，否则赫使拿到的码将无法使用。')
        + '\n\n推广码未配置到第三方系统将导致赫使推广无效。';

      showConfirmModal({
        title: '发布前确认推广码',
        body: msg,
        confirmText: '已确认，发布',
        cancelText: '返回检查',
        onConfirm: function() {
          patch('PATCH', '/tasks/'+id+'/publish', {}, function(p) {
            if (p.error) { showMsg(p.error, 'error'); return; }
            state.msg = '任务已发布！赫使现在可以看到并报名。'; state.msgType = 'success';
            loadMyTasks(); loadDashStats();
            openTask(id);
          });
        },
      });
    });
  });
}

function publishTask(id) {
  var t = state.currentTask;
  if (t && t.mode === 'PERFORMANCE') {
    doPublishWithCodeCheck(id);
  } else {
    var payout = t ? Number(t.payout_per_herald || 0) : 0;
    var mh     = t ? Number(t.max_heralds || 1) : 1;
    var rate   = (state.brandProfile && state.brandProfile.commission_rate) || 0.15;
    var cost   = Math.round(payout / (1 - rate));
    var fee    = cost - payout;
    var total  = cost * mh;
    var confirmBody = payout
      ? '任务报酬 ¥' + Number(payout).toLocaleString() + ' / 人（赫使到手）\n平台服务费 ¥' + Number(fee).toLocaleString() + ' / 人（' + (rate*100).toFixed(0) + '%）\n任务总支出 ¥' + Number(cost).toLocaleString() + ' × ' + mh + ' 人 = ¥' + Number(total).toLocaleString() + '\n\n发布后赫使即可在探索列表看到并报名。'
      : '发布后赫使可在探索列表看到此任务并报名，确认信息无误后再发布。';
    showConfirmModal({
      title: '确认发布任务',
      body: confirmBody,
      confirmText: '确认发布',
      onConfirm: function() {
        patch('PATCH', '/tasks/'+id+'/publish', {}, function(d) {
          if (d.error) {
            if (d.code === 'INSUFFICIENT_CREDIT') {
              var ci = d.creditInfo || {};
              showConfirmModal({
                title: '额度不足，需充值后发布',
                body: '本任务需 ¥'+Number(d.needed||0).toLocaleString()
                  +'，当前剩余 ¥'+Math.round(ci.totalCapacity||0).toLocaleString()
                  +'（可发额度 ¥'+Math.round(ci.taskCapacity||0).toLocaleString()+' - 已占用 ¥'+Math.round(ci.creditUsed||0).toLocaleString()+'）',
                confirmText: '去充值',
                cancelText: '稍后再说',
                onConfirm: function() { nav('wallet'); },
              });
            } else {
              showMsg(d.error, 'error');
            }
            return;
          }
          state.msg = '任务已发布'; state.msgType = 'success';
          if (state.currentTask) state.currentTask.status = 'OPEN';
          loadMyTasks(); loadDashStats();
          if (d.topupReminder) setTimeout(function(){ showTopupReminder(d.topupReminder); }, 400);
          render();
        });
      },
    });
  }
}

function doCsvUpload() {
  var taskId = (document.getElementById('csv-task')||{}).value;
  var raw = (document.getElementById('csv-data')||{}).value;
  var resultEl = document.getElementById('csv-result');
  if (!raw.trim()) { resultEl.innerHTML='<div class="alert alert-error">请粘贴数据或选择CSV文件</div>'; return; }

  var lines = raw.trim().split('\n').map(function(l){return l.trim()}).filter(Boolean);
  if (lines.length < 2) { resultEl.innerHTML='<div class="alert alert-error">数据至少需要2行（表头+数据）</div>'; return; }

  // 解析第一行表头
  var headers = lines[0].split(',').map(function(h){return h.trim().toLowerCase()});
  var codeIdx = headers.indexOf('code');
  var regIdx = headers.indexOf('注册数');
  var usedIdx = headers.indexOf('使用数');
  if (codeIdx === -1) { resultEl.innerHTML='<div class="alert alert-error">表头需要包含 "code" 列</div>'; return; }

  var records = [];
  for (var i = 1; i < lines.length; i++) {
    var cols = lines[i].split(',');
    var code = (cols[codeIdx]||'').trim();
    if (!code) continue;
    var regCount = regIdx >= 0 ? parseInt(cols[regIdx]||'0',10) : 0;
    var usedCount = usedIdx >= 0 ? parseInt(cols[usedIdx]||'0',10) : 0;
    records.push({ code: code, registered_count: isNaN(regCount)?0:regCount, used_count: isNaN(usedCount)?0:usedCount });
  }

  if (!records.length) { resultEl.innerHTML='<div class="alert alert-error">没有有效的推广码数据</div>'; return; }

  post('/tasks/' + taskId + '/csv', { records: records }, function(d) {
    if (d.error) { resultEl.innerHTML = '<div class="alert alert-error">'+esc(d.error)+'</div>'; return; }
    var html = '';
    if (d.processed > 0) {
      html += '<div class="alert alert-success">生效 '+d.processed+' 条，新增转化 '+(d.newConversions||0)+' 次，结算 ¥'+Number(d.totalPaid||0).toLocaleString()+'（单价 ¥'+Number(d.commissionPerConversion||0).toLocaleString()+'/次）</div>';
    }
    if (d.skippedCodes && d.skippedCodes.length) {
      var hints = {};
      (d.skippedHints || []).forEach(function(h) { hints[h.code] = h.belongsTo; });
      html += '<div class="alert alert-error">⚠️ '+d.skippedCodes.length+' 条未生效：<br>'
        + d.skippedCodes.map(function(c) {
            return '<span style="font-family:monospace">'+esc(c)+'</span>'
              + (hints[c] ? ' — 该码属于任务《'+esc(hints[c])+'》，请在上方选择该任务后重新上传' : ' — 该码在所选任务下不存在，请检查拼写');
          }).join('<br>')
        + '</div>';
    }
    if (d.blockedCodes && d.blockedCodes.length) {
      html += '<div class="alert alert-error">💰 '+esc(d.message||'部分推广码因余额不足未结算')+'：<span style="font-family:monospace">'+esc(d.blockedCodes.join(', '))+'</span></div>';
    }
    if (!html) html = '<div class="alert alert-error">没有任何记录被处理，请检查数据格式</div>';
    resultEl.innerHTML = html;
  });
}

  var reader = new FileReader();
  reader.onload = function(e) {

}

function copyUploadLink(taskId, token) {
  var url = window.location.origin + '/upload.html?task=' + taskId + '&token=' + token;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function() { showMsg('上传链接已复制', 'success'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showMsg('上传链接已复制', 'success');
  }
}

function taskShareUrl(taskId) {
  // Taro H5 版邀请落地页(hash路由); 旧 /herix.html?task= 已弃用
  return window.location.origin + '/#/pages/landing/index?task=' + taskId;
}

function copyInviteLink(taskId) {
  var url = taskShareUrl(taskId);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function() { showMsg('链接已复制', 'success'); });
  } else {
    var el = document.getElementById('invite-link-text');
    if (el) { var r = document.createRange(); r.selectNode(el); window.getSelection().removeAllRanges(); window.getSelection().addRange(r); document.execCommand('copy'); showMsg('链接已复制', 'success'); }

/* ── 小程序分享入口（URL Link + 小程序码） ── */
function loadWeappLink(taskId) {
  var box = document.getElementById('weapp-link-box');
  if (box) box.innerHTML = '<span style="font-size:12px;color:var(--muted)">获取中…</span>';
  get('/tasks/'+taskId+'/weapp-link', function(d) {
    if (!box) return;
    if (d.available && d.link) {
      box.innerHTML = '<div style="font-size:12px;word-break:break-all;font-family:monospace;color:var(--text);margin-bottom:6px" id="weapp-link-text">'+esc(d.link)+'</div>'
        +'<button class="btn btn-outline btn-sm" onclick="copyWeappLink()">复制小程序链接</button>'
        +'<span style="font-size:11px;color:var(--muted);margin-left:8px">有效期至 '+(d.expiresAt||'').slice(0,10)+'（过期自动续）</span>';
    } else {
      box.innerHTML = '<span style="font-size:12px;color:var(--muted)">⏳ '+esc(d.reason||'小程序发布后可用')+'</span>';
    }
  });
}

function copyWeappLink() {
  var el = document.getElementById('weapp-link-text');
  if (!el) return;
  var url = el.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function() { showMsg('小程序链接已复制', 'success'); });
  } else {
    var r = document.createRange(); r.selectNode(el); window.getSelection().removeAllRanges(); window.getSelection().addRange(r); document.execCommand('copy'); showMsg('小程序链接已复制', 'success');
  }
}

function loadWeappQr(taskId) {
  var box = document.getElementById('weapp-qr-box');
  if (box) box.innerHTML = '<span style="font-size:12px;color:var(--muted)">生成中…</span>';
  // img 标签带不了 Authorization 头，用 fetch blob → objectURL
  fetch(API+'/tasks/'+taskId+'/weapp-qrcode', { headers: state.token ? { 'Authorization': 'Bearer '+state.token } : {} })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(d) { throw new Error(d.reason || '小程序发布后可用'); });
      return r.blob();
    })
    .then(function(blob) {
      if (!box) return;
      var url = URL.createObjectURL(blob);
      box.innerHTML = '<img src="'+url+'" style="width:160px;height:160px;border:1px solid #dbeafe;border-radius:8px;background:#fff;padding:6px" alt="小程序码">'
        +'<div style="font-size:11px;color:var(--muted);margin-top:4px">右键/长按保存图片，可放进海报或线下物料</div>';
    })
    .catch(function(e) {
      if (box) box.innerHTML = '<span style="font-size:12px;color:var(--muted)">⏳ '+esc(e.message)+'</span>';
    });
}

function showMsg(msg, type) {
  state.msg = msg; state.msgType = type || 'success'; render();
  setTimeout(function(){ state.msg = ''; render(); }, 3000);
}

function switchToHerald() {
  sessionStorage.setItem('herix_switch_token', state.token || '');
  sessionStorage.setItem('herix_switch_role', 'HERALD');
  window.location.href = 'herix.html';
}

function tryResumeSwitchedSession() {
  var token = sessionStorage.getItem('herix_switch_token');
  if (!token) return false;
  sessionStorage.removeItem('herix_switch_token');
  sessionStorage.removeItem('herix_switch_role');
  state.token = token;
  get('/auth/me', function(d) {
    if (d.error || !d.id) { state.token = null; render(); return; }
    var roles = d.roles || [d.role];
    if (!roles.includes('BRAND')) {
      // 切到的账号没有品牌身份，跳转到赫使端
      sessionStorage.setItem('herix_switch_token', state.token);
      window.location.href = 'herix.html';
      return;
    }
    state.user = {
      id: d.id, nickname: d.nickname, role: d.role, roles: roles,
      isVerified: !!d.is_verified, is_onboarded: !!d.brand_onboarded,
    };
    state.brandProfile = d;
    loadDashStats(); loadMyTasks();
  });
  return true;
}

function drawPoster(t, inviteUrl) {
  var canvas = document.getElementById('share-canvas');
  if (!canvas) return;

  var W = 640, H = 900;
  canvas.width = W; canvas.height = H;
  canvas.style.width = '100%';

  var ctx = canvas.getContext('2d');

  // 背景：深蓝渐变 header + 白色主体
  var grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, '#D43B27');
  grad.addColorStop(1, '#A82D1E');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 260);

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 240, W, H - 240);

  // 圆角过渡块
  ctx.beginPath();
  ctx.arc(28, 260, 28, 0, Math.PI*2);
  ctx.arc(W-28, 260, 28, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.fillRect(28, 232, W-56, 28);

  // Herix wordmark
  ctx.font = 'bold 18px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Herix · 赫使平台', 36, 48);

  // 品牌名
  var brandName = (t.creator_name || '品牌商家');
  ctx.font = 'bold 28px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(brandName, 36, 100);

  // 任务标签
  ctx.font = '13px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText('正在招募赫使', 36, 130);

  // 任务标题
  var title = t.title || '';
  ctx.font = 'bold 36px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#fff';
  wrapText(ctx, title, 36, 175, W-72, 42);

  // ── 白色区域 ──
  var yBase = 285;

  // 报酬 + 名额
  drawInfoCard(ctx, 36, yBase, 270, 90, '赫使获得', '¥' + Number(t.payout_per_herald||0).toLocaleString(), '#D43B27');
  drawInfoCard(ctx, 334, yBase, 270, 90, '招募名额', t.max_heralds + ' 人', '#16a34a');

  // 任务描述
  var desc = t.description || '';
  if (desc.length > 120) desc = desc.slice(0, 117) + '…';
  ctx.font = '15px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#374151';
  wrapText(ctx, desc, 36, yBase + 120, W-72, 22, 4);

  // 分隔线
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(36, yBase+220); ctx.lineTo(W-36, yBase+220); ctx.stroke();

  // QR 码 + 说明文
  var qrY = yBase + 240;
  ctx.font = 'bold 16px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#111827';
  ctx.fillText('扫码注册，立即领取任务', 36, qrY);

  ctx.font = '13px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#6b7280';
  ctx.fillText('新用户注册 · 免费加入 · 完成任务即获报酬', 36, qrY + 24);

  // QR 码图像（异步加载 SVG）
  var qrSize = 200;
  var qrX = W - qrSize - 36;
  var qrYPos = qrY - 12;

  // 先画占位框
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  roundRect(ctx, qrX, qrYPos, qrSize, qrSize, 12);
  ctx.stroke();

  var img = new Image();
  img.onload = function() {
    // SVG 转 canvas
    var svgBlob = new Blob([img._svgText], {type:'image/svg+xml'});
    var url = URL.createObjectURL(svgBlob);
    var svgImg = new Image();
    svgImg.onload = function() {
      ctx.clearRect(qrX, qrYPos, qrSize, qrSize);
      // 白底
      ctx.fillStyle = '#fff';
      roundRect(ctx, qrX, qrYPos, qrSize, qrSize, 12);
      ctx.fill();
      ctx.drawImage(svgImg, qrX+10, qrYPos+10, qrSize-20, qrSize-20);
      URL.revokeObjectURL(url);
      drawPosterFooter(ctx, W, H, inviteUrl);
    };
    svgImg.onerror = function(){ drawPosterFooter(ctx, W, H, inviteUrl); };
    svgImg.src = url;
  };
  // 通过 XHR 取 SVG 文本，再转 Blob URL（避免跨域 taint）
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/qr?data=' + encodeURIComponent(inviteUrl), true);
  xhr.onload = function() {
    img._svgText = xhr.responseText;
    img.onload();
  };
  xhr.onerror = function() { drawPosterFooter(ctx, W, H, inviteUrl); };
  xhr.send();

  drawPosterFooter(ctx, W, H, inviteUrl);
}

function drawPosterFooter(ctx, W, H, url) {
  // 底部品牌条
  ctx.fillStyle = '#f9fafb';
  ctx.fillRect(0, H-60, W, 60);
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H-60); ctx.lineTo(W, H-60); ctx.stroke();

  ctx.font = 'bold 14px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#D43B27';
  ctx.fillText('Herix', 36, H-33);

  ctx.font = '12px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#9ca3af';
  ctx.fillText('herix.jp · 赫使大使平台', 36, H-16);

  // 短链（截断）
  var shortUrl = url.replace('https://', '').replace('http://', '');
  if (shortUrl.length > 42) shortUrl = shortUrl.slice(0, 39) + '…';
  ctx.textAlign = 'right';
  ctx.font = '11px monospace';
  ctx.fillStyle = '#9ca3af';
  ctx.fillText(shortUrl, W-36, H-20);
  ctx.textAlign = 'left';
}

function drawInfoCard(ctx, x, y, w, h, label, value, color) {
  ctx.fillStyle = '#f9fafb';
  roundRect(ctx, x, y, w, h, 12);
  ctx.fill();

  ctx.font = '12px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#6b7280';
  ctx.fillText(label, x+16, y+28);

  ctx.font = 'bold 28px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = color;
  ctx.fillText(value, x+16, y+65);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  var words = text.split('');
  var line = '';
  var lines = 0;
  var limit = maxLines || 3;
  for (var i = 0; i < words.length; i++) {
    var test = line + words[i];
    if (ctx.measureText(test).width > maxWidth) {
      if (lines >= limit - 1 && i < words.length - 1) {
        ctx.fillText(line.slice(0, -1) + '…', x, y + lines * lineHeight);
        return;
      }
      ctx.fillText(line, x, y + lines * lineHeight);
      line = words[i];
      lines++;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, y + lines * lineHeight);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function downloadPoster() {
  var canvas = document.getElementById('share-canvas');
  if (!canvas) return;
  var link = document.createElement('a');
  link.download = 'herix-invite.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

loadCategories();
