function drawPoster(task, inviteUrl) {
  var canvas = document.getElementById('share-canvas');
  if (!canvas) return;

  var W = 640, H = 900;
  canvas.width = W; canvas.height = H;
  canvas.style.width = '100%';

  var ctx = canvas.getContext('2d');

  // 背景：深蓝渐变 header + 白色主体
  var grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, '#D43B27');
  grad.addColorStop(1, '#A82D1E');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 260);

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 240, W, H - 240);

  // 圆角过渡块
  ctx.beginPath();
  ctx.arc(28, 260, 28, 0, Math.PI*2);
  ctx.arc(W-28, 260, 28, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.fillRect(28, 232, W-56, 28);

  // Herix wordmark
  ctx.font = 'bold 18px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(t('merchant.poster.brand','Herix · 赫使平台'), 36, 48);

  // 品牌名
  var brandName = (task.creator_name || t('merchant.sidebar.brandLabel','品牌商家'));
  ctx.font = 'bold 28px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(brandName, 36, 100);

  // 任务标签
  ctx.font = '13px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText(t('merchant.poster.recruiting','正在招募赫使'), 36, 130);

  // 任务标题
  var title = task.title || '';
  ctx.font = 'bold 36px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#fff';
  wrapText(ctx, title, 36, 175, W-72, 42);

  // ── 白色区域 ──
  var yBase = 285;

  // 报酬 + 名额
  drawInfoCard(ctx, 36, yBase, 270, 90, t('merchant.taskDetail.heraldGets','赫使获得'), '¥' + Number(task.payout_per_herald||0).toLocaleString(), '#D43B27');
  drawInfoCard(ctx, 334, yBase, 270, 90, t('merchant.taskDetail.recruitQuota','招募名额'), task.max_heralds + ' ' + t('merchant.unit.person','人'), '#16a34a');

  // 任务描述
  var desc = task.description || '';
  if (desc.length > 120) desc = desc.slice(0, 117) + '…';
  ctx.font = '15px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#374151';
  wrapText(ctx, desc, 36, yBase + 120, W-72, 22, 4);

  // 分隔线
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(36, yBase+220); ctx.lineTo(W-36, yBase+220); ctx.stroke();

  // QR 码 + 说明文
  var qrY = yBase + 240;
  ctx.font = 'bold 16px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#111827';
  ctx.fillText(t('merchant.poster.scanCta','扫码注册，立即领取任务'), 36, qrY);

  ctx.font = '13px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#6b7280';
  ctx.fillText(t('merchant.poster.scanSub','新用户注册 · 免费加入 · 完成任务即获报酬'), 36, qrY + 24);

  // QR 码图像（异步加载 SVG）
  var qrSize = 200;
  var qrX = W - qrSize - 36;
  var qrYPos = qrY - 12;

  // 先画占位框
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  roundRect(ctx, qrX, qrYPos, qrSize, qrSize, 12);
  ctx.stroke();

  var img = new Image();
  img.onload = function() {
    // SVG 转 canvas
    var svgBlob = new Blob([img._svgText], {type:'image/svg+xml'});
    var url = URL.createObjectURL(svgBlob);
    var svgImg = new Image();
    svgImg.onload = function() {
      ctx.clearRect(qrX, qrYPos, qrSize, qrSize);
      // 白底
      ctx.fillStyle = '#fff';
      roundRect(ctx, qrX, qrYPos, qrSize, qrSize, 12);
      ctx.fill();
      ctx.drawImage(svgImg, qrX+10, qrYPos+10, qrSize-20, qrSize-20);
      URL.revokeObjectURL(url);
      drawPosterFooter(ctx, W, H, inviteUrl);
    };
    svgImg.onerror = function(){ drawPosterFooter(ctx, W, H, inviteUrl); };
    svgImg.src = url;
  };
  // 通过 XHR 取 SVG 文本，再转 Blob URL（避免跨域 taint）
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/qr?data=' + encodeURIComponent(inviteUrl), true);
  xhr.onload = function() {
    img._svgText = xhr.responseText;
    img.onload();
  };
  xhr.onerror = function() { drawPosterFooter(ctx, W, H, inviteUrl); };
  xhr.send();

  drawPosterFooter(ctx, W, H, inviteUrl);
}

function drawPosterFooter(ctx, W, H, url) {
  // 底部品牌条
  ctx.fillStyle = '#f9fafb';
  ctx.fillRect(0, H-60, W, 60);
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H-60); ctx.lineTo(W, H-60); ctx.stroke();

  ctx.font = 'bold 14px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#D43B27';
  ctx.fillText('Herix', 36, H-33);

  ctx.font = '12px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#9ca3af';
  ctx.fillText(t('merchant.poster.footer','herix.jp · 赫使大使平台'), 36, H-16);

  // 短链（截断）
  var shortUrl = url.replace('https://', '').replace('http://', '');
  if (shortUrl.length > 42) shortUrl = shortUrl.slice(0, 39) + '…';
  ctx.textAlign = 'right';
  ctx.font = '11px monospace';
  ctx.fillStyle = '#9ca3af';
  ctx.fillText(shortUrl, W-36, H-20);
  ctx.textAlign = 'left';
}

function drawInfoCard(ctx, x, y, w, h, label, value, color) {
  ctx.fillStyle = '#f9fafb';
  roundRect(ctx, x, y, w, h, 12);
  ctx.fill();

  ctx.font = '12px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = '#6b7280';
  ctx.fillText(label, x+16, y+28);

  ctx.font = 'bold 28px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillStyle = color;
  ctx.fillText(value, x+16, y+65);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  var words = text.split('');
  var line = '';
  var lines = 0;
  var limit = maxLines || 3;
  for (var i = 0; i < words.length; i++) {
    var test = line + words[i];
    if (ctx.measureText(test).width > maxWidth) {
      if (lines >= limit - 1 && i < words.length - 1) {
        ctx.fillText(line.slice(0, -1) + '…', x, y + lines * lineHeight);
        return;
      }
      ctx.fillText(line, x, y + lines * lineHeight);
      line = words[i];
      lines++;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, y + lines * lineHeight);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function downloadPoster() {
  var canvas = document.getElementById('share-canvas');
  if (!canvas) return;
  var link = document.createElement('a');
  link.download = 'herix-invite.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
