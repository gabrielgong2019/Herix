<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herix 商家后台</title>
<style>
:root {
  --primary: #D43B27; --sidebar: #111827; --sidebar-text: #9ca3af;
  --sidebar-active: #fff; --bg: #f5f5f7; --card: #fff;
  --text: #111; --muted: #6b7280; --border: #e5e7eb;
  --success: #16a34a; --warning: #d97706; --danger: #dc2626;
  --sidebar-w: 220px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif; background:var(--bg); color:var(--text); font-size:14px; }

/* ── Layout ── */
.layout { display:flex; min-height:100vh; }
.sidebar {
  width:var(--sidebar-w); background:var(--sidebar); color:var(--sidebar-text);
  display:flex; flex-direction:column; position:fixed; top:0; left:0; height:100vh; z-index:100;
  transition: transform .25s;
}
.main { margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; min-height:100vh; }
.topbar {
  background:#fff; border-bottom:1px solid var(--border);
  padding:0 28px; height:60px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:50;
}
.content { padding:28px; flex:1; }

/* ── Sidebar ── */
.sb-logo { padding:20px 20px 8px; font-size:16px; font-weight:800; color:#fff; letter-spacing:1px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:8px; }
.sb-logo span { color:var(--primary); }
.sb-section { padding:8px 12px 4px; font-size:10px; letter-spacing:1.5px; color:rgba(255,255,255,.3); text-transform:uppercase; }
.sb-item {
  display:flex; align-items:center; gap:10px; padding:10px 16px; margin:2px 8px;
  border-radius:8px; cursor:pointer; font-size:13px; color:var(--sidebar-text);
  transition: all .15s;
}
.sb-item:hover { background:rgba(255,255,255,.07); color:#fff; }
.sb-item.active { background:var(--primary); color:#fff; }
.sb-item .icon { font-size:16px; width:20px; text-align:center; }
.sb-badge { background:#ef4444; color:#fff; font-size:10px; padding:1px 6px; border-radius:10px; margin-left:auto; }
.sb-icon { font-size:15px; width:20px; text-align:center; }
.sb-bottom { margin-top:auto; padding:16px; border-top:1px solid rgba(255,255,255,.08); }
.sb-user { font-size:12px; color:rgba(255,255,255,.5); margin-bottom:8px; }
.sb-logout { font-size:12px; color:rgba(255,255,255,.4); cursor:pointer; }
.sb-logout:hover { color:#fff; }

/* ── Topbar ── */
.page-title { font-size:18px; font-weight:700; }
.topbar-right { display:flex; align-items:center; gap:12px; }
.lang-switcher { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.lang-btn { padding:5px 10px; font-size:11px; font-weight:600; border:none; background:#fff; color:var(--muted); cursor:pointer; }
.lang-btn+.lang-btn { border-left:1px solid var(--border); }
.lang-btn.active { background:var(--text); color:#fff; }
.btn { padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; border:none; cursor:pointer; transition:all .15s; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:#B02F1D; } /* --primary(#D43B27) 加深15%；旧值#005bb5是换红色主题前遗留的蓝 */
.btn-outline { background:#fff; color:var(--text); border:1px solid var(--border); }
.btn-outline:hover { border-color:#999; }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-success { background:var(--success); color:#fff; }

/* ── Cards & Stats ── */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
.stat-card { background:#fff; border-radius:12px; padding:20px; }
.stat-val { font-size:28px; font-weight:700; margin-bottom:4px; }
.stat-lbl { font-size:12px; color:var(--muted); }

/* ── Table ── */
.table-card { background:#fff; border-radius:12px; overflow:hidden; }
.table-head { padding:16px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
.table-title { font-size:15px; font-weight:600; }
table { width:100%; border-collapse:collapse; }
th { padding:10px 20px; text-align:left; font-size:12px; color:var(--muted); font-weight:500; border-bottom:1px solid var(--border); background:#fafafa; }
td { padding:12px 20px; border-bottom:1px solid var(--border); font-size:13px; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#f9fafb; cursor:pointer; }
.tag { display:inline-flex; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.tag-open { background:#dcfce7; color:#16a34a; }
.tag-draft { background:#fef3c7; color:#d97706; }
.tag-completed { background:#e0e7ff; color:#4338ca; }
.tag-cancelled { background:#fee2e2; color:#dc2626; }
.tag-pending { background:#fef3c7; color:#d97706; }
.tag-approved { background:#dcfce7; color:#16a34a; }
.tag-rejected { background:#fee2e2; color:#dc2626; }

/* ── Form ── */
.form-card { background:#fff; border-radius:12px; padding:24px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-full { grid-column:1/-1; }
.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size:12px; font-weight:600; color:var(--muted); }
.field input, .field textarea, .field select {
  padding:10px 12px; border:1px solid var(--border); border-radius:8px;
  font-size:13px; color:var(--text); background:#fff; outline:none;
  transition: border-color .15s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color:var(--primary); }
.field textarea { resize:vertical; min-height:80px; }
.form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding-top:20px; border-top:1px solid var(--border); }
.field-hint { font-size:11px; color:var(--muted); margin-top:2px; }

/* ── Detail panels ── */
.detail-grid { display:grid; grid-template-columns:1fr 320px; gap:20px; align-items:start; }
.panel { background:#fff; border-radius:12px; padding:20px; margin-bottom:16px; }
.panel-title { font-size:14px; font-weight:600; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
.info-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.info-row:last-child { border-bottom:none; }
.info-key { color:var(--muted); }
.applicant-card { padding:16px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; background:var(--card); transition:box-shadow .15s; }
.applicant-card:hover { box-shadow:0 2px 10px rgba(0,0,0,.07); }
.applicant-card:last-child { margin-bottom:0; }
.applicant-hdr { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.av { width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
.sub-card { border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:10px; background:var(--card); transition:box-shadow .15s; }
.sub-card:hover { box-shadow:0 2px 10px rgba(0,0,0,.07); }
.sub-card:last-child { margin-bottom:0; }

/* ── Tabs ── */
.tabs { display:flex; gap:4px; background:#f3f4f6; border-radius:10px; padding:4px; margin-bottom:20px; }
.tab { flex:1; text-align:center; padding:7px; border-radius:7px; font-size:13px; cursor:pointer; color:var(--muted); font-weight:500; }
.tab.active { background:#fff; color:var(--text); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.1); }

/* ── Login ── */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); }
.login-card { background:#fff; border-radius:16px; padding:40px; width:380px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
.login-logo { font-size:22px; font-weight:800; text-align:center; margin-bottom:4px; }
.login-logo span { color:var(--primary); }
.login-sub { text-align:center; font-size:12px; color:var(--muted); margin-bottom:28px; }
.field-lg input { padding:12px 14px; font-size:14px; }

/* ── Empty ── */
.empty { text-align:center; padding:60px 20px; color:var(--muted); }
.empty-icon { font-size:40px; margin-bottom:12px; }

/* ── Alert ── */
.alert { padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; }
.alert-error { background:#fee2e2; color:#991b1b; }
.alert-success { background:#dcfce7; color:#166534; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .sidebar { transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); }
  .main { margin-left:0; }
  .stats-grid { grid-template-columns:1fr 1fr; }
  .form-grid { grid-template-columns:1fr; }
  .detail-grid { grid-template-columns:1fr; }
  .hamburger { display:flex; }
}
.hamburger { display:none; align-items:center; justify-content:center; width:36px; height:36px; border:none; background:none; cursor:pointer; font-size:20px; }
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:90; }
.overlay.show { display:block; }
</style>
<script src="/shared/auth.js"></script>
<script src="/shared/sidebar.js"></script>
<script src="/shared/platforms.js"></script>
</head>
<body>

<div id="root"></div>

<script>
var API = '/api';
var state = {
  page: 'login', user: null, token: null,
  tasks: [], currentTask: null, taskTab: 'applicants',
  stats: {}, msg: null, msgType: 'success',
  editingTask: null, showActivate: false, tasksLoading: false, taskFilter: '',
};

/* ── i18n runtime（轻量版，无构建步骤，语义对齐 herix-miniapp/src/utils/i18n.ts）──
 * 取值：远端词典(/api/i18n/:locale，运营在 admin「本地化」矩阵改的) → fallback(调用点内联的中文原文)
 * 没有打包词典这一层——merchant.html 不过 webpack，fallback 参数本身就是"永远可用的兜底"
 * key 统一 merchant.* 前缀，和 herix-miniapp 共用同一张 i18n_entries 表/同一套 seed 管线 */
var MI18N_LOCALE = 'zh';
var MI18N_DICT = {};
var MI18N_LOCALES = [{ id: 'zh', label: '中' }, { id: 'ja', label: '日' }, { id: 'en', label: 'EN' }];

function detectLocale() {
  try {
    var stored = localStorage.getItem('herix_merchant_locale');
    if (stored && MI18N_LOCALES.some(function(l){return l.id===stored})) return stored;
    var nav = (navigator.language || 'zh').toLowerCase();
    if (nav.indexOf('ja') === 0) return 'ja';
    if (nav.indexOf('en') === 0) return 'en';
  } catch (e) { /* 检测失败走默认 */ }
  return 'zh';
}

/** key 没有对应词条(远端未就绪/字段缺失)时用 fallback；fallback 缺省则显示 key 本身 */
function t(key, fallback, params) {
  var v = MI18N_DICT[key] || fallback || key;
  if (params) {
    for (var k in params) if (params.hasOwnProperty(k)) v = v.split('{'+k+'}').join(params[k]);
  }
  return v;
}

function loadI18nDict(locale) {
  fetch(API + '/i18n/' + locale)
    .then(function(r){ return r.json(); })
    .then(function(d){
      MI18N_DICT = (d && d.entries) || {};
      try { localStorage.setItem('herix_merchant_i18n_'+locale, JSON.stringify(MI18N_DICT)); } catch (e) {}
      render();
    })
    .catch(function(){ /* 拉取失败：留着调用点的中文 fallback，不阻断页面 */ });
}

function setLocale(locale) {
  MI18N_LOCALE = locale;
  try { localStorage.setItem('herix_merchant_locale', locale); } catch (e) {}
  try {
    var cached = localStorage.getItem('herix_merchant_i18n_'+locale);
    if (cached) MI18N_DICT = JSON.parse(cached);
  } catch (e) {}
  render();
  loadI18nDict(locale);
}

MI18N_LOCALE = detectLocale();
(function(){
  try {
    var cached = localStorage.getItem('herix_merchant_i18n_'+MI18N_LOCALE);
    if (cached) MI18N_DICT = JSON.parse(cached);
  } catch (e) {}
})();

/* ── 语言切换器 UI（跟 topbar 其它按钮同一批 helper） ── */
function langSwitcherHTML() {
  return '<div class="lang-switcher">' + MI18N_LOCALES.map(function(l) {
    return '<button class="lang-btn'+(MI18N_LOCALE===l.id?' active':'')+'" onclick="setLocale(\''+l.id+'\')">'+l.label+'</button>';
  }).join('') + '</div>';
}

/* ── 行业注册表（2026-07-18 id 化，仿 category 模式）──
 * DB 存稳定 id，显示层走词条翻译；历史数据存的是中文原文，
 * industryToId() 做读取兼容（db.ts 迁移会归一存量，兼容层防漏网/防迁移前的旧缓存） */
var INDUSTRIES = ['finance','beauty','fashion','food','travel','baby','ecommerce','other'];
var INDUSTRY_LEGACY = {'金融服务':'finance','美妆':'beauty','时尚':'fashion','食品饮料':'food','旅游':'travel','母婴':'baby','电商':'ecommerce','其他':'other'};
function industryToId(v) { return INDUSTRY_LEGACY[v] || v || ''; }
function industrySelectHTML(domId, currentRaw) {
  var cur = industryToId(currentRaw);
  return '<select id="'+domId+'">'
    + '<option value="" disabled'+(cur?'':' selected')+'>'+t('merchant.settings.industryPh','请选择')+'</option>'
    + INDUSTRIES.map(function(id){ return '<option value="'+id+'"'+(cur===id?' selected':'')+'>'+t('merchant.industry.'+id, id)+'</option>'; }).join('')
    + '</select>';
}

/* ── Routing ── */
function go(page, data) {
  state.page = page;
  if (data) Object.assign(state, data);
  state.msg = null;
  // 进入任务表单时懒加载额度（不在 render 时触发，避免重渲清空输入）
  if (page === 'task_create' || page === 'task_edit') {
    if (!brandBalance) loadBrandWallet();
  }
  render();
}

function render() {
  var root = document.getElementById('root');
  if (!state.user) { root.innerHTML = loginPage(); bindLogin(); return; }
  if (state.showActivate) { root.innerHTML = activateBrandPage(); return; }
  if (state.showOnboardFlow) { root.innerHTML = onboardFlowPage(); return; }
  root.innerHTML = layout(pageContent());
  bindNav();
  bindPage();
}

function layout(inner) {
  var sm = state.dashStats?.summary||{}; var pending = (sm.pendingApplicants||0)+(sm.pendingSubmissions||0);
  var nav = [
    { id:'dashboard', icon:'📊', label:t('merchant.nav.dashboard','概览') },
    { id:'tasks', icon:'📋', label:t('merchant.nav.tasks','任务管理') },
    { id:'reviews', icon:'✅', label:t('merchant.nav.reviews','审核中心'), badge: pending },
    { id:'wallet', icon:'💰', label:t('merchant.nav.wallet','钱包充值') },
    { id:'csv', icon:'📤', label:t('merchant.nav.csv','数据上传') },
    { id:'settings', icon:'⚙️', label:t('merchant.nav.settings','账户设置') },
  ];
  var sb = '<div class="sidebar" id="sidebar">';
  sb += '<div class="sb-logo"><div style="display:flex;align-items:center;gap:9px"><img src="Logo/herix-orig-icon.png" style="width:30px;height:30px;border-radius:7px;flex-shrink:0"><div>Herix<div style="font-size:10px;color:rgba(255,255,255,.4);font-weight:400;margin-top:1px;letter-spacing:0">'+t('merchant.sidebar.subtitle','商家后台')+'</div></div></div></div>';
  sb += Sidebar.navItems(nav, { activeId: state.page, onclick: "nav('%s')" });
  sb += '<div class="sb-bottom"><div class="sb-user">'+esc(state.user.nickname)+'<br><span style="font-size:10px">'+(state.brandProfile&&state.brandProfile.is_agency?'📢 '+t('merchant.wizard.identityAgency','广告代理'):t('merchant.wizard.identityBrand','品牌方'))+'</span></div>';
  var linked = state.brandProfile?.linkedAccount;
  if (linked) {
    var linkedRoleLabel = (linked.roles||[]).includes('HERALD') ? t('merchant.role.herald','赫使') : t('merchant.role.brand','商家');
    sb += '<div class="sb-logout" onclick="switchAccount()" style="margin-bottom:4px">🔁 '+t('merchant.sidebar.switchTo','切换到{name}（{role}）',{name:esc(linked.nickname),role:linkedRoleLabel})+'</div>';
  }
  var userRoles = (state.user && state.user.roles) || [state.user && state.user.role];
  if (userRoles.includes('HERALD')) {
    sb += '<div class="sb-logout" onclick="switchToHerald()" style="margin-bottom:4px">⇄ '+t('merchant.sidebar.switchHerald','切换赫使模式')+'</div>';
  }
  sb += '<div class="sb-logout" onclick="logout()">'+t('merchant.sidebar.logout','退出登录')+'</div></div></div>';

  var main = '<div class="main"><div class="topbar">';
  main += '<div style="display:flex;align-items:center;gap:12px"><button class="hamburger" onclick="toggleSidebar()">☰</button>';
  main += '<div class="page-title" id="page-title">'+getPageTitle()+'</div></div>';
  main += '<div class="topbar-right" style="display:flex;align-items:center;gap:8px">'+langSwitcherHTML()+notifBellHTML()+topbarActions()+'</div></div>';
  if (state.msg) main += '<div style="padding:0 28px;margin-top:16px"><div class="alert alert-'+state.msgType+'">'+esc(state.msg)+'</div></div>';
  main += '<div class="content">'+inner+'</div></div>';

  return '<div class="layout">'+sb+main+'</div><div class="overlay" id="overlay" onclick="toggleSidebar()"></div>';
}

function getPageTitle() {
  var m = {
    dashboard: t('merchant.nav.dashboard','概览'),
    tasks: t('merchant.nav.tasks','任务管理'),
    reviews: t('merchant.nav.reviews','审核中心'),
    wallet: t('merchant.nav.wallet','钱包充值'),
    csv: t('merchant.nav.csv','数据上传'),
    settings: t('merchant.nav.settings','账户设置'),
    task_detail: t('merchant.pageTitle.taskDetail','任务详情'),
    task_create: t('merchant.pageTitle.taskCreate','创建任务'),
    task_edit: t('merchant.pageTitle.taskEdit','编辑任务'),
    task_meta_edit: t('merchant.pageTitle.taskEdit','编辑任务'),
  };
  return m[state.page] || '';
}

function topbarActions() {
  if (state.page === 'tasks') return '<button class="btn btn-primary btn-sm" onclick="go(\'task_create\')">+ '+t('merchant.tasks.create','创建任务')+'</button>';
  if (state.page === 'task_detail' && state.currentTask) {
    var task = state.currentTask;
    var btns = '<button class="btn btn-outline btn-sm" onclick="go(\'tasks\')">← '+t('common.back','返回')+'</button>';
    if (task.status === 'DRAFT') btns += ' <button class="btn btn-primary btn-sm" onclick="publishTask(\''+task.id+'\')">'+t('merchant.taskDetail.publishTask','发布任务')+'</button>';
    if (task.status === 'OPEN' || task.status === 'IN_PROGRESS') {
      btns += ' <button class="btn btn-outline btn-sm" onclick="editTaskMeta()">'+t('merchant.taskDetail.edit','编辑')+'</button>';
      if (task.status === 'OPEN') btns += ' <button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="closeTask(\''+task.id+'\')">'+t('merchant.topbar.closeTask','关闭任务')+'</button>';
    }
    return btns;
  }
  if (state.page === 'task_create' || state.page === 'task_edit' || state.page === 'task_meta_edit') return '<button class="btn btn-outline btn-sm" onclick="go(\'task_detail\')">'+t('common.cancel','取消')+'</button>';
  return '';
}

function pageContent() {
  switch(state.page) {
    case 'dashboard':   return dashPage();
    case 'tasks':       return tasksPage();
    case 'task_detail': return taskDetailPage();
    case 'partner_task_detail': return partnerTaskPage();
    case 'task_create': taskPlatformReqs=[]; taskReqMode='ALL'; taskReqMinCount=1; return taskFormPage(null);
    case 'task_edit':   taskPlatformReqs=[]; taskReqMode='ALL'; taskReqMinCount=1; return taskFormPage(state.editingTask);
    case 'task_meta_edit': taskPlatformReqs=[]; taskReqMode='ALL'; taskReqMinCount=1; return taskMetaEditPage();
    case 'reviews':     return reviewsPage();
    case 'wallet':      return walletPage();
    case 'csv':         return csvPage();
    case 'settings':    return settingsPage();
    default: return dashPage();
  }
}

/* ── Login ── */
function loginPage() {
  var isReg = state.authMode === 'register';
  return '<div class="login-wrap"><div class="login-card">'
    +'<div style="display:flex;justify-content:flex-end;margin-bottom:8px">'+langSwitcherHTML()+'</div>'
    +'<div class="login-logo"><img src="Logo/herix-orig-icon.png" style="width:52px;height:52px;border-radius:13px;display:block;margin:0 auto 8px">Herix</div>'
    +'<div class="login-sub">'+t('merchant.login.subtitle','商家后台')+'</div>'
    +Auth.loginForm({
      // mode 'both' 渲染注册表单（含邮箱验证码+昵称），'login' 渲染登录表单
      mode: isReg ? 'both' : 'login',
      title: '',
      subtitle: '',
      registerTitle: '',
      registerSubtitle: '',
      emailId: 'email',
      passwordId: 'password',
      emailPlaceholder: 'brand@company.com',
      emailLabel: t('merchant.login.email','邮箱'),
      vcodeLabel: t('merchant.login.vcode','邮箱验证码'),
      nicknameLabel: isReg ? t('merchant.login.nickname','昵称 / 负责人姓名') : null,
      passwordLabel: t('merchant.login.password','密码'),
      passwordPlaceholder: t('merchant.login.password','密码'),
      submitText: t('merchant.login.submit','登录'),
      registerSubmitText: t('merchant.login.registerSubmit','注册并开始入驻'),
      fieldClass: 'field field-lg',
      titleClass: '',
      subtitleClass: '',

function bindLogin() {
  // 登录/注册共用的入口处理：没有 BRAND 角色的账号（新注册的、或赫使账号）
  // 不再拒之门外，而是直接进入入驻向导（向导内部会 add-role BRAND + 品牌入驻）——
  // 这是 HP「品牌/广告代理入驻」按钮和本页注册的统一归宿（2026-07-18 打通，
  // 此前 showActivate 从未被置 true，整个向导是不可达代码）
  function handleAuthed(d) {
    state.token = d.token; state.user = d.user;
    var uRoles = d.user.roles || [d.user.role];
    if (!uRoles.includes('BRAND') || !d.user.brand_onboarded) {
      state.showActivate = true;
      state.activateStep = 1;
      render();
      return;
    }
    state.msg = t('merchant.login.success','登录成功'); state.msgType = 'success';
    loadDashStats(); loadMyTasks(); loadBrandProfile();
    handleBrandBindFromUrl();  // 品牌方绑定邀请链接（?bind_task=&bind_token=）
    loadNotifications();
    setInterval(loadNotifications, 60000);  // 每分钟轮询一次
  }
  Auth.init({
    api: API + '/auth',
    onLogin: handleAuthed,
    onRegister: handleAuthed,
    onError: function(msg) {
      var el=document.getElementById('auth-form-err');
      if(el)el.innerHTML='<div class="alert alert-error">'+esc(msg)+'</div>';
    }
  });
}

function doActivateBrand() {
  var checked = (document.getElementById('agree-checkbox')||{}).checked;
  var errEl = document.getElementById('act-err');
  if (!checked) {
    if (errEl) errEl.innerHTML = '<div class="alert alert-error">'+t('merchant.wizard.errAgreeRequired','请先勾选同意服务协议')+'</div>';
    return;
  }
  var data = Object.assign({}, state.activateData||{}, { agreedToTerms: true });

  // Step 1: 添加 BRAND 角色
  patch('POST', '/users/add-role', { role: 'BRAND' }, function(d) {
    if (d.error && d.error.indexOf('已拥有') === -1) {
      if (errEl) errEl.innerHTML = '<div class="alert alert-error">'+esc(d.error)+'</div>';
      return;
    }
    if (d.token) state.token = d.token;

    // Step 2: 完成品牌入驻
    patch('POST', '/users/brand/onboard', data, function(d2) {
      if (d2.error) {
        if (errEl) errEl.innerHTML = '<div class="alert alert-error">'+esc(d2.error)+'</div>';
        return;
      }
      state.showActivate = false;
      state.activateStep = 1;
      state.activateData = null;
      // 账号设置完成，紧接引导创建第一个任务（可跳过；见 onboardFlowPage）
      state.showOnboardFlow = true;
      state.page = 'dashboard';
      taskPlatformReqs = []; taskReqMode = 'ALL'; taskReqMinCount = 1; // 同 case 'task_create' 的初始化
      if (!brandBalance) loadBrandWallet(); // saveTask() 的额度预检需要
      render();
      loadDashStats();
      loadBrandProfile();
    });
  });
}

function cancelActivate() {
  state.showActivate = false;

/* ── 品牌方绑定：品牌凭上传链接 token 自助绑定（多账号）；代理逐个解绑 ── */
function unbindBrand(taskId, userId, name) {
  if (!confirm(t('merchant.taskDetail.unbindConfirm','确认解绑品牌账号「{name}」？解绑后该账号将无法查看任务进展，可重新绑定',{name:name||''}))) return;
  post('/tasks/'+taskId+'/brand-unbind', { userId: userId }, function(d) {
    if (d.error) { alert(d.error); return; }
    showMsg(t('merchant.taskDetail.unbound','已解绑'), 'success');
    openTask(taskId);
  });
}

function handleBrandBindFromUrl() {
  var p = new URLSearchParams(window.location.search);
  var bt = p.get('bind_task'), tk = p.get('bind_token');
  if (!bt || !tk) return;
  if (!state.token) return; // 未登录：登录成功后由调用方再触发
  post('/tasks/'+bt+'/brand-bind', { token: tk }, function(d) {
    // 无论成败都清掉 URL 参数，防止重复触发
    window.history.replaceState({}, '', window.location.pathname);
    if (d.error) { alert(t('merchant.bind.failed','绑定失败：')+d.error); return; }
    showMsg(t('merchant.bind.success','已绑定任务「{title}」，可在任务列表查看进展',{title:d.title||''}), 'success');
    loadMyTasks();
  });
}

function tierBadge(tierSnapshot) {
  if (!tierSnapshot) return '';
  try {
    var snap = typeof tierSnapshot === 'string' ? JSON.parse(tierSnapshot) : tierSnapshot;
    return Object.keys(snap).map(function(pid) {
      var p = platformById(pid);
      return '<span style="font-size:10px;background:#f0f4ff;color:#4f6ef7;border-radius:4px;padding:1px 6px;margin-right:3px">'
        + p.icon + ' ' + snap[pid] + '</span>';
    }).join('');
  } catch(e) { return ''; }
}

function ratingBadge(completedTasks, goodRate) {
  if (!completedTasks || completedTasks < 3) return '<span style="font-size:10px;color:var(--muted)">'+t('merchant.reviews.unrated','未评级')+'</span>';
  var rate = Number(goodRate) || 0;
  var level = 'Bronze';
  if (completedTasks >= 50 && rate >= 0.95) level = 'Platinum';
  else if (completedTasks >= 25 && rate >= 0.85) level = 'Gold';
  else if (completedTasks >= 10 && rate >= 0.75) level = 'Silver';
  var colors = {Bronze:'#cd7f32',Silver:'#9ca3af',Gold:'#f59e0b',Platinum:'#7c3aed'};
  return '<span style="font-size:10px;font-weight:600;color:'+colors[level]+'">⭐ '+level+'</span>'
    + '<span style="font-size:10px;color:var(--muted);margin-left:4px">'+t('merchant.panel.ratingStats','{n}单 好评{pct}%',{n:completedTasks,pct:Math.round(rate*100)})+'</span>';
}

function toggleCodeMode() {

function toggleCodeModeSection() {
  var mode = document.getElementById('mode')?.value;
  var codeSection = document.getElementById('code-mode-section');
  var dataModeSection = document.getElementById('data-mode-section');
  var ctField = document.getElementById('contentType-field');
  if (codeSection) codeSection.style.display = (mode === 'PERFORMANCE') ? 'block' : 'none';
  if (dataModeSection) dataModeSection.style.display = (mode === 'PERFORMANCE') ? 'block' : 'none';

function uploadCustomCodes(taskId) {
  var raw = (document.getElementById('custom-codes-input') || {}).value || '';
  var codes = raw.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
  if (!codes.length) { alert(t('merchant.codes.errAtLeastOne','请输入至少一个推广码')); return; }
  var resultEl = document.getElementById('upload-result');
  patch('POST', '/tasks/' + taskId + '/codes/upload', { codes: codes }, function(d) {
    if (d.error) {
      if (resultEl) resultEl.innerHTML = '<div class="alert alert-error">'+esc(d.error)+'</div>';
      return;
    }
    if (resultEl) resultEl.innerHTML = '<div class="alert alert-success">'+t('merchant.codes.uploaded','已上传 {n} 个推广码',{n:d.added})+(d.skipped?' '+t('merchant.codes.skipped','（{n} 个重复跳过）',{n:d.skipped}):'')+'</div>';
    var input = document.getElementById('custom-codes-input');
    if (input) input.value = '';
    // 刷新码池
    get('/tasks/'+taskId+'/codes', function(pool) { state.codePool = pool; render(); });
  });
}

function downloadCodes(taskId) {
  var url = API + '/tasks/' + taskId + '/codes/export';
  fetch(url, { headers: { Authorization: 'Bearer ' + state.token } })
    .then(function(r) { return r.blob(); })
    .then(function(b) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'herix_promo_codes.csv';
      a.click();
    });
}

function attachAuthHeader(el, url) {
  // 因为浏览器 <a> 无法带 Authorization header，改用 fetch 下载
  event.preventDefault();
  fetch(url, {headers:{Authorization:'Bearer '+state.token}})
    .then(function(r){return r.blob()})
    .then(function(b){
      var a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='herix_codes.csv';
      a.click();
    });
}

function platformReqsFormHTML(task) {
  // 初始化：若是编辑模式，从任务数据加载
  if(task && task.platform_requirements && taskPlatformReqs.length === 0){
    try{ taskPlatformReqs = JSON.parse(task.platform_requirements); }catch(e){}
    taskReqMode = task.req_mode === 'ANY_N' ? 'ANY_N' : 'ALL';
    taskReqMinCount = Math.max(1, parseInt(task.req_min_count,10) || 1);
  }
  var h = '<div class="field form-full" data-plat-reqs="1"><label>'+t('merchant.form.platformReqs','赫使社交平台要求')+' <span style="font-weight:400;font-size:11px;color:var(--muted)">'+t('merchant.form.optional','（选填）')+'</span></label>';
  h += '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">'+t('merchant.form.platformReqsHint','选择赫使必须拥有的社交账号及最低粉丝要求')+'</div>';
  h += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">';
  for(var i=0;i<PLATFORM_REGISTRY.length;i++){
    var p=PLATFORM_REGISTRY[i];
    var selected = taskPlatformReqs.some(function(r){return r.platformId===p.id});
    h += '<div class="ob-chip'+(selected?' ob-chip-sel':'')+'" style="cursor:pointer" onclick="togglePlatformReq(\''+p.id+'\')">'+p.icon+' '+p.name+'</div>';
  }
  h += '</div>';
  // 已选平台：显示最低粉丝数输入
  for(var j=0;j<taskPlatformReqs.length;j++){
    var req=taskPlatformReqs[j];
    var pInfo=PLATFORM_REGISTRY.find(function(p){return p.id===req.platformId})||{icon:'🔗',name:req.platformId};
    h += '<div style="display:flex;align-items:center;gap:8px;padding:8px;background:#f9fafb;border-radius:8px;margin-bottom:6px">';
    h += '<span style="font-size:15px">'+pInfo.icon+'</span><span style="font-weight:500;font-size:12px;min-width:64px">'+pInfo.name+'</span>';
    h += '<span style="font-size:11px;color:var(--muted)">'+t('merchant.form.minFollowers','最低粉丝数')+'</span>';
    h += '<input type="number" value="'+(req.minFollowers||'')+'" min="0" placeholder="'+t('merchant.form.noLimit','不限')+'" style="width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px" onchange="updatePlatformReqFollowers(\''+req.platformId+'\',this.value)">';
    // ANY_N 模式下单项"必须"标志被忽略，不展示避免误导
    if(taskReqMode !== 'ANY_N'){
      h += '<label style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-left:auto"><input type="checkbox"'+(req.required?' checked':'')+' onchange="updatePlatformReqRequired(\''+req.platformId+'\',this.checked)"> '+t('merchant.form.required','必须')+'</label>';
    }
    h += '</div>';
  }
  // 满足模式：≥2 项时才有意义
  if(taskPlatformReqs.length >= 2){
    h += '<div style="display:flex;align-items:center;gap:14px;padding:8px;background:#f0f7ff;border-radius:8px;margin-top:4px;font-size:12px">';
    h += '<span style="font-weight:600;color:var(--text)">'+t('merchant.form.matchMode','满足方式')+'</span>';
    h += '<label style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="radio" name="req-mode"'+(taskReqMode==='ALL'?' checked':'')+' onchange="setReqMode(\'ALL\')"> '+t('merchant.form.matchAll','全部"必须"项都满足')+'</label>';
    h += '<label style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="radio" name="req-mode"'+(taskReqMode==='ANY_N'?' checked':'')+' onchange="setReqMode(\'ANY_N\')"> '+t('merchant.form.matchAny','满足任意')+'';
    h += ' <input type="number" value="'+taskReqMinCount+'" min="1" max="'+taskPlatformReqs.length+'"'+(taskReqMode!=='ANY_N'?' disabled':'')+' style="width:44px;padding:2px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px" onchange="setReqMinCount(this.value)"> '+t('merchant.form.matchAnySuffix','项即可')+'</label>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function setReqMode(mode){
  taskReqMode = mode;
  if(mode === 'ANY_N' && taskReqMinCount > taskPlatformReqs.length) taskReqMinCount = taskPlatformReqs.length;
  rerenderPlatformReqs();
}

function setReqMinCount(val){
  var n = parseInt(val,10) || 1;
  taskReqMinCount = Math.min(Math.max(1, n), Math.max(1, taskPlatformReqs.length));
  rerenderPlatformReqs();
}

function rerenderPlatformReqs(){
  var reqSection = document.querySelector('[data-plat-reqs]');
  if(!reqSection) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = platformReqsFormHTML(null);
  var newEl = tmp.firstElementChild;
  if(newEl) reqSection.replaceWith(newEl);
}

function togglePlatformReq(platformId){
  var idx = taskPlatformReqs.findIndex(function(r){return r.platformId===platformId});
  if(idx>=0){ taskPlatformReqs.splice(idx,1); }
  else { taskPlatformReqs.push({platformId:platformId,minFollowers:null,required:true}); }
  var reqSection = document.querySelector('[data-plat-reqs]');
  if(!reqSection) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = platformReqsFormHTML(null);
  var newEl = tmp.firstElementChild;
  if(newEl) reqSection.replaceWith(newEl);
}

function updatePlatformReqFollowers(platformId, val){
  var req = taskPlatformReqs.find(function(r){return r.platformId===platformId});
  if(req) req.minFollowers = val ? parseInt(val,10) : null;
}

function updatePlatformReqRequired(platformId, checked){
  var req = taskPlatformReqs.find(function(r){return r.platformId===platformId});
  if(req) req.required = checked;
}

function reviewRow(id, type, info) {
  // Meta chips (second line)

  if (info.rating) meta.push(info.rating);
  if (info.sub) meta.push('<span style="color:#9ca3af;font-size:11px">'+esc(info.sub)+'</span>');
  if (info.preview) meta.push('<span style="color:#6b7280;font-size:11px">'+esc(info.preview.slice(0,50))+(info.preview.length>50?'…':'')+'</span>');
  if (info.contentUrl) meta.push('<a href="'+esc(info.contentUrl)+'" target="_blank" style="color:#6366f1;font-size:11px;text-decoration:none">🔗 '+t('merchant.reviews.viewContent','查看内容')+'</a>');

  var taskLabel = info.taskTitle
    ? ' <span style="font-weight:400;color:#9ca3af;font-size:13px">· '+esc(info.taskTitle)+(info.taskId?'<button onclick="event.stopPropagation();openTask(\''+info.taskId+'\')" style="font-size:10px;color:#c4b5fd;background:none;border:none;cursor:pointer;padding:0 2px;vertical-align:middle">↗</button>':'')+'</span>'
    : '';

  return '<div style="padding:14px 16px;border-bottom:1px solid var(--border)">'
    +'<div style="display:flex;align-items:flex-start;gap:10px">'
    +'<div class="av" style="width:36px;height:36px;font-size:14px;flex-shrink:0;margin-top:1px">'+info.initials+'</div>'
    +'<div style="flex:1;min-width:0">'
    // Name + task
    +'<div style="font-size:14px;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(info.name)+taskLabel+'</div>'
    // Meta chips
    +(meta.length ? '<div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:3px">'+meta.join('<span style="color:#e5e7eb;font-size:10px;margin:0 1px">|</span>')+'</div>' : '')
    // Note textarea (always visible)
    +'<textarea id="rv-note-'+id+'" rows="1" placeholder="'+t('merchant.reviews.notePlaceholder','备注 · 拒绝时请说明原因，帮助赫使了解改进方向')+'" style="width:100%;margin-top:10px;border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.5;box-sizing:border-box;resize:none;display:block;font-family:inherit;outline:none;color:#374151;transition:border-color 0.15s" onfocus="this.rows=3;this.style.borderColor=\'#818cf8\'" onblur="if(!this.value)this.rows=1;this.style.borderColor=\'#e5e7eb\'"></textarea>'
    +'</div>'
    // Action buttons
    +'<div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;margin-left:10px">'
    +'<button onclick="submitReview(\''+id+'\',\''+type+'\',\'APPROVED\')" style="padding:6px 16px;border:none;border-radius:7px;background:#16a34a;color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">'+t('merchant.reviews.approve','通过')+'</button>'
    +'<button onclick="submitReview(\''+id+'\',\''+type+'\',\'REJECTED\')" style="padding:6px 14px;border:1.5px solid #fca5a5;border-radius:7px;background:transparent;color:#dc2626;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">'+t('merchant.reviews.reject','拒绝')+'</button>'
    +'</div>'
    +'</div>'
    +'</div>';
}

function allAppsPanel(apps) {
  if (!apps.length) return '<div class="empty"><div class="empty-icon">✅</div>'+t('merchant.reviews.emptyApps','暂无待审报名')+'</div>';
  return '<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden">'
    + apps.map(function(a) {
    var sub = [];
    if (a.display_name && a.display_name !== a.nickname) sub.push(a.display_name);
    if (a.country) sub.push(a.country);
    return reviewRow(a.id, 'app', {
      initials: (a.nickname||'?')[0].toUpperCase(),
      name: a.nickname || '—',
      sub: sub.join(' · '),
      taskTitle: a.task_title,
      taskId: a.task_id,
      tiers: tierBadge(a.tier_snapshot),
      rating: ratingBadge(a.completed_tasks, a.good_rate),
      preview: a.message,
    });
  }).join('')+'</div>';
}

function allSubsPanel(subs) {
  if (!subs.length) return '<div class="empty"><div class="empty-icon">✅</div>'+t('merchant.reviews.emptySubs','暂无待审内容')+'</div>';
  return '<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden">'
    + subs.map(function(s) {
    var name = s.nickname || s.display_name || (s.herald_id||'').slice(0,8) || '—';
    return reviewRow(s.id, 'sub', {
      initials: name[0].toUpperCase(),
      name: name,
      sub: s.submitted_at ? fmtLocal(s.submitted_at).slice(0,10) : '',
      taskTitle: s.task_title,
      taskId: null,
      tiers: '', rating: '',
      preview: s.description,
      contentUrl: s.content_url,
    });
  }).join('')+'</div>';
}

function submitReview(id, type, action) {
  var ta = document.getElementById('rv-note-' + id);
  var note = ta ? ta.value.trim() : '';
  if (action === 'REJECTED' && !note) {
    if (ta) {
      ta.style.borderColor = '#dc2626';
      ta.rows = 3;
      ta.placeholder = t('merchant.panel.rejectNotePh','请填写原因，帮助赫使了解如何改进内容');
      ta.focus();
    }
    return;
  }
  if (type === 'app') reviewApp(id, action, true, note);
  else reviewSub(id, action, true, note);
}

          +(isBlocked ? '<button class="btn btn-primary btn-sm" style="margin-top:8px;font-size:11px" onclick="event.stopPropagation();nav(\'wallet\')">去充值 →</button>' : '')

  setTimeout(function(){
    document.addEventListener('click', function close(e){
      if(!el.contains(e.target)&&e.target.id!=='notif-bell'){el.remove();document.removeEventListener('click',close);}
    });
  }, 50);
}

function readNotif(id) {
  api('PATCH', '/notifications/'+id+'/read', {}, function(){
    if (notifData) {
      notifData.notifications.forEach(function(n){ if(n.id===id) n.is_read=1; });
      notifData.unread = Math.max(0, notifData.unread-1);
    }
    var bell = document.getElementById('notif-bell');
    if (bell) bell.outerHTML = notifBellHTML();
    var panel = document.getElementById('notif-panel');
    if (panel) { notifOpen=false; toggleNotifPanel(); }
  });
}

function markAllRead() {
  api('PATCH', '/notifications/read-all?role=BRAND', {}, function(){
    if (notifData) { notifData.notifications.forEach(function(n){n.is_read=1;}); notifData.unread=0; }
    var bell = document.getElementById('notif-bell');
    if (bell) bell.outerHTML = notifBellHTML();
    var panel = document.getElementById('notif-panel');
    if (panel) { notifOpen=false; toggleNotifPanel(); }
  });
}


/* 时间统一本地化显示：库里有两种存法——Node 写的 ISO UTC(带T/Z)、
   PG 列默认值写的无时区裸串(服务器时区，生产 ECS 固定+08)。
   都转成浏览器本地时间；纯日期(长度<=10)不做时区换算。 */
function fmtLocal(s) {
  if (!s) return '';
  s = String(s);
  if (s.length <= 10) return s;
  var d = s.indexOf('T') >= 0 ? new Date(s) : new Date(s.replace(' ', 'T') + '+08:00');
  if (isNaN(d.getTime())) return s.slice(0, 16).replace('T', ' ');
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function timeAgo(iso) {
  var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return t('merchant.time.justNow','刚刚');
  if (diff < 3600) return t('merchant.time.minAgo','{n}分钟前',{n:Math.floor(diff/60)});
  if (diff < 86400) return t('merchant.time.hourAgo','{n}小时前',{n:Math.floor(diff/3600)});
  return t('merchant.time.dayAgo','{n}天前',{n:Math.floor(diff/86400)});
}

    all: t('merchant.wallet.periodAll','全部'),
  };

function walletPeriodRange(period) {
  var now = new Date();
  var from, to = now;
  if (period === 'last_month') {
    from = new Date(now.getFullYear(), now.getMonth()-1, 1);
    to = new Date(now.getFullYear(), now.getMonth(), 1);
  } else if (period === '7d') {
    from = new Date(now.getTime() - 7*86400000);
  } else if (period === '30d') {
    from = new Date(now.getTime() - 30*86400000);
  } else if (period === 'all') {
    from = new Date('1970-01-01');
  } else { // month
    from = new Date(now.getFullYear(), now.getMonth(), 1);
  }
  return { from: from.toISOString(), to: to.toISOString() };
}

  if (!payout || !mh) { meter.innerHTML = ''; return; }

  var rate = (state.brandProfile && state.brandProfile.commission_rate) || 0.15;
  var cost  = Math.round(payout / (1 - rate));
  var fee   = cost - payout;
  var total = cost * mh;
  var isPerformance = ((document.getElementById('mode')||{}).value) === 'PERFORMANCE';

  // 额度数据（成果报酬任务按转化付费，无法预估总支出，不做额度预检）
  var c        = brandBalance && brandBalance.credit;
  var capacity = !isPerformance ? (c ? c.totalCapacity : (brandBalance ? brandBalance.available : null)) : null;
  var over     = capacity !== null && total > capacity;
  var barColor = over ? '#dc2626' : '#16a34a';

  var h = '<div style="background:'+(over?'#fef2f2':'#f8fafc')+';border:1px solid '+(over?'#fca5a5':'#e2e8f0')
    +';border-radius:10px;padding:14px 16px;margin-bottom:12px">';

  // 三栏：任务报酬 / 平台服务费 / 任务总支出
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:'+(capacity!==null?'10px':'0')+';">';
  h += '<div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">'+t('merchant.form.costPayout','任务报酬')+'</div>'
    +'<div style="font-size:18px;font-weight:700;color:#16a34a">¥'+Number(payout).toLocaleString()+'</div>'
    +'<div style="font-size:10px;color:var(--muted)">'+t('merchant.form.costPayoutSub','赫使到手 / 人')+'</div></div>';
  h += '<div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">'+t('merchant.form.costFee','平台服务费')+'</div>'
    +'<div style="font-size:18px;font-weight:700;color:#6b7280">¥'+Number(fee).toLocaleString()+'</div>'
    +'<div style="font-size:10px;color:var(--muted)">'+(rate*100).toFixed(0)+'% / 人</div></div>';
  h += '<div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">'+t('merchant.form.costTotal','任务总支出')+'</div>'
    +'<div style="font-size:18px;font-weight:700;color:'+(over?'#dc2626':'var(--text)')+'">¥'+Number(total).toLocaleString()+'</div>'
    +'<div style="font-size:10px;color:var(--muted)">¥'+Number(cost).toLocaleString()+' × '+mh+' '+t('merchant.unit.person','人')+'</div></div>';
  h += '</div>';

  // 额度占用（仅公开任务 + 有额度数据时显示）
  if (capacity !== null && taskCap > 0) {
    var pct = Math.min(100, Math.round(total / taskCap * 100));
    h += '<div style="height:4px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-bottom:4px">'
      +'<div style="height:100%;width:'+pct+'%;background:'+barColor+';border-radius:3px;transition:width .25s"></div></div>';
    h += '<div style="display:flex;justify-content:space-between;align-items:center">';
    if (over) {
      h += '<span style="font-size:11px;color:#dc2626;font-weight:500">⚠ '+t('merchant.form.overCapacity','超出可发额度，需充值 ¥{n}',{n:Math.round(total-capacity).toLocaleString()})+'</span>'
        +'<span onclick="nav(\'wallet\')" style="font-size:11px;font-weight:600;color:#dc2626;cursor:pointer;text-decoration:underline">'+t('merchant.form.goTopup','去充值')+' →</span>';
    } else {
      h += '<span style="font-size:11px;color:var(--muted)">'+t('merchant.form.capacityUsage','额度占用 {pct}%',{pct:pct})+'</span>'
        +'<span style="font-size:11px;color:var(--muted)">'+t('merchant.form.remainAfterPublish','发布后剩余 ¥{n}',{n:Math.round(capacity-total).toLocaleString()})+'</span>';
    }
    h += '</div>';
  }

  h += '</div>';
  meter.innerHTML = h;
}

/** 表单内联错误（替代 alert） */
function showFormError(msg) {
  var el = document.getElementById('task-form-error');
  if (!el) return;
  if (msg) {

/** 任务管理页顶部额度汇总 */
function taskCapacitySummary() {
  if (!brandBalance) return '<div style="height:72px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px">'+t('merchant.credit.loading','加载额度信息...')+'</div>';
  var b      = brandBalance;
  var c      = b.credit || {};
  var avail  = b.available || 0;
  var frozen = b.frozen    || 0;
  var credit = c.initialCredit || 0;   // 信用额度上限
  var cUsed  = c.creditUsed   || 0;   // 活跃信用任务占用
  // 单笔最高可发 = max(钱包余额, 信用剩余)
  var cRemaining = c.creditRemaining != null ? c.creditRemaining : Math.max(0, credit - cUsed);
  var taskCap    = Math.max(avail, cRemaining);
  var remaining  = taskCap;
  var isFastPayout = c.fastPayoutEligible;
  var fpThresh    = c.fastPayoutThreshold || 100000;

  // 进度条：信用已占用 / 信用额度上限
  var pct      = credit > 0 ? Math.min(100, Math.round(cUsed / credit * 100)) : 0;
  var barColor = pct >= 90 ? '#dc2626' : pct >= 60 ? '#f59e0b' : '#22c55e';

  function stat(label, val, color) {
    return '<div><div style="font-size:11px;color:var(--muted);margin-bottom:3px">'+label+'</div>'
      +'<div style="font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:'+color+'">¥'+Number(val).toLocaleString()+'</div></div>';
  }
  function sep(sym) {
    return '<div style="font-size:11px;color:var(--muted);align-self:center;padding:0 3px;white-space:nowrap">'+sym+'</div>';
  }
  function vline() {
    return '<div style="width:1px;background:var(--border);align-self:stretch;margin:2px 0"></div>';
  }

  var leftStats = '<div style="display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;flex:1">';
  if (credit > 0) {
    leftStats += stat(t('merchant.credit.walletBalance','钱包余额'), avail, 'var(--text)');
    leftStats += vline();
    leftStats += stat(t('merchant.credit.creditRemaining','信用剩余'), cRemaining, cRemaining <= 0 ? '#dc2626' : '#1d4ed8');
    leftStats += sep('→');
    leftStats += stat(t('merchant.credit.maxSingle','单笔最高可发'), remaining, remaining <= 0 ? '#dc2626' : '#16a34a');
    if (frozen > 0) { leftStats += vline(); leftStats += stat(t('merchant.credit.frozenByTasks','任务冻结'), frozen, '#f59e0b'); }
  } else {
    leftStats += stat(t('merchant.wallet.available','可用余额'), avail, avail < 0 ? '#dc2626' : 'var(--text)');
    if (frozen > 0) { leftStats += vline(); leftStats += stat(t('merchant.credit.frozenByTasks','任务冻结'), frozen, '#f59e0b'); }
    leftStats += sep('=');
    leftStats += stat(t('merchant.credit.taskCapacity','可发任务额度'), Math.max(0, avail), avail <= 0 ? '#dc2626' : '#1d4ed8');
  }
  leftStats += '</div>';

  var rightEl = isFastPayout
    ? '<div style="align-self:center;text-align:center">'
        +'<span style="display:block;font-size:12px;font-weight:600;color:#0369a1;background:#e0f2fe;border-radius:6px;padding:4px 10px;white-space:nowrap;margin-bottom:4px">⚡ '+t('merchant.tasks.fastPayout','极速打款')+'</span>'
        +'<button class="btn btn-outline btn-sm" onclick="nav(\'wallet\')">'+t('merchant.credit.topupShort','充值')+'</button>'
      +'</div>'
    : '<div style="align-self:center;text-align:center">'
        +'<button class="btn btn-primary btn-sm" style="white-space:nowrap;display:block;margin-bottom:4px" onclick="nav(\'wallet\')">'+t('merchant.credit.topupShort','充值')+' →</button>'
        +'<div style="font-size:10px;color:var(--muted)">'+t('merchant.credit.fpThreshold','余额≥¥{n}开启⚡',{n:Number(fpThresh).toLocaleString()})+'</div>'
      +'</div>';

  var border = remaining <= 0 ? '#fecaca' : credit > 0 ? '#bfdbfe' : 'var(--border)';

  var html = '<div style="background:var(--card-bg);border:1px solid '+border+';border-radius:12px;padding:14px 18px;margin-bottom:16px">'
    +'<div style="display:flex;align-items:stretch;gap:16px">'+leftStats+rightEl+'</div>';

  if (credit > 0) {
    html += '<div style="display:flex;align-items:center;gap:10px;margin-top:10px">'
      +'<div style="flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden">'
      +'<div style="height:100%;width:'+pct+'%;background:'+barColor+';border-radius:2px;transition:width .4s"></div></div>'
      +'<div style="font-size:11px;color:var(--muted);white-space:nowrap">'+t('merchant.credit.limitUsage','信用额度 ¥{limit} · 已占用 {pct}%',{limit:Number(credit).toLocaleString(),pct:pct})
      +(remaining<=0?' · <span style="color:#dc2626;font-weight:600">'+t('merchant.credit.exhausted','额度已耗尽，请充值')+'</span>':'')+'</div>'
      +'</div>';
  }

  html += '</div>';
  return html;
}

function topupWizardHTML() {
  var steps = [t('merchant.topup.stepAmount','选择金额'), t('merchant.topup.stepMethod','支付方式'), t('merchant.topup.stepDetail','付款详情'), t('merchant.topup.stepDone','完成')];
  var h = '';

  // 步骤指示器
  h += '<div style="display:flex;align-items:center;justify-content:center;margin-bottom:32px">';
  for (var i = 0; i < steps.length; i++) {
    var active = (i+1) === topupStep;
    var done   = (i+1) < topupStep;
    var dotBg  = done ? '#16a34a' : active ? 'var(--primary)' : '#e5e7eb';
    var txtClr = active ? 'var(--primary)' : done ? '#16a34a' : '#9ca3af';
    h += '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-width:56px">';
    h += '<div style="width:30px;height:30px;border-radius:50%;background:'+dotBg+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:all .2s">'+(done?'✓':(i+1))+'</div>';
    h += '<div style="font-size:11px;color:'+txtClr+';font-weight:'+(active?'600':'400')+';white-space:nowrap">'+steps[i]+'</div>';

  }
  h += '</div>';

  switch(topupStep) {
    case 1: h += topupStep1(); break;
    case 2: h += topupStep2(); break;
    case 3: h += topupStep3(); break;
    case 4: h += topupStep4(); break;
  }
  return h;
}

// 编辑金额：仅更新变量和按钮状态，不触发整页 render（避免输入框失焦）
function onTopupAmountInput(el) {
  var v = parseFloat(el.value);

  var ok = topupAmount >= 1000;
  var btn = document.getElementById('topup-next-btn');
  var hint = document.getElementById('topup-min-hint');
  if (btn) btn.disabled = !ok;

function uploadBrandAsset(type, input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var msgEl = document.getElementById('assetUploadMsg');
  if (msgEl) msgEl.textContent = t('merchant.upload.uploading','上传中...');
  var fd = new FormData();
  fd.append('file', file);
  var xhr = new XMLHttpRequest();
  xhr.open('POST', API+'/uploads/brand/'+type, true);
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() {
    var d; try { d = JSON.parse(xhr.responseText); } catch(e) { d = {}; }
    if (d.error) { if (msgEl) msgEl.textContent = d.error; return; }
    state.brandProfile = state.brandProfile || {};
    if (type === 'logo') state.brandProfile.logo_url = d.url;
    else state.brandProfile.promo_image_url = d.url;
    if (msgEl) msgEl.textContent = t('merchant.upload.success','上传成功');
    render();
  };
  xhr.onerror = function() { if (msgEl) msgEl.textContent = t('merchant.upload.failed','上传失败'); };
  xhr.send(fd);
}

/* ── API ── */
function api(method, path, body, cb) { patch(method, path, body, cb); }
function get(path, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', API+path, true);
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({}); } };
  xhr.onerror = function() { cb({}); };
  xhr.send();
}
function post(path, body, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open('POST', API+path, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({}); } };
  xhr.onerror = function() { cb({}); };
  xhr.send(JSON.stringify(body));
}
function patch(method, path, body, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, API+path, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  if (state.token) xhr.setRequestHeader('Authorization', 'Bearer '+state.token);
  xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({}); } };
  xhr.onerror = function() { cb({}); };
  xhr.send(JSON.stringify(body));
}

/* ── Actions ── */
function nav(page) {
  state.page = page;
  state.currentTask = null;
  state.msg = null;
  if (page === 'dashboard') loadDashStats();
  if (page === 'tasks') { state.taskFilter = ''; brandBalance = null; loadMyTasks(); loadBrandWallet(); }
  if (page === 'reviews') loadPendingReviews();
  if (page === 'wallet') { brandBalance = null; loadBrandWallet(); }
  if (page === 'task_create' || page === 'task_edit') { if (!brandBalance) loadBrandWallet(); }
  if (page === 'settings') loadBrandProfile();
  closeSidebar();
  render();
}

function loadDashStats() {
  get('/tasks/my/stats', function(d) {
    state.dashStats = d;
    state.tasks = d.tasks || [];
    render();
  });
  // 懒加载余额（仅未加载时触发），供信用状态 banner 使用
  if (!brandBalance) loadBrandWallet();
}

function loadMyTasks() {
  if (!state.user) return;
  get('/tasks/my/stats', function(d) {
    if (d && d.tasks) {
      state.dashStats = d;
      state.tasks = d.tasks;
    }
    state.tasksLoading = false;
    render();
  });
  // 作为品牌方被绑定的任务（只看进展，无金额）
  get('/tasks/partner/mine', function(d) {
    state.partnerTasks = Array.isArray(d) ? d : [];
    render();
  });
}

function loadPendingReviews() {
  state.reviewTab = state.reviewTab || 'apps';
  state.allPendingApps = [];
  state.allPendingSubs = [];
  // 不过滤任务状态：已关闭任务在30天缓冲期内赫使仍可提交，待审内容必须能看到；
  // 且气泡计数(my/stats)本来就不分任务状态，两边口径要一致
  get('/tasks?creator='+state.user.id+'&limit=100', function(d) {
    var tasks = d.tasks || [];
    var remaining = tasks.length;
    if (!remaining) { render(); return; }
    tasks.forEach(function(t) {
      get('/tasks/'+t.id, function(detail) {
        (detail.applications||[]).forEach(function(a) {
          if (a.status==='PENDING') state.allPendingApps.push(Object.assign({}, a, {task_title:t.title, task_id:t.id}));
        });
        remaining--;
        if (!remaining) {
          // load subs
          var subTasks = tasks.slice(); var srem = subTasks.length;
          subTasks.forEach(function(st) {
            get('/submissions/task/'+st.id, function(subs) {
              (subs||[]).forEach(function(s) {
                if (s.status==='PENDING_REVIEW') state.allPendingSubs.push(Object.assign({}, s, {task_title:st.title}));
              });
              srem--;
              if (!srem) render();
            });
          });
        }
      });
    });
    render();
  });
}

function loadBrandProfile() {
  get('/auth/me', function(d) {
    state.brandProfile = d;
    render();
  });
}

function openTask(id) {
  state.page = 'task_detail';
  state.taskTab = 'applicants';
  state.currentTask = null;
  state.taskSubs = [];
  state.taskCodes = [];
  state.codePool = null;
  render();
  get('/tasks/'+id, function(t) {
    state.currentTask = t;
    // load submissions
    get('/submissions/task/'+id, function(subs) {
      state.taskSubs = (subs||[]).map(function(s) {
        var app = (t.applications||[]).find(function(a){return a.herald_id===s.herald_id});
        return Object.assign({}, s, {herald_name: app?app.nickname:s.herald_id.slice(0,8)});
      });
      // load codes if PERFORMANCE
      if (t.mode === 'PERFORMANCE') {
        // 一次请求两用：码池概览 + 逐条明细（原来这里发两次同一请求，且第一处引用了
        // 不存在的变量 codes（应为 pool）——初始 commit 就有的 bug，推广码 tab 恒空；
        // 后端 /codes 现已返回 codes 数组，见 tasks.ts）
        get('/tasks/'+id+'/codes', function(pool) {
          state.codePool = pool;
          state.taskCodes = (pool.codes || []).filter(function(c){ return c.herald_id; });
          render();
        });
      } else {
        render();
      }

/* ── 封面图上传 ── */
var _pendingCoverBlob = null; // 创建任务时暂存压缩后的图

function compressImage(file, maxLong, quality) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(e) {
      var img = new Image();
      img.onerror = reject;
      img.onload = function() {
        var w = img.width, h = img.height;
        var ratio = Math.min(maxLong / Math.max(w, h), 1); // 只缩不放大
        var cw = Math.round(w * ratio), ch = Math.round(h * ratio);
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        canvas.toBlob(function(blob) { resolve(blob); }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function uploadCoverToTask(taskId, blob, onDone) {
  var form = new FormData();
  form.append('file', blob, 'cover.jpg');
  var xhr = new XMLHttpRequest();
  xhr.open('POST', API + '/uploads/task/' + taskId + '/cover', true);
  xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
  xhr.onload = function() {
    try { var d = JSON.parse(xhr.responseText); onDone(d.error || null, d.url); }
    catch(e) { onDone(t('merchant.upload.failed','上传失败')); }
  };
  xhr.onerror = function() { onDone(t('merchant.upload.netError','网络错误')); };
  xhr.send(form);
}

// 创建表单：选文件后预览，暂存到 _pendingCoverBlob
function onCoverFileSelect(input) {
  if (!input.files || !input.files[0]) return;
  var wrap = document.getElementById('cover-upload-wrap');
  var status = document.getElementById('cover-status');
  if (status) status.textContent = t('merchant.upload.compressing','压缩中…');
  compressImage(input.files[0], 1200, 0.82).then(function(blob) {
    _pendingCoverBlob = blob;
    var url = URL.createObjectURL(blob);
    var preview = document.getElementById('cover-preview-img');
    if (preview) { preview.src = url; preview.style.display = 'block'; }
    var ph = document.getElementById('cover-placeholder');
    if (ph) ph.style.display = 'none';
    if (status) status.textContent = t('merchant.upload.selected','已选择（{kb}KB），保存任务后上传',{kb:Math.round(blob.size/1024)});
  }).catch(function() { if (status) status.textContent = t('merchant.upload.readFailedRetry','图片读取失败，请重试'); });
}

// 编辑表单：选文件后直接上传
function onMetaCoverFileSelect(input) {
  if (!input.files || !input.files[0]) return;
  var taskId = state.editingTask && state.editingTask.id;
  if (!taskId) return;
  var status = document.getElementById('meta-cover-status');
  if (status) status.textContent = t('merchant.upload.compressing','压缩中…');
  compressImage(input.files[0], 1200, 0.82).then(function(blob) {
    if (status) status.textContent = t('merchant.upload.uploadingKb','上传中（{kb}KB）…',{kb:Math.round(blob.size/1024)});
    uploadCoverToTask(taskId, blob, function(err, url) {
      if (err) { if (status) status.textContent = t('merchant.upload.failedWith','上传失败：')+err; return; }
      var preview = document.getElementById('meta-cover-preview-img');

      if (status) status.textContent = t('merchant.upload.success','上传成功')+' ✓';

    });
  }).catch(function() { if (status) status.textContent = t('merchant.upload.readFailed','图片读取失败'); });
}

function saveTask(publish) {
  var body = {
    title: (document.getElementById('title')||{}).value,
    description: (document.getElementById('description')||{}).value,
    requirements: (document.getElementById('requirements')||{}).value,
    payoutPerHerald: Number((document.getElementById('payout')||{}).value),
    maxHeralds: Number((document.getElementById('maxHeralds')||{}).value||1),
    mode: (document.getElementById('mode')||{}).value,
    category: (document.getElementById('category')||{}).value,
    contentType: (document.getElementById('contentType')||{}).value,
    difficulty: (document.getElementById('difficulty')||{}).value,
    deadline: (document.getElementById('deadline')||{}).value || undefined,
    codeMode: document.getElementById('codeMode-custom')?.checked ? 'custom' : 'auto',
    platformRequirements: taskPlatformReqs.length > 0 ? taskPlatformReqs : undefined,
    reqMode: taskReqMode,
    reqMinCount: taskReqMode === 'ANY_N' ? taskReqMinCount : undefined,
    dataMode: document.getElementById('dataMode-detail')?.checked ? 'DETAIL' : 'AGGREGATE',
    visibility: (document.getElementById('visibility')||{}).value || 'PUBLIC',
  };
  showFormError('');  // 清除旧错误
  if (!body.title || !body.description || !body.payoutPerHerald || !body.category) {
    showFormError(t('merchant.form.errRequired','请填写任务标题、描述、分类和报酬金额')); return;
  }

  // 发布前客户端额度预检（减少不必要的服务器往返）
  if (publish) {
    var rate  = (state.brandProfile && state.brandProfile.commission_rate) || 0.15;
    var total = Math.round(body.payoutPerHerald / (1 - rate)) * body.maxHeralds;
    var c        = brandBalance && brandBalance.credit;
    // 单笔任务只走一个资金池：钱包 OR 信用剩余，取较大值
    var wallet = brandBalance ? (brandBalance.available || 0) : 0;
    var creditLeft = c ? (c.creditRemaining || 0) : 0;
    var maxSingle = Math.max(wallet, creditLeft);
    if (maxSingle > 0 && total > maxSingle) {
      showFormError(t('merchant.form.errInsufficient','额度不足，本任务需 ¥{total}，当前最大可发 ¥{max}（钱包 ¥{wallet} / 信用剩余 ¥{credit}）。',{total:Number(total).toLocaleString(),max:Math.round(maxSingle).toLocaleString(),wallet:Math.round(wallet).toLocaleString(),credit:Math.round(creditLeft).toLocaleString()}));
      return;
    }
  }

  var isEdit = state.page === 'task_edit' && state.editingTask;
  var method = isEdit ? 'PUT' : 'POST';
  var path = isEdit ? '/tasks/'+state.editingTask.id : '/tasks';

  patch(method, path, body, function(d) {
    if (d.error) {
      var msg = d.error;
      if (d.details && d.details.length) {
        msg += '：' + d.details.map(function(e){ return (e.path||[]).join('.')+' '+e.message; }).join('；');
      }
      showFormError(msg); return;
    }
    // 上传封面图（仅新建时，编辑时已在选文件时即时上传）
    if (!isEdit && _pendingCoverBlob) {
      var blob = _pendingCoverBlob;
      _pendingCoverBlob = null;
      uploadCoverToTask(d.id, blob, function(err, url) {
        if (!err && state.currentTask) state.currentTask.cover_image = url;
      });
    }
    loadMyTasks();
    loadDashStats();
    state.showOnboardFlow = false; // 引导流程内创建任务：无论接下来走直接发布还是推广码检查，都交还给正常路径

    if (publish && d.status === 'DRAFT') {
      if (body.mode === 'PERFORMANCE') {
        doPublishWithCodeCheck(d.id);
      } else {
        patch('PATCH', '/tasks/'+d.id+'/publish', {}, function(p) {
          if (p.error) {
            var errMsg = p.error;
            if (p.code === 'INSUFFICIENT_CREDIT') {
              errMsg = t('merchant.form.errInsufficientPublish','额度不足，本任务需 ¥{needed}，当前剩余 ¥{cap}。请充值后再发布。',{needed:(p.needed||0).toLocaleString(),cap:Math.round((p.creditInfo||{}).totalCapacity||0).toLocaleString()});
            }
            showFormError(errMsg); return;
          }
          state.msg = t('merchant.publish.done','任务已发布！'); state.msgType = 'success';
          if (p.topupReminder) setTimeout(function(){ showTopupReminder(p.topupReminder); }, 400);
          loadMyTasks(); loadDashStats();
          openTask(d.id);
        });
      }
    } else {
      state.msg = isEdit ? t('merchant.toast.taskUpdated','任务已更新') : t('merchant.toast.draftSavedCheckCodes','草稿已保存，请检查推广码后点击「发布任务」使其生效');
      state.msgType = 'success';
      openTask(d.id);
    }
  });
}

function doPublishWithCodeCheck(id) {
  // 问题2+4：检查邀请码是否存在，并提示确认
  get('/tasks/'+id, function(taskData) {
    get('/tasks/'+id+'/codes', function(pool) {
      var codeCount = pool ? pool.total : 0;
      var isCustom = taskData.code_mode === 'custom';

      if (codeCount === 0) {
        openTask(id);
        showMsg(isCustom
          ? t('merchant.publish.needCodesFirst','请先上传推广码再发布：任务详情 → 上传推广码 → 发布任务')
          : t('merchant.taskDetail.codeGenError','推广码生成异常，请重新创建任务'),
          'error'
        );
        return;
      }

      // 问题4：确认邀请码有效性
      var msg = t('merchant.publish.confirmIntro','确认发布任务？')+'\n\n'
        + t('merchant.publish.codeCount','📋 任务共有 {n} 个推广码',{n:codeCount})+'\n'
        + (isCustom ? t('merchant.publish.customCodeWarn','⚠️ 请确认这些推广码已在 Remitly 等第三方系统中配置完成，发布后赫使将立即收到推广码。')
                    : t('merchant.publish.autoCodeWarn','⚠️ 系统已自动生成推广码，请确认已下载 CSV 并上传到第三方系统，否则赫使拿到的码将无法使用。'))
        + '\n\n'+t('merchant.publish.codeNotConfigured','推广码未配置到第三方系统将导致赫使推广无效。');

      showConfirmModal({
        title: t('merchant.publish.confirmCodesTitle','发布前确认推广码'),
        body: msg,
        confirmText: t('merchant.publish.confirmedGo','已确认，发布'),
        cancelText: t('merchant.publish.backToCheck','返回检查'),
        onConfirm: function() {
          patch('PATCH', '/tasks/'+id+'/publish', {}, function(p) {
            if (p.error) { showMsg(p.error, 'error'); return; }
            state.msg = t('merchant.publish.doneVisible','任务已发布！赫使现在可以看到并报名。'); state.msgType = 'success';
            loadMyTasks(); loadDashStats();
            openTask(id);
          });
        },
      });
    });
  });
}

function publishTask(id) {
  var task = state.currentTask;
  if (task && task.mode === 'PERFORMANCE') {
    doPublishWithCodeCheck(id);
  } else {
    var payout = task ? Number(task.payout_per_herald || 0) : 0;
    var mh     = task ? Number(task.max_heralds || 1) : 1;
    var rate   = (state.brandProfile && state.brandProfile.commission_rate) || 0.15;
    var cost   = Math.round(payout / (1 - rate));
    var fee    = cost - payout;
    var total  = cost * mh;
    var confirmBody = payout
      ? t('merchant.publish.costSummary','任务报酬 ¥{payout} / 人（赫使到手）\n平台服务费 ¥{fee} / 人（{pct}%）\n任务总支出 ¥{cost} × {n} 人 = ¥{total}\n\n发布后赫使即可在探索列表看到并报名。',{payout:Number(payout).toLocaleString(),fee:Number(fee).toLocaleString(),pct:(rate*100).toFixed(0),cost:Number(cost).toLocaleString(),n:mh,total:Number(total).toLocaleString()})
      : t('merchant.publish.publicHint','发布后赫使可在探索列表看到此任务并报名，确认信息无误后再发布。');
    showConfirmModal({
      title: t('merchant.publish.confirmTitle','确认发布任务'),
      body: confirmBody,
      confirmText: t('merchant.publish.confirmGo','确认发布'),
      onConfirm: function() {
        patch('PATCH', '/tasks/'+id+'/publish', {}, function(d) {
          if (d.error) {
            if (d.code === 'INSUFFICIENT_CREDIT') {
              var ci = d.creditInfo || {};
              showConfirmModal({
                title: t('merchant.publish.insufficientTitle','额度不足，需充值后发布'),
                body: t('merchant.publish.insufficientBody','本任务需 ¥{needed}，当前剩余 ¥{left}（可发额度 ¥{cap} - 已占用 ¥{used}）',{needed:Number(d.needed||0).toLocaleString(),left:Math.round(ci.totalCapacity||0).toLocaleString(),cap:Math.round(ci.taskCapacity||0).toLocaleString(),used:Math.round(ci.creditUsed||0).toLocaleString()}),
                confirmText: t('merchant.form.goTopup','去充值'),
                cancelText: t('merchant.publish.later','稍后再说'),
                onConfirm: function() { nav('wallet'); },
              });
            } else {
              showMsg(d.error, 'error');
            }
            return;
          }
          state.msg = t('merchant.publish.done','任务已发布！'); state.msgType = 'success';
          if (state.currentTask) state.currentTask.status = 'OPEN';
          loadMyTasks(); loadDashStats();
          if (d.topupReminder) setTimeout(function(){ showTopupReminder(d.topupReminder); }, 400);
          render();
        });
      },
    });
  }
}

function doCsvUpload() {
  var taskId = (document.getElementById('csv-task')||{}).value;
  var task = csvSelectedTask();
  var isDetail = task && task.data_mode === 'DETAIL';
  var raw = (document.getElementById('csv-data')||{}).value;
  var resultEl = document.getElementById('csv-result');
  if (!raw.trim()) { resultEl.innerHTML='<div class="alert alert-error">'+t('merchant.csv.errNoData','请粘贴数据或选择CSV文件')+'</div>'; return; }

  var lines = raw.trim().split('\n').map(function(l){return l.trim()}).filter(Boolean);
  if (lines.length < 2) { resultEl.innerHTML='<div class="alert alert-error">'+t('merchant.csv.errMinRows','数据至少需要2行（表头+数据）')+'</div>'; return; }

  // 解析第一行表头。列名支持中/日/英同义词（模板按界面语言生成，其他语言回落英文模板）
  var headers = lines[0].split(',').map(function(h){return h.trim().toLowerCase()});
  function findHeader(synonyms) {
    for (var hi = 0; hi < headers.length; hi++) {
      for (var si = 0; si < synonyms.length; si++) {
        if (headers[hi].indexOf(synonyms[si]) >= 0) return hi;
      }
    }
    return -1;
  }
  var codeIdx = headers.indexOf('code');
  if (codeIdx === -1) codeIdx = findHeader(['推广码','紹介コード','referral']);
  if (codeIdx === -1) { resultEl.innerHTML='<div class="alert alert-error">'+t('merchant.csv.errNoCodeCol','表头需要包含 "code" 列')+'</div>'; return; }

  var records = [];
  var i, cols, code;
  if (isDetail) {
    // 明细模式：code + 用户标识 + 是否完成交易
    var userIdx = findHeader(['邮箱','用户','メール','ユーザー','email','user']);
    var convIdx = findHeader(['交易','转化','取引','成約','コンバージョン','convert','txn']);
    if (userIdx === -1) { resultEl.innerHTML='<div class="alert alert-error">'+t('merchant.csv.errNoUserCol','该任务为<b>明细模式</b>，表头需要包含用户列（如「用户邮箱或ID」）——请下载对应模板')+'</div>'; return; }
    for (i = 1; i < lines.length; i++) {
      cols = lines[i].split(',');
      code = (cols[codeIdx]||'').trim();
      var user = (cols[userIdx]||'').trim();
      if (!code || !user) continue;
      records.push({ code: code, user: user, converted: convIdx >= 0 ? (cols[convIdx]||'').trim() : '0' });
    }
  } else {
    var regIdx = findHeader(['注册数','登録数','registered','registrations','signups']);
    var usedIdx = findHeader(['使用数','利用数','used','usage']);
    if (regIdx === -1 && usedIdx === -1) { resultEl.innerHTML='<div class="alert alert-error">'+t('merchant.csv.errNoAggCols','该任务为<b>汇总模式</b>，表头需要「注册数」「使用数」列——请下载对应模板')+'</div>'; return; }
    for (i = 1; i < lines.length; i++) {
      cols = lines[i].split(',');
      code = (cols[codeIdx]||'').trim();
      if (!code) continue;
      var regCount = regIdx >= 0 ? parseInt(cols[regIdx]||'0',10) : 0;
      var usedCount = usedIdx >= 0 ? parseInt(cols[usedIdx]||'0',10) : 0;
      records.push({ code: code, registered_count: isNaN(regCount)?0:regCount, used_count: isNaN(usedCount)?0:usedCount });
    }
  }

  if (!records.length) { resultEl.innerHTML='<div class="alert alert-error">'+t('merchant.csv.errNoValidRows','没有有效的数据行')+'</div>'; return; }

  post('/tasks/' + taskId + '/csv', { records: records }, function(d) {
    if (d.error) { resultEl.innerHTML = '<div class="alert alert-error">'+esc(d.error)+'</div>'; return; }
    var html = '';
    if (d.processed > 0) {
      // 品牌方视角响应不含金额字段（totalPaid undefined），只展示数量
      html += d.totalPaid !== undefined
        ? '<div class="alert alert-success">'+t('merchant.csv.resultPaid','生效 {n} 条，新增转化 {conv} 次，结算 ¥{paid}（单价 ¥{unit}/次）',{n:d.processed,conv:d.newConversions||0,paid:Number(d.totalPaid||0).toLocaleString(),unit:Number(d.commissionPerConversion||0).toLocaleString()})+'</div>'
        : '<div class="alert alert-success">'+t('merchant.csv.resultUnpaid','生效 {n} 条，新增转化 {conv} 次（结算由代理方处理）',{n:d.processed,conv:d.newConversions||0})+'</div>';
    }
    if (d.skippedCodes && d.skippedCodes.length) {
      var hints = {};
      (d.skippedHints || []).forEach(function(h) { hints[h.code] = h.belongsTo; });
      html += '<div class="alert alert-error">⚠️ '+t('merchant.csv.resultSkipped','{n} 条未生效：',{n:d.skippedCodes.length})+'<br>'
        + d.skippedCodes.map(function(c) {
            return '<span style="font-family:monospace">'+esc(c)+'</span>'
              + (hints[c] ? ' — '+t('merchant.csv.codeBelongsTo','该码属于任务《{title}》，请在上方选择该任务后重新上传',{title:esc(hints[c])}) : ' — '+t('merchant.csv.codeNotFound','该码在所选任务下不存在，请检查拼写'));
          }).join('<br>')
        + '</div>';
    }
    if (d.blockedCodes && d.blockedCodes.length) {
      html += '<div class="alert alert-error">💰 '+esc(d.message||t('merchant.csv.partialUnsettled','部分推广码因余额不足未结算'))+'：<span style="font-family:monospace">'+esc(d.blockedCodes.join(', '))+'</span></div>';
    }
    if (d.multiCodeUsers && d.multiCodeUsers.length) {
      // 一人多码：不拦截，分别计费，透明提示（2026-07-17 定稿）
      html += '<div class="alert" style="background:#fffbeb;border:1px solid #fde68a;color:#78350f"><div style="font-weight:700;margin-bottom:6px">ℹ️ '+d.multiCodeUsers.length+' 位用户使用了多个推广码——已按各码分别计费</div>'
        + d.multiCodeUsers.map(function(m) {
            return '<div style="font-family:monospace;font-size:12px;margin-bottom:4px">'+esc(m.user)+' → '+esc((m.codes||[]).join(' + '))+'</div>';
          }).join('')
        +'<div style="font-size:12px;margin-top:6px">'+t('merchant.csv.multiCodeHint','如不希望同一用户产生多份报酬，请在你的系统侧限制一人只能使用一个推广码。')+'</div></div>';
    }
    if (!html) html = '<div class="alert alert-error">'+t('merchant.csv.errNoneProcessed','没有任何记录被处理，请检查数据格式')+'</div>';
    resultEl.innerHTML = html;
  });
}

function tryResumeSwitchedSession() {
  var token = sessionStorage.getItem('herix_switch_token');
  if (!token) return false;
  sessionStorage.removeItem('herix_switch_token');
  sessionStorage.removeItem('herix_switch_role');
  state.token = token;
  get('/auth/me', function(d) {
    if (d.error || !d.id) { state.token = null; render(); return; }
    var roles = d.roles || [d.role];
    if (!roles.includes('BRAND')) {
      // 切到的账号没有品牌身份，跳转到赫使端
      sessionStorage.setItem('herix_switch_token', state.token);
      window.location.href = 'herix.html';
      return;
    }
    state.user = {
      id: d.id, nickname: d.nickname, role: d.role, roles: roles,
      isVerified: !!d.is_verified, is_onboarded: !!d.brand_onboarded,
    };
    state.brandProfile = d;
    loadDashStats(); loadMyTasks();
    handleBrandBindFromUrl();
  });
  return true;
}

function closeSidebar() {

/* ── 分享海报 ── */

  if (!task) return;

  var ov = document.createElement('div');
  ov.id = 'poster-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML =
    '<div style="background:#fff;border-radius:20px;padding:24px;width:360px;max-width:100%;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px">'
    +'<div style="display:flex;align-items:center;justify-content:space-between">'
    +'<span style="font-weight:700;font-size:15px">'+t('merchant.poster.title','分享海报')+'</span>'
    +'<button onclick="document.getElementById(\'poster-overlay\').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#888;line-height:1">✕</button>'
    +'</div>'
    +'<canvas id="share-canvas" style="width:100%;border-radius:12px;display:block"></canvas>'
    +'<div style="display:flex;gap:10px">'
    +'<button class="btn btn-primary" style="flex:1" onclick="downloadPoster()">'+t('merchant.poster.download','下载图片')+'</button>'
    +'<button class="btn btn-outline" style="flex:1" onclick="copyInviteLink(\''+taskId+'\')">'+t('merchant.taskDetail.copyLink','复制链接')+'</button>'
    +'</div>'
    +'<div style="font-size:11px;color:#888;text-align:center">'+t('merchant.poster.saveHint','长按或右键图片保存，或点击「下载图片」')+'</div>'
    +'</div>';
  document.body.appendChild(ov);
