services:
  - type: web
    name: herix
    env: node
    region: singapore
    plan: free
    buildCommand: cd herix-server && npm install
    startCommand: cd herix-server && npx tsx src/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: herix-db
          property: connectionString

databases:
  - name: herix-db
    databaseName: herix
    region: singapore
    plan: free
