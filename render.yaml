services:
  - type: web
    name: herix
    env: node
    region: singapore
    plan: free
    buildCommand: >
      cd herix-server && npm install && npx tsc &&
      cd ../herix-miniapp && npm install && npx taro build --type h5
    startCommand: cd herix-server && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: herix-db
          property: connectionString

databases:
  - name: herix-db
    databaseName: herix
    region: singapore
    plan: free
